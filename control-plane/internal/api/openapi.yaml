      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: Request., content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/packages/requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Package firewall]
      operationId: getPackageRequest
      summary: Get one request with its resolved graph
      description: '**Roles:** any signed-in role.'
      responses:
        '200': { description: Request., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/packages/requests/{id}/decision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Package firewall]
      operationId: decidePackageRequest
      summary: Approve or reject a request
      description: 'Approve creates the graph''s approvals. **Roles:** Super Admin, InfoSec Approver.'
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Decision., content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/packages/requests/{id}/reanalyze:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Package firewall]
      operationId: reanalyzePackageRequest
      summary: Re-run resolution and analysis
      description: '**Roles:** Super Admin, InfoSec Approver.'
      responses:
        '200': { description: Reanalyzing. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/packages/lookup:
    get:
      tags: [Package firewall]
      operationId: lookupPackage
      summary: Assessment preview for the request wizard
      description: 'Resolve and assess one version without creating a request. **Roles:** any signed-in role.'
      parameters:
        - { name: ecosystem, in: query, required: true, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: version, in: query, schema: { type: string } }
      responses:
        '200': { description: Assessed node., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: The registry could not be reached. }
  /api/packages/analysis/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Package firewall]
      operationId: getPackageAnalysis
      summary: Full sandbox report of one analysis
      description: 'URLs, syscalls, processes, file access and findings. Served from the node that received the worker result. **Roles:** any signed-in role.'
      responses:
        '200': { description: Report., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/packages/receivers:
    get:
      tags: [Package firewall]
      operationId: getPackageReceivers
      summary: Which servers obtained a package
      description: 'Incident recall over the flow telemetry. **Roles:** any signed-in role.'
      parameters:
        - { name: ecosystem, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: version, in: query, schema: { type: string } }
        - { name: sha256, in: query, schema: { type: string } }
      responses:
        '200': { description: Receivers., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/sandbox/jobs/claim:
    post:
      tags: [Sandbox]
      operationId: claimSandboxJob
      summary: Lease the next queued analysis job
      description: 'Authenticated with X-Aegis-Sandbox-Key. `200` with a job or `204` when the queue is empty.'
      security: [{ sandboxKey: [] }]
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: A leased job., content: { application/json: { schema: { type: object } } } }
        '204': { description: No job available. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/sandbox/jobs/{id}/heartbeat:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Sandbox]
      operationId: heartbeatSandboxJob
      summary: Extend a job's lease
      description: 'Authenticated with X-Aegis-Sandbox-Key.'
      security: [{ sandboxKey: [] }]
      responses:
        '200': { description: Lease extended., content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sandbox/jobs/{id}/result:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Sandbox]
      operationId: reportSandboxResult
      summary: Submit an analysis report or error
      description: 'Authenticated with X-Aegis-Sandbox-Key. The assessment is updated and dependent requests advance.'
      security: [{ sandboxKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aegis_session
      description: |
        HttpOnly session cookie set by `POST /api/auth/login` or single sign-on (`SameSite=Strict` by default).

        **CSRF requirement:** cookie-authenticated requests with an unsafe method (`POST`, `PUT`, `PATCH`,
        `DELETE`) must send a non-empty `X-Requested-With` header (the console sends
        `X-Requested-With: aegis-ui`), and an `Origin` header, when present, must be same-origin (request host,
        `AEGIS_PUBLIC_URL` host or an `AEGIS_CORS_ORIGINS` entry). Otherwise `403`. A rejected (expired or
        revoked) session cookie is cleared with `Set-Cookie`.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User session token (HS256 JWT) returned as `token` by `POST /api/auth/login` when the request has no
        `X-Requested-With` header. Send `Authorization: Bearer <token>`. Valid for the configured session TTL;
        revoked by logout, password change/reset, role or group changes and account deactivation. Not
        subject to the CSRF check.
    serviceAccountKey:
      type: http
      scheme: bearer
      bearerFormat: aegis_sa_<key>
      description: |
        Service-account API key (`Authorization: Bearer aegis_sa_…`), created by a Super Admin
        (`POST /api/service-accounts`) and shown once. Checked for expiry, disabled state and the
        source-CIDR allowlist on every request. Service accounts can hold every role except `SUPER_ADMIN`.
        Not subject to the CSRF check. Recommended for SOAR/ITSM integrations.
    dataPlaneKey:
      type: apiKey
      in: header
      name: X-Aegis-DataPlane-Key
      description: Shared data-plane key (`AEGIS_DATAPLANE_KEY`) of mitmproxy workers. Only accepted by `/api/dataplane/*`.
    sandboxKey:
      type: apiKey
      in: header
      name: X-Aegis-Sandbox-Key
      description: Shared sandbox key (`AEGIS_SANDBOX_KEY`) of package analysis workers. Only accepted by `/api/sandbox/*`.
    metricsToken:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <AEGIS_METRICS_TOKEN>` for `GET /metrics` (only enforced when configured).'

    scimToken:
      type: http
      scheme: bearer
      bearerFormat: aegis_scim_<token>
      description: |
        SCIM provisioning token (`Authorization: Bearer aegis_scim_…`), created by a Super Admin
        (`POST /api/settings/scim/tokens`) and shown once; only its SHA-256 digest is stored. Accepted only by
        `/api/scim/v2/*`, which in turn accepts no other credential (no session cookies, user tokens or
        service-account keys).

  parameters:
    ClientKeyId:
      name: kid
      in: path
      required: true
      description: Client key ID (RFC 7638 JWK thumbprint).
      schema:
        type: string
    SCIMTokenId:
      name: id
      in: path
      required: true
      description: SCIM token ID (`scimtok-…`).
      schema:
        type: string
    SCIMResourceId:
      name: id
      in: path
      required: true
      description: SCIM resource id (users `usr-…`, groups `scg-…`).
      schema:
        type: string
    SCIMFilter:
      name: filter
      in: query
      required: false
      description: SCIM filter expression (RFC 7644 section 3.4.2.2), e.g. `userName eq "a@corp.example"`.
      schema:
        type: string
        maxLength: 4096
    SCIMStartIndex:
      name: startIndex
      in: query
      required: false
      description: 1-based index of the first result (values below 1 are treated as 1).
      schema:
        type: integer
        default: 1
    SCIMCount:
      name: count
      in: query
      required: false
      description: Page size (default and maximum 200; `0` returns only `totalResults`).
      schema:
        type: integer
        default: 200
        maximum: 200
    SCIMAttributes:
      name: attributes
      in: query
      required: false
      description: Comma-separated attributes to return (`id` and `schemas` are always returned).
      schema:
        type: string
    SCIMExcludedAttributes:
      name: excludedAttributes
      in: query
      required: false
      description: Comma-separated attributes to omit, e.g. `members`.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Update only if the resource still has this version (`W/"<n>"`); otherwise `412`.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: '`304 Not Modified` when the resource has this version.'
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      description: User ID (`usr-…`).
      schema:
        type: string
    ServiceAccountId:
      name: id
      in: path
      required: true
      description: Service account ID.
      schema:
        type: string
    PolicySetId:
      name: id
      in: path
      required: true
      description: Policy set ID (`ps-…`, or `approvals-<group id>` for approvals sets).
      schema:
        type: string
    VersionNumber:
      name: version
      in: path
      required: true
      description: Published version number.
      schema:
        type: integer
        minimum: 1
    ChangeRequestId:
      name: id
      in: path
      required: true
      description: Change request ID (`cr-…`).
      schema:
        type: string
    AccessRequestId:
      name: id
      in: path
      required: true
      description: Access request ID (`req-…`).
      schema:
        type: string
    SessionId:
      name: id
      in: path
      required: true
      description: Learning session ID (`sess-…`).
      schema:
        type: string
    TLSBypassId:
      name: id
      in: path
      required: true
      description: TLS no-break exception ID (`tls-…`).
      schema:
        type: string
    ServerId:
      name: id
      in: path
      required: true
      description: Server ID.
      schema:
        type: string
    GroupId:
      name: id
      in: path
      required: true
      description: Server group ID.
      schema:
        type: string
    FeedId:
      name: id
      in: path
      required: true
      description: Threat feed ID.
      schema:
        type: string
    IndicatorId:
      name: id
      in: path
      required: true
      description: Custom indicator ID.
      schema:
        type: string
    ExceptionId:
      name: id
      in: path
      required: true
      description: Threat exception ID (`tex-…`).
      schema:
        type: string
    SecurityEventId:
      name: id
      in: path
      required: true
      description: Security event ID.
      schema:
        type: string
    YaraRuleSetId:
      name: id
      in: path
      required: true
      description: YARA rule set ID (`yara-…`).
      schema:
        type: string
    ExportSinkId:
      name: id
      in: path
      required: true
      description: Log export destination ID (`exp-…`).
      schema:
        type: string
    BlockPageId:
      name: id
      in: path
      required: true
      description: Block page template ID (`bp-…`).
      schema:
        type: string
    DataPlaneIdHeader:
      name: X-Aegis-DataPlane-ID
      in: header
      required: false
      description: Worker ID (max 64 characters; default `dp-<client IP>`).
      schema:
        type: string
        maxLength: 64
    DataPlaneVersionHeader:
      name: X-Aegis-DataPlane-Version
      in: header
      required: false
      description: Worker version (max 32 characters).
      schema:
        type: string
        maxLength: 32
    DataPlaneClamAVHeader:
      name: X-Aegis-ClamAV
      in: header
      required: false
      description: ClamAV availability reported by the worker (max 16 characters).
      schema:
        type: string
        maxLength: 16
    DataPlaneYARAHeader:
      name: X-Aegis-YARA
      in: header
      required: false
      description: YARA engine / rule compilation status reported by the worker (max 320 characters).
      schema:
        type: string
        maxLength: 320
    DataPlaneICAPHeader:
      name: X-Aegis-ICAP
      in: header
      required: false
      description: ICAP status reported by the worker (max 160 characters).
      schema:
        type: string
        maxLength: 160
    DataPlaneThreatVersionHeader:
      name: X-Aegis-Threat-Version
      in: header
      required: false
      description: Threat-intelligence snapshot version currently loaded by the worker.
      schema:
        type: string
    DataPlanePolicyAgeHeader:
      name: X-Aegis-Policy-Age
      in: header
      required: false
      description: Seconds since the worker last loaded a policy bundle (empty before the first one).
      schema:
        type: string
    DataPlanePolicyMaxAgeHeader:
      name: X-Aegis-Policy-Max-Age
      in: header
      required: false
      description: The worker's `AEGIS_POLICY_MAX_AGE` in seconds (0 = no limit).
      schema:
        type: string
    DataPlaneFlowsDroppedHeader:
      name: X-Aegis-Flows-Dropped
      in: header
      required: false
      description: Flow records the worker lost since it started, by reason (`0` or e.g. `overflow=12,spool_full=3`).
      schema:
        type: string
        maxLength: 256
    DataPlaneFlowBacklogHeader:
      name: X-Aegis-Flow-Backlog
      in: header
      required: false
      description: Flow records waiting for delivery (memory queue and spool).
      schema:
        type: string

  headers:
    ETag:
      description: Entity tag of the representation.
      schema:
        type: string
    ContentDisposition:
      description: Attachment / inline file name.
      schema:
        type: string
    Location:
      description: Redirect target.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  responses:
    SCIMBadRequest:
      description: 'Invalid request (`scimType`: `invalidFilter`, `invalidPath`, `invalidValue`, `invalidSyntax`, `mutability`, `noTarget`, `tooMany`).'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/SCIMError'
          example:
            schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
            status: '400'
            scimType: invalidFilter
            detail: unknown operator "xx"
    SCIMUnauthorized:
      description: 'Missing, unknown, rotated, revoked or expired SCIM token (`WWW-Authenticate: Bearer`).'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/SCIMError'
    SCIMDisabled:
      description: SCIM provisioning is disabled in AegisProxy.
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/SCIMError'
    SCIMNotFound:
      description: The resource does not exist (or is not a SCIM resource, such as a local account).
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/SCIMError'
    SCIMConflict:
      description: '`userName` or group `displayName` already exists (`scimType: uniqueness`).'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/SCIMError'
    SCIMPreconditionFailed:
      description: '`If-Match` does not match the current version.'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/SCIMError'
    SCIMPayloadTooLarge:
      description: Request body larger than 8 MiB.
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/SCIMError'
    SCIMUnsupportedMediaType:
      description: '`Content-Type` is neither `application/scim+json` nor `application/json`.'
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/SCIMError'
    Deleted:
      description: Deleted (`{"status":"deleted"}`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
          example:
            status: deleted
    BadRequest:
      description: Invalid JSON, empty body or validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid JSON payload
    Unauthorized:
      description: Missing, invalid, expired or revoked credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: authentication required
    DataPlaneUnauthorized:
      description: Missing or invalid `X-Aegis-DataPlane-Key`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Unauthorized data-plane worker: valid X-Aegis-DataPlane-Key required'
    Forbidden:
      description: 'The caller''s role or group scope does not permit the action (`RBAC Policy: …`), or the CSRF check failed for a cookie-authenticated unsafe request.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'RBAC Policy: only InfoSec Approvers and Super Admins can perform this action'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found
    Conflict:
      description: Conflict with the current state (duplicate name, already decided, already in use).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body too large (1 MiB; 16 MiB for data-plane and indicator endpoints).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request body too large
    UnsupportedMediaType:
      description: '`Content-Type` is present but not `application/json`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Content-Type must be application/json
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TelemetryUnavailable:
      description: The flows could not be stored durably (flow journal not writable, PostgreSQL unavailable). Nothing was acknowledged; retry after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: A required subsystem (threat intelligence, log export) is not initialized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # -------------------------------------------------------------------------
    # Common
    # -------------------------------------------------------------------------
    Error:
      type: object
      description: Error body returned by every failing JSON endpoint.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message. Authorization failures start with `RBAC Policy:`.
      examples:
        - error: 'RBAC Policy: only Super Admins can manage user accounts'
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Outcome, e.g. `deleted`, `updated`, `discarded`, `withdrawn`, `acknowledged`, `signed_out`, `password_changed`, `refresh_scheduled`, `queued`.
    OkResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
          description: Failure reason when `ok` is false.
    RecordedCount:
      type: object
      required: [recorded]
      properties:
        recorded:
          type: integer
    Role:
      type: string
      description: |
        Console role. `SUPER_ADMIN` – full control including identities; `INFOSEC_APPROVER` – system
        administration and approvals for all groups; `TEAM_LEAD_APPROVER` – approvals for `allowed_groups`;
        `OPERATOR_AUDITOR` – read-only.
      enum: [SUPER_ADMIN, INFOSEC_APPROVER, TEAM_LEAD_APPROVER, OPERATOR_AUDITOR]
    Verdict:
      type: string
      description: |
        Flow / evaluation verdict shared by control-plane, data-plane and console. Allowed verdicts:
        `ALLOWED`, `LEARNING_ALLOWED`, `REDIRECT_OBJECT_ALLOWED`, `TLS_BYPASS`. `BLOCKED` is the default-deny
        whitelist verdict; `THREAT_BLOCKED`, `MALWARE_BLOCKED`, `DLP_BLOCKED`, `FILETYPE_BLOCKED`,
        `POLICY_BLOCKED` and `QUARANTINED` come from threat protection; `AUTH_FAILED` marks presented proxy credentials
        that identify no server (HTTP 407, `block_reason` `invalid_proxy_token` or `proxy_token_required`); `SIMULATED`
        marks dry-run records.
      enum: [ALLOWED, BLOCKED, LEARNING_ALLOWED, REDIRECT_OBJECT_ALLOWED, TLS_BYPASS, THREAT_BLOCKED, MALWARE_BLOCKED, DLP_BLOCKED, FILETYPE_BLOCKED, POLICY_BLOCKED, QUARANTINED, AUTH_FAILED, SIMULATED]
    HTTPMethod:
      type: string
      description: HTTP method of a rule (`*` = any method).
      enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS, CONNECT, '*']
    StringMap:
      type: object
      additionalProperties:
        type: string

    # -------------------------------------------------------------------------
    # System
    # -------------------------------------------------------------------------
    ReadyStatus:
      type: object
      required: [status, revision, storage]
      properties:
        status:
          type: string
          enum: [ready]
        revision:
          type: integer
          format: int64
          description: Current configuration revision.
        storage:
          type: string
          description: Storage backend name (file or PostgreSQL cluster).
    PostureCheck:
      type: object
      required: [id, category, title, status, detail]
      properties:
        id:
          type: string
          examples: [tls, demo, encryption, sso, four-eyes, audit-chain]
        category:
          type: string
          enum: [identity, data, detection, governance, platform]
        title:
          type: string
        status:
          type: string
          enum: [pass, warn, fail, info]
        detail:
          type: string
        remediation:
          type: string
        doc_link:
          type: string
          description: Documentation path in the product repository, e.g. `docs/security.md#hardening-checklist`.
        doc_url:
          type: string
          format: uri
          description: '`doc_link` resolved against `AEGIS_DOCS_URL` (only when configured).'
    PostureReport:
      type: object
      required: [score, checks, generated_at]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        checks:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/PostureCheck'
        generated_at:
          type: string
          format: date-time
    DataPlaneStatus:
      type: object
      description: Last heartbeat of a data-plane worker (reported on bundle / threat-intel sync).
      required: [id, version, remote_ip, last_seen_at, bundle_revision, threat_intel_version, clamav_available, yara_status, icap_status, healthy]
      properties:
        id:
          type: string
        version:
          type: string
        remote_ip:
          type: string
        last_seen_at:
          type: string
          format: date-time
        bundle_revision:
          type: string
        threat_intel_version:
          type: string
        clamav_available:
          type: string
        yara_status:
          type: string
        icap_status:
          type: string
        healthy:
          type: boolean
          description: Heartbeat within the last 60 seconds.
        policy_age_seconds:
          type: integer
          format: int64
          description: Age of the worker's policy at the last heartbeat; -1 = not reported.
        policy_max_age_seconds:
          type: integer
          format: int64
          description: The worker's `AEGIS_POLICY_MAX_AGE` in seconds; 0 = no limit, -1 = not reported.
        flow_backlog:
          type: integer
          format: int64
          description: Flow records waiting for delivery on the worker.
        flows_dropped:
          type: object
          description: Flow records the worker lost since it started, by reason (`overflow`, `spool_full`, `rejected`, `spool_corrupt`).
          additionalProperties:
            type: integer
            format: int64
        flows_dropped_total:
          type: integer
          format: int64
    OverviewStats:
      type: object
      description: Work-queue counters for the console home page. Keys with value 0 are omitted. Team Leads only count requests of their groups.
      properties:
        pending_requests:
          type: integer
        overdue_requests:
          type: integer
        assigned_to_me:
          type: integer
        open_change_requests:
          type: integer
        changes_to_review:
          type: integer
        recertification_overdue:
          type: integer
        recertification_due_soon:
          type: integer
        drafts:
          type: integer
        quarantined_servers:
          type: integer
        stale_servers:
          type: integer
      additionalProperties:
        type: integer
    FlowStats:
      type: object
      description: Verdict counters over the recorded traffic window.
      required: [allowed, blocked, bypass, learning, threats, open_security_events]
      properties:
        allowed:
          type: integer
        blocked:
          type: integer
        bypass:
          type: integer
        learning:
          type: integer
        threats:
          type: integer
        open_security_events:
          type: integer
    ConsoleSecurity:
      type: object
      required: [policy, feeds, indicators, exceptions, events, threat_intel, dlp_detectors, file_types]
      properties:
        policy:
          $ref: '#/components/schemas/SecurityPolicy'
        feeds:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ThreatFeed'
        indicators:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Indicator'
        exceptions:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ThreatException'
        events:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/SecurityEvent'
        threat_intel:
          $ref: '#/components/schemas/ThreatIntelStatus'
        dlp_detectors:
          type: array
          description: DLP detector IDs implemented by the data-plane.
          items:
            type: string
        file_types:
          type: array
          description: File type IDs the data-plane can detect.
          items:
            type: string
    ConsoleState:
      type: object
      description: Complete console state. Empty collections may be serialized as `null`.
      required: [revision, version, demo_mode, fleet_total_servers, groups, servers, rules, policy_sets, change_requests, governance, block_pages, overview, proxy_address, tls_bypass, sessions, requests, users, entra_config, notify_config, notification_logs, audit_events, bandwidth, stats, data_planes, security]
      properties:
        revision:
          type: integer
          format: int64
        version:
          type: string
        demo_mode:
          type: boolean
        fleet_total_servers:
          type: integer
          description: Sum of the declared `server_count` of all groups.
        groups:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ServerGroup'
        servers:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Server'
        rules:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/PolicyRule'
        policy_sets:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/PolicySet'
        change_requests:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ChangeRequest'
        governance:
          $ref: '#/components/schemas/GovernanceSettings'
        block_pages:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/BlockPageTemplate'
        overview:
          $ref: '#/components/schemas/OverviewStats'
        proxy_address:
          type: string
          description: host:port servers use as their HTTP(S) proxy.
        tls_bypass:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/TLSBypassRule'
        sessions:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/LearningSession'
        requests:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/AccessRequest'
        users:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/User'
        entra_config:
          $ref: '#/components/schemas/EntraIDConfig'
        notify_config:
          $ref: '#/components/schemas/NotificationConfig'
        notification_logs:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/NotificationLog'
        audit_events:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/AuditEvent'
        bandwidth:
          $ref: '#/components/schemas/BandwidthSummary'
        stats:
          $ref: '#/components/schemas/FlowStats'
        data_planes:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/DataPlaneStatus'
        security:
          $ref: '#/components/schemas/ConsoleSecurity'
        me:
          $ref: '#/components/schemas/User'
        flows:
          type: [array, 'null']
          description: Recorded traffic window (omitted with `exclude_flows=1`).
          items:
            $ref: '#/components/schemas/TrafficFlow'
    SimulateProxyRequestInput:
      type: object
      required: [full_url]
      properties:
        server_ip:
          type: string
          description: Source IP of the simulated server.
        proxy_auth_user:
          type: string
          description: Proxy-Authorization identity (`user:token`, a bare token, or a user name bound to the source IP).
        method:
          type: string
          default: GET
        full_url:
          type: string
          format: uri
          maxLength: 4096
          description: Absolute http(s) URL.
        user_agent:
          type: string
          default: curl/8.5.0
        simulate_redirect:
          type: boolean
          description: Simulate a CDN redirect for allowed github.com URLs whose rule follows redirects.
    SimulateProxyRequestResult:
      type: object
      required: [evaluation, flow, child_flow, cli_output, dry_run]
      properties:
        evaluation:
          $ref: '#/components/schemas/EvaluationResult'
        flow:
          $ref: '#/components/schemas/TrafficFlow'
        child_flow:
          description: Simulated redirect target flow, or null.
          oneOf:
            - $ref: '#/components/schemas/TrafficFlow'
            - type: 'null'
        cli_output:
          type: string
          description: Terminal block message (with block token and self-service instructions) when the request is blocked; empty otherwise.
        dry_run:
          type: boolean
          description: True when nothing was recorded.

    # -------------------------------------------------------------------------
    # Public
    # -------------------------------------------------------------------------
    PublicMeta:
      type: object
      required: [product, version, demo_mode, public_url, local_login_enabled, entra_enabled, sso]
      properties:
        product:
          type: string
          examples: [AegisProxy Enterprise]
        version:
          type: string
        demo_mode:
          type: boolean
        public_url:
          type: string
        local_login_enabled:
          type: boolean
        entra_enabled:
          type: boolean
          description: Single sign-on enabled (any provider).
        sso:
          type: object
          required: [enabled, provider, label, login_url, local_login_enabled]
          properties:
            enabled:
              type: boolean
            provider:
              type: string
              enum: [entra, oidc]
            label:
              type: string
              description: Label of the login button.
            login_url:
              type: string
              examples: [/api/auth/sso/login]
            local_login_enabled:
              type: boolean
    CAInfo:
      type: object
      required: [subject, issuer, serial, not_before, not_after, fingerprint, pem_content, public_url, download_crt, download_pem, download_der, pem_sha256, der_sha256, linux_script, windows_script, linux_script_sha256, windows_script_sha256, linux_command, windows_command]
      properties:
        subject:
          type: string
        issuer:
          type: string
        serial:
          type: string
          description: Serial number (hex).
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        fingerprint:
          type: string
          description: SHA-256 fingerprint (colon-separated hex).
        pem_content:
          type: string
        public_url:
          type: string
        download_crt:
          type: string
        download_pem:
          type: string
        download_der:
          type: string
        pem_sha256:
          type: string
          description: SHA-256 (hex) of the served PEM file (`aegis-ca.crt` / `aegis-ca.pem`), e.g. for `ADD --checksum` in a Dockerfile. Compare values with the console over https.
        der_sha256:
          type: string
          description: SHA-256 (hex) of the served DER file (`aegis-ca.der`).
        linux_script:
          type: string
        windows_script:
          type: string
        linux_script_sha256:
          type: string
          description: SHA-256 (hex) of the Linux installer as served by this deployment.
        windows_script_sha256:
          type: string
          description: SHA-256 (hex) of the Windows installer as served by this deployment.
        linux_command:
          type: string
          description: Copy-paste command that downloads the Linux installer into a fresh private directory (`mktemp -d`), verifies `linux_script_sha256` (`sha256sum -c`) and only then runs exactly that file with sudo.
        windows_command:
          type: string
          description: Copy-paste command for an elevated PowerShell that downloads the Windows installer into memory, verifies `windows_script_sha256`, writes exactly those bytes into a new random-named directory under `%TEMP%` (`CreateNew`) and only then runs that file with `-File`.
    PublicAccessRequestInput:
      type: object
      required: [reason]
      properties:
        block_token:
          type: string
          description: Data-plane-signed block token (from the block page or CLI block message). When present, server, URL, method and trace ID are taken from the token.
        trace_id:
          type: string
          description: Trace ID of the blocked request (without token).
        server_ip:
          type: string
          description: Ignored; the server is identified by the block token or the TCP source address.
        requested_url:
          type: string
          maxLength: 4096
          description: Absolute http(s) URL (only used without `block_token`).
        method:
          type: string
          description: HTTP method (only used without `block_token`; default GET).
        requester:
          type: string
          maxLength: 200
          description: Requester name / e-mail (default `operator@<server IP>`).
        reason:
          type: string
          maxLength: 2000
        requested_scope:
          type: string
          description: Requested rule scope (unknown values fall back to `prefix_with_objects`); must be offered by the server's block page template.
          enum: [prefix_with_objects, exact_path, domain, learning_session_15m]
        duration:
          type: string
          description: Requested access duration (default `24h`); must be offered by the server's block page template.
          enum: [1h, 24h, 7d, permanent]
    PublicAccessRequestResult:
      type: object
      required: [message, request]
      properties:
        message:
          type: string
        request:
          type: object
          required: [id, status, verified, server_hostname, suggested_host_pattern, suggested_path_pattern, created_at]
          properties:
            id:
              type: string
            status:
              $ref: '#/components/schemas/AccessRequestStatus'
            verified:
              type: boolean
            server_hostname:
              type: string
            suggested_host_pattern:
              type: string
            suggested_path_pattern:
              type: string
            created_at:
              type: string
              format: date-time
    PublicRequestOptions:
      type: object
      required: [verified, server_hostname, url, verdict, request_form, allowed_scopes, allowed_durations, company_name, support, default_locale]
      properties:
        verified:
          type: boolean
          description: True when a valid block token identified the server.
        server_hostname:
          type: string
        url:
          type: string
          description: Blocked URL (from the token; empty without token).
        verdict:
          type: string
          description: Verdict from the token (empty without token).
        request_form:
          type: boolean
          description: Whether the self-service request form may be shown.
        allowed_scopes:
          type: [array, 'null']
          items:
            type: string
        allowed_durations:
          type: [array, 'null']
          items:
            type: string
        company_name:
          type: string
        support:
          $ref: '#/components/schemas/SupportContact'
        default_locale:
          type: string

    # -------------------------------------------------------------------------
    # Auth, users, service accounts, SSO
    # -------------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 256
    LoginResponse:
      type: object
      required: [user, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/User'
        expires_at:
          type: string
          format: date-time
        token:
          type: string
          description: Bearer session token; only returned when the login request had no `X-Requested-With` header.
    MeUser:
      type: object
      required: [user, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/User'
        expires_at:
          type: string
          format: date-time
    MeServiceAccount:
      type: object
      required: [service_account]
      properties:
        service_account:
          type: object
          required: [id, name, role, allowed_groups]
          properties:
            id:
              type: string
            name:
              type: string
            role:
              $ref: '#/components/schemas/Role'
            allowed_groups:
              type: [array, 'null']
              items:
                type: string
    MeResponse:
      oneOf:
        - $ref: '#/components/schemas/MeUser'
        - $ref: '#/components/schemas/MeServiceAccount'
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
        new_password:
          type: string
          format: password
          writeOnly: true
          description: Must satisfy the password policy and differ from the current password.
    User:
      type: object
      required: [id, username, display_name, email, role, auth_provider, allowed_groups, department, created_at]
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        email:
          type: string
        role:
          description: Console role; empty for SCIM-provisioned accounts that are in no SCIM group mapped to a role (such accounts are disabled).
          anyOf:
            - $ref: '#/components/schemas/Role'
            - type: string
              const: ''
        auth_provider:
          type: string
          description: '`local` (password) or `oidc` (single sign-on, including SCIM-provisioned accounts).'
          examples: [local, oidc]
        allowed_groups:
          type: [array, 'null']
          description: Server groups a Team Lead may approve for (`*` = all). Empty lists may be serialized as null.
          items:
            type: string
        department:
          type: string
        disabled:
          type: boolean
        disabled_by_admin:
          type: boolean
          readOnly: true
          description: Locked out by an administrator. Unlike an automatic SSO deprovisioning this is not lifted by the next single sign-on.
        break_glass:
          type: boolean
          description: Break-glass accounts may always sign in with a password; every such login raises a security alert. Not available for SSO users.
        external_id:
          type: string
          description: Link to the IdP subject for single sign-on users.
        scim:
          $ref: '#/components/schemas/SCIMUserLink'
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        password_set_at:
          type: string
          format: date-time
        sessions_not_before:
          type: string
          format: date-time
          description: Sessions issued before this instant are revoked.
    UserInput:
      type: object
      required: [username, display_name, role]
      properties:
        id:
          type: string
          description: Existing user ID to update; omit to create.
        username:
          type: string
          description: 2-64 characters, lowercase letters, digits, `.`, `_`, `-` (lower-cased by the server).
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$'
        display_name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
        allowed_groups:
          type: array
          items:
            type: string
        department:
          type: string
          maxLength: 120
        disabled:
          type: boolean
        break_glass:
          type: boolean
          description: Only for Super Admins.
        password:
          type: string
          format: password
          writeOnly: true
          description: Optional initial/new password (password policy applies). Without it a new user gets a generated temporary password.
    UserUpsertResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporary_password:
          type: string
          description: Generated password (new users created without `password`); shown once.
    TemporaryPasswordResult:
      type: object
      required: [temporary_password]
      properties:
        temporary_password:
          type: string
          description: Shown once.
    ServiceAccount:
      type: object
      description: Non-human identity for automation. Only the SHA-256 digest of its key is stored.
      required: [id, name, description, role, allowed_groups, allowed_cidrs, disabled, key_prefix, expires_at, created_at, created_by]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        allowed_groups:
          type: array
          items:
            type: string
        allowed_cidrs:
          type: array
          description: Source networks the key may be used from (empty = any address).
          items:
            type: string
        disabled:
          type: boolean
        key_prefix:
          type: string
          description: First characters of the key, for identification.
        expires_at:
          type: string
          format: date-time
        key_rotated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        last_used_at:
          type: string
          format: date-time
        last_used_ip:
          type: string
    ServiceAccountInput:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          description: 2-64 characters, letters, digits, `.`, `_`, `-`; unique (case-insensitive).
        description:
          type: string
          maxLength: 500
        role:
          type: string
          description: Service accounts cannot be Super Admins.
          enum: [INFOSEC_APPROVER, TEAM_LEAD_APPROVER, OPERATOR_AUDITOR]
        allowed_groups:
          type: array
          description: Required (concrete groups, no `*`) for Team Leads; always `["*"]` for InfoSec Approvers.
          items:
            type: string
        allowed_cidrs:
          type: array
          maxItems: 50
          description: IPs or CIDRs allowed to use the key (empty = any).
          items:
            type: string
        disabled:
          type: boolean
        expires_at:
          type: string
          format: date-time
          description: Between 1 hour and 730 days from now (default one year).
    ServiceAccountCreated:
      type: object
      required: [service_account, api_key, note]
      properties:
        service_account:
          $ref: '#/components/schemas/ServiceAccount'
        api_key:
          type: string
          description: The API key (`aegis_sa_…`); shown only once.
        note:
          type: string
    ServiceAccountKeyRotated:
      type: object
      required: [service_account, api_key]
      properties:
        service_account:
          $ref: '#/components/schemas/ServiceAccount'
        api_key:
          type: string
          description: The new API key; shown only once.
    EntraIDConfig:
      type: object
      description: Single sign-on via OpenID Connect (Microsoft Entra ID or any OIDC provider such as Okta, Keycloak, ADFS, Ping, Google Workspace).
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [entra, oidc]
          default: entra
        display_name:
          type: string
          maxLength: 512
          description: Label of the login button.
        tenant_id:
          type: string
          description: Entra Directory (tenant) ID (GUID).
        client_id:
          type: string
          maxLength: 512
        client_secret:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
          description: Write-only. Empty or masked values keep the stored secret.
        has_client_secret:
          type: boolean
          readOnly: true
        issuer_url:
          type: string
          description: OIDC issuer (https). Derived from the tenant for Entra.
        redirect_uri:
          type: string
          description: Default `<public URL>/api/auth/sso/callback`; must end with `/api/auth/sso/callback`.
        scopes:
          type: [array, 'null']
          maxItems: 20
          items:
            type: string
        username_claim:
          type: string
          description: Default `preferred_username`.
        groups_claim:
          type: string
          description: Default `groups` (Entra app roles - `roles`).
        group_role_map:
          type: [object, 'null']
          description: IdP group (Entra object ID or app role value) → console role; the most privileged match wins. Users without a mapped group cannot sign in.
          additionalProperties:
            $ref: '#/components/schemas/Role'
        group_scope_map:
          type: [object, 'null']
          description: IdP group → server group IDs granted to Team Leads.
          additionalProperties:
            type: array
            items:
              type: string
        allow_local_login:
          type: boolean
          description: Keep password login for all local users; when false only break-glass accounts may use passwords.
        token_auth_method:
          type: string
          description: |
            Token endpoint client authentication: "" (auto: `client_secret_post` when advertised, otherwise
            `client_secret_basic`), `client_secret_post`, `client_secret_basic`, or `private_key_jwt` (RFC 7523
            client assertion signed with the active client key, see `/api/settings/sso/client-keys`; no client
            secret needed; enabling requires an active key).
          enum: ['', client_secret_post, client_secret_basic, private_key_jwt]
    SSOTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        issuer:
          type: string
        redirect_uri:
          type: string
        signing_keys:
          type: integer
          description: Usable signature keys found in the provider's JWKS.
        token_endpoint_auth_methods:
          type: array
          items:
            type: string
          description: token_endpoint_auth_methods_supported of the discovery document.
        jwks_uri:
          type: string
          description: JWKS URL of the control-plane client keys (for private_key_jwt).
        warnings:
          type: array
          items:
            type: string
          description: private_key_jwt problems (not advertised by the provider, no active client key).
        note:
          type: string
        error:
          type: string
    JWKSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            description: Public JWK (RFC 7517) - RSA (`n`, `e`) or EC P-256 (`crv`, `x`, `y`).
            required: [kty, kid, alg, use]
            properties:
              kty:
                type: string
                enum: [RSA, EC]
              kid:
                type: string
              alg:
                type: string
                enum: [RS256, ES256]
              use:
                type: string
                enum: [sig]
              n:
                type: string
              e:
                type: string
              crv:
                type: string
              x:
                type: string
              y:
                type: string
              x5c:
                type: array
                items:
                  type: string
              x5t:
                type: string
              x5t#S256:
                type: string
    SSOClientKey:
      type: object
      description: Key pair for private_key_jwt client authentication (public part; the private key is never returned).
      required: [kid, alg, status, certificate_pem, x5t, x5t_s256, not_after, created_at, created_by]
      properties:
        kid:
          type: string
          description: RFC 7638 JWK thumbprint, used as `kid` in the assertion header and the JWKS.
        alg:
          type: string
          enum: [RS256, ES256]
        status:
          type: string
          enum: [active, next, retired]
          description: '`active` signs assertions; `next` is published and waits for activation; `retired` is published until `published_until`.'
        certificate_pem:
          type: string
          description: Self-signed X.509 certificate (PEM).
        x5t:
          type: string
          description: base64url SHA-1 thumbprint of the certificate (sent as `x5t` header; Entra ID shows it hex-encoded).
        x5t_s256:
          type: string
        not_after:
          type: string
          format: date-time
          description: Certificate expiry (two years after generation); rotate before.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        activated_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time
        published_until:
          type: string
          format: date-time
    SSOClientKeyList:
      type: object
      required: [keys, jwks_uri]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/SSOClientKey'
        jwks_uri:
          type: string
          description: Public JWKS URL to register at the IdP.
        grace_period_hours:
          type: integer
        can_edit:
          type: boolean
    SCIMToken:
      type: object
      required: [id, name, prefix, created_at, created_by, expires_at]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: First characters of the token (`aegis_scim_xxxxxx`), for identification.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        expires_at:
          type: string
          format: date-time
        rotated_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: Recorded at most every 10 minutes.
        last_used_ip:
          type: string
    SCIMTokenIssued:
      type: object
      required: [token, secret, base_url]
      properties:
        token:
          $ref: '#/components/schemas/SCIMToken'
        secret:
          type: string
          description: The token value, shown only once.
        base_url:
          type: string
          description: SCIM base URL (Entra ID *Tenant URL*, Okta *SCIM connector base URL*).
        note:
          type: string
    SCIMSettings:
      type: object
      required: [status, base_url, can_edit]
      properties:
        base_url:
          type: string
          description: '`<AEGIS_PUBLIC_URL>/api/scim/v2`.'
        can_edit:
          type: boolean
        docs_url:
          type: string
          description: SCIM setup guide (only when `AEGIS_DOCS_URL` is configured).
        status:
          type: object
          required: [enabled, tokens, users, active_users, groups, changes]
          properties:
            enabled:
              type: boolean
            tokens:
              type: array
              items:
                $ref: '#/components/schemas/SCIMToken'
            users:
              type: integer
              description: SCIM-managed accounts (not deleted).
            active_users:
              type: integer
              description: Of those, enabled accounts.
            groups:
              type: integer
            changes:
              type: integer
              description: Provisioning changes since SCIM was set up.
            last_sync_at:
              type: string
              format: date-time
              description: Time of the last provisioning change.
            last_request_at:
              type: string
              format: date-time
              description: Last authenticated SCIM request (recorded at most every 10 minutes).
    SCIMUserLink:
      type: object
      description: Provisioning attributes of a SCIM-managed account (set by the SCIM client).
      required: [user_name, version, created, last_modified]
      properties:
        user_name:
          type: string
        external_id:
          type: string
        active:
          type: boolean
        display_name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        formatted:
          type: string
        title:
          type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              type:
                type: string
              primary:
                type: boolean
        department:
          type: string
        deleted:
          type: boolean
          description: Deleted by the SCIM client (account kept disabled for the audit trail).
        version:
          type: integer
        created:
          type: string
          format: date-time
        last_modified:
          type: string
          format: date-time
    SCIMError:
      type: object
      required: [schemas, status]
      properties:
        schemas:
          type: array
          items:
            type: string
            const: urn:ietf:params:scim:api:messages:2.0:Error
        status:
          type: string
          description: HTTP status as a string.
        scimType:
          type: string
        detail:
          type: string
    SCIMObject:
      type: object
      description: SCIM discovery document (ServiceProviderConfig, ResourceType or Schema, RFC 7643 sections 5-7).
      required: [schemas]
      properties:
        schemas:
          type: array
          items:
            type: string
      additionalProperties: true
    SCIMListResponse:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas:
          type: array
          items:
            type: string
            const: urn:ietf:params:scim:api:messages:2.0:ListResponse
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            type: object
            additionalProperties: true
    SCIMSearchRequest:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
            const: urn:ietf:params:scim:api:messages:2.0:SearchRequest
        filter:
          type: string
        startIndex:
          type: integer
        count:
          type: integer
        attributes:
          type: array
          items:
            type: string
        excludedAttributes:
          type: array
          items:
            type: string
    SCIMPatchOp:
      type: object
      required: [Operations]
      properties:
        schemas:
          type: array
          items:
            type: string
            const: urn:ietf:params:scim:api:messages:2.0:PatchOp
        Operations:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                description: '`add`, `replace` or `remove` (case-insensitive).'
              path:
                type: string
                description: Attribute path, optionally with a value filter and sub-attribute, e.g. `emails[type eq "work"].value`.
              value:
                description: New value; an object of attributes when `path` is omitted.
      example:
        schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
        Operations:
          - op: Replace
            path: active
            value: false
    SCIMUser:
      type: object
      description: SCIM User (core schema subset and enterprise extension `department`).
      required: [userName]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          readOnly: true
        externalId:
          type: string
          description: IdP identifier (Entra ID objectId when mapped, Okta user id); links the first single sign-on (`oid`/`sub`).
        userName:
          type: string
          description: Unique (case-insensitive); becomes the console username (`@` → `.`).
        name:
          type: object
          properties:
            formatted:
              type: string
            familyName:
              type: string
            givenName:
              type: string
        displayName:
          type: string
        title:
          type: string
        active:
          type: [boolean, string]
          description: false disables the account and revokes its sessions (`"True"`/`"False"` strings are accepted).
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              type:
                type: string
              primary:
                type: boolean
        groups:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              value:
                type: string
              $ref:
                type: string
              display:
                type: string
              type:
                type: string
        urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:
          type: object
          properties:
            department:
              type: string
        meta:
          $ref: '#/components/schemas/SCIMMeta'
      additionalProperties: true
    SCIMGroup:
      type: object
      required: [displayName]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
          readOnly: true
        externalId:
          type: string
          description: Entra ID group objectId; matched against the SSO group mapping like `displayName`.
        displayName:
          type: string
        members:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value:
                type: string
                description: User id (`usr-…`).
              $ref:
                type: string
              type:
                type: string
        meta:
          $ref: '#/components/schemas/SCIMMeta'
      additionalProperties: true
    SCIMMeta:
      type: object
      readOnly: true
      properties:
        resourceType:
          type: string
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        location:
          type: string
        version:
          type: string
          description: Weak ETag `W/"<n>"`.

    # -------------------------------------------------------------------------
    # Policy sets & change management
    # -------------------------------------------------------------------------
    PolicyRule:
      type: object
      description: |
        Whitelist (ALLOW) or guardrail (BLOCK) rule. Rules inside a policy set carry no scope of their own -
        the set's assignment applies; effective rules (`GET /api/rules`) carry the compiled scope and set
        attribution. Server-maintained fields are ignored on input. Empty lists may be serialized as null.
      required: [name, host_pattern]
      properties:
        id:
          type: string
          description: Kept across edits; new rules get an ID on save.
        version:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        action:
          type: string
          description: Default ALLOW (input is case-insensitive). Team Leads cannot create or change BLOCK rules.
          enum: [ALLOW, BLOCK]
        host_pattern:
          type: string
          description: '`example.com`, `*.example.com`, an IP literal or `*` (catch-all ALLOW rules: Super Admins only).'
        path_pattern:
          type: string
          description: Path glob starting with `/` (default `/**`), matched against the canonicalized path (query ignored). `*` as a
            whole segment is exactly one non-empty segment (`/simple/*` matches `/simple/requests`, not `/simple` or `/simple/a/b`),
            inside a segment any characters except `/`; `/**` is zero or more segments (`/acme/**` matches `/acme` and everything
            below); `**` inside a segment spans `/` (`/release-asset-**`).
        methods:
          type: [array, 'null']
          description: Default `["GET","HEAD"]`.
          items:
            $ref: '#/components/schemas/HTTPMethod'
        follow_redirects:
          type: boolean
          description: Allow redirect targets (e.g. CDN objects) of matching requests.
        redirect_hosts:
          type: [array, 'null']
          maxItems: 20
          description: Optional allowlist of host patterns (`objects.example`, `*.cdn.example`) that redirects of this rule may grant access to. Empty or omitted means any public host (internal destinations never receive a grant).
          items:
            type: string
        companion_rules:
          type: [array, 'null']
          maxItems: 20
          description: Additional `host/path` patterns allowed together with this rule.
          items:
            type: string
        group_ids:
          type: [array, 'null']
          items:
            type: string
        server_ids:
          type: [array, 'null']
          items:
            type: string
        created_by:
          type: string
          readOnly: true
        approved_by:
          type: string
          readOnly: true
        source_session_id:
          type: string
          readOnly: true
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          description: Optional expiry (must be in the future).
        hit_count:
          type: integer
          format: int64
          readOnly: true
        total_bytes:
          type: integer
          format: int64
          readOnly: true
        policy_set_id:
          type: string
          readOnly: true
        policy_set_name:
          type: string
          readOnly: true
        access_request_id:
          type: string
          readOnly: true
    PolicySetKind:
      type: string
      description: '`standard` - assigned to groups and/or servers; `baseline` - applies to every registered server; `approvals` - system-managed set of approved access requests of one group.'
      enum: [standard, baseline, approvals]
    PolicySetSpec:
      type: object
      description: Editable content of a policy set (carried by drafts and change requests).
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        owner_team:
          type: string
        tags:
          type: [array, 'null']
          maxItems: 20
          items:
            type: string
        priority:
          type: integer
        enabled:
          type: boolean
        group_ids:
          type: [array, 'null']
          items:
            type: string
        server_ids:
          type: [array, 'null']
          items:
            type: string
        rules:
          type: [array, 'null']
          maxItems: 500
          items:
            $ref: '#/components/schemas/PolicyRule'
        review_interval_days:
          type: integer
          minimum: 0
          maximum: 730
          description: Recertification interval (0 disables recertification for the set).
    PolicySetDraft:
      type: object
      required: [spec, base_version, status, updated_by, updated_at]
      properties:
        spec:
          $ref: '#/components/schemas/PolicySetSpec'
        base_version:
          type: integer
        status:
          type: string
          enum: [editing, in_review]
        change_request_id:
          type: string
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time
    PolicySet:
      description: A policy set. The published content (`PolicySetSpec` fields) is flattened into the object.
      allOf:
        - $ref: '#/components/schemas/PolicySetSpec'
        - type: object
          required: [id, kind, version, created_at, created_by]
          properties:
            id:
              type: string
            kind:
              $ref: '#/components/schemas/PolicySetKind'
            version:
              type: integer
              description: Published version (0 = never published).
            published_at:
              type: string
              format: date-time
            published_by:
              type: string
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
            last_reviewed_at:
              type: string
              format: date-time
            last_reviewed_by:
              type: string
            draft:
              $ref: '#/components/schemas/PolicySetDraft'
            review_due_at:
              type: string
              format: date-time
            review_state:
              type: string
              enum: [ok, due_soon, overdue]
    PolicySetVersion:
      type: object
      description: Immutable snapshot of a published version.
      required: [policy_set_id, version, spec, published_by, published_at, summary]
      properties:
        policy_set_id:
          type: string
        version:
          type: integer
        spec:
          $ref: '#/components/schemas/PolicySetSpec'
        published_by:
          type: string
        published_at:
          type: string
          format: date-time
        change_request_id:
          type: string
        summary:
          type: string
        emergency:
          type: boolean
    PolicySetVersionSummary:
      type: object
      required: [version, published_by, published_at, summary, rules]
      properties:
        version:
          type: integer
        published_by:
          type: string
        published_at:
          type: string
          format: date-time
        change_request_id:
          type: string
        summary:
          type: string
        emergency:
          type: boolean
        rules:
          type: integer
          description: Number of rules in the version.
    ChangeReview:
      type: object
      required: [reviewer, role, decision, comment, at]
      properties:
        reviewer:
          type: string
        role:
          type: string
        decision:
          type: string
          enum: [approve, reject, comment]
        comment:
          type: string
        at:
          type: string
          format: date-time
    RuleChange:
      type: object
      required: [op, rule_id]
      properties:
        op:
          type: string
          enum: [added, removed, modified]
        rule_id:
          type: string
        before:
          $ref: '#/components/schemas/PolicyRule'
        after:
          $ref: '#/components/schemas/PolicyRule'
        fields:
          type: array
          description: Changed rule fields (op `modified`).
          items:
            type: string
    PolicyDiff:
      type: object
      required: [metadata, rules, added, removed, modified]
      properties:
        metadata:
          type: array
          description: Changed set-level fields.
          items:
            type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleChange'
        added:
          type: integer
        removed:
          type: integer
        modified:
          type: integer
    ImpactSample:
      type: object
      required: [server_hostname, server_ip, method, url, before, after]
      properties:
        server_hostname:
          type: string
        server_ip:
          type: string
        method:
          type: string
        url:
          type: string
        before:
          type: string
          description: Verdict before the change.
        after:
          type: string
          description: Verdict after the change.
        rule_name:
          type: string
        server_id:
          type: string
        group_ids:
          type: array
          items:
            type: string
          description: Server groups of the sample (Team Leads see samples of their groups only).
    ImpactSummary:
      type: object
      description: |
        Effect of a candidate policy on the recorded traffic window. For Team Leads, counters and
        samples cover the servers and traffic of their own groups only (also for change requests
        submitted by others).
      required: [flows_evaluated, newly_allowed, newly_blocked, unchanged, affected_servers, target_servers, samples, computed_at]
      properties:
        flows_evaluated:
          type: integer
        newly_allowed:
          type: integer
        newly_blocked:
          type: integer
        unchanged:
          type: integer
        affected_servers:
          type: integer
        target_servers:
          type: integer
          description: Registered servers the set applies to.
        samples:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/ImpactSample'
        computed_at:
          type: string
          format: date-time
    ChangeRequestStatus:
      type: string
      enum: [open, approved, rejected, withdrawn, superseded]
    ChangeRequest:
      type: object
      required: [id, policy_set_id, policy_set_name, title, description, status, base_version, spec, submitted_by, submitted_at, reviews]
      properties:
        id:
          type: string
        policy_set_id:
          type: string
        policy_set_name:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        base_version:
          type: integer
        spec:
          $ref: '#/components/schemas/PolicySetSpec'
        diff:
          $ref: '#/components/schemas/PolicyDiff'
        impact:
          $ref: '#/components/schemas/ImpactSummary'
        submitted_by:
          type: string
        submitted_at:
          type: string
          format: date-time
        reviews:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ChangeReview'
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
        published_version:
          type: integer
        access_request_id:
          type: string
          description: |
            Set when the change carries the approval of an access request that needs four-eyes
            review. Approving it grants the request; rejecting or withdrawing it returns the request
            to the queue.
    ChangeRequestSuperseded:
      type: object
      required: [error, change_request]
      properties:
        error:
          type: string
        change_request:
          $ref: '#/components/schemas/ChangeRequest'
    GovernanceSettings:
      type: object
      required: [require_policy_review, request_sla_hours, default_review_interval_days, max_temporary_access_days, daily_digest, prune_expired_after_days]
      properties:
        require_policy_review:
          type: boolean
          description: Four-eyes approval; policy changes are only published through an approved change request.
        request_sla_hours:
          type: integer
          minimum: 1
          maximum: 720
        default_review_interval_days:
          type: integer
          minimum: 0
          maximum: 730
        max_temporary_access_days:
          type: integer
          minimum: 1
          maximum: 365
          description: Maximum duration Team Leads may grant.
        daily_digest:
          type: boolean
          description: Daily Teams/Slack summary of overdue requests, pending reviews, recertifications and quarantined servers.
        prune_expired_after_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: Remove expired temporary access from approvals sets after this many days (0 = keep).
        last_digest_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true
    CreatePolicySetRequest:
      type: object
      required: [spec]
      properties:
        kind:
          type: string
          enum: [standard, baseline]
          default: standard
        spec:
          $ref: '#/components/schemas/PolicySetSpec'
    PolicySetDraftRequest:
      type: object
      required: [spec]
      properties:
        spec:
          $ref: '#/components/schemas/PolicySetSpec'
    PublishDraftRequest:
      type: object
      properties:
        comment:
          type: string
          description: Publication comment (emergency changes - justification of at least 10 characters).
        emergency:
          type: boolean
          description: Bypass four-eyes review (Super Admins only).
    SubmitChangeRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
    SimulatePolicySetRequest:
      type: object
      properties:
        spec:
          description: Candidate content; omit or null to simulate the draft (else the published content).
          oneOf:
            - $ref: '#/components/schemas/PolicySetSpec'
            - type: 'null'
    RollbackRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
        comment:
          type: string
    RollbackResult:
      type: object
      required: [policy_set, published]
      properties:
        policy_set:
          $ref: '#/components/schemas/PolicySet'
        published:
          type: boolean
          description: False when the version was prepared as a draft (review required).
    CommentRequest:
      type: object
      properties:
        comment:
          type: string
    ChangeReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject, comment]
        comment:
          type: string
          maxLength: 4000
    PolicySetDetails:
      type: object
      required: [policy_set, versions, change_requests, draft_diff]
      properties:
        policy_set:
          $ref: '#/components/schemas/PolicySet'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PolicySetVersionSummary'
        change_requests:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequest'
        draft_diff:
          description: Diff between published content and draft (null without draft).
          oneOf:
            - $ref: '#/components/schemas/PolicyDiff'
            - type: 'null'
    PolicySetDocument:
      description: Portable representation of a policy set (policy as code).
      allOf:
        - type: object
          properties:
            id:
              type: string
            kind:
              $ref: '#/components/schemas/PolicySetKind'
        - $ref: '#/components/schemas/PolicySetSpec'
    PolicySetBundle:
      type: object
      required: [policy_sets]
      properties:
        format:
          type: string
          description: '`aegisproxy.policy-sets/v1` (empty is accepted on import).'
          enum: ['aegisproxy.policy-sets/v1', '']
        path_syntax:
          type: integer
          minimum: 1
          maximum: 2
          description: Path pattern syntax. `2` (written by 2.1+ exports) - `*` is exactly one path segment, `**` any depth. Absent or
            `1` - bundle from an earlier release; on import, patterns ending in `/*` or `x*` are rewritten to `/**` / `x**` (same meaning).
        exported_at:
          type: string
          format: date-time
        exported_by:
          type: string
        policy_sets:
          type: array
          items:
            $ref: '#/components/schemas/PolicySetDocument'
    PolicySetImportRequest:
      type: object
      required: [bundle]
      properties:
        dry_run:
          type: boolean
        bundle:
          $ref: '#/components/schemas/PolicySetBundle'
    PolicySetImportResult:
      type: object
      required: [id, name, action]
      properties:
        id:
          type: string
        name:
          type: string
        action:
          type: string
          enum: [create, update, unchanged, skip, error]
        diff:
          $ref: '#/components/schemas/PolicyDiff'
        error:
          type: string
    PolicySetImportResponse:
      type: object
      required: [dry_run, results]
      properties:
        dry_run:
          type: boolean
        results:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/PolicySetImportResult'
        error:
          type: string
          description: Present with status 422.

    # -------------------------------------------------------------------------
    # Settings
    # -------------------------------------------------------------------------
    NotificationConfig:
      type: object
      properties:
        teams_enabled:
          type: boolean
        teams_webhook_url:
          type: string
          description: |
            Secret. On input the full webhook URL; responses contain it masked (`https://host/••••••`, empty when
            unset). Sending the masked value back keeps the stored URL.
        teams_channel:
          type: string
          maxLength: 200
        slack_enabled:
          type: boolean
        slack_webhook_url:
          type: string
          description: Secret; masked in responses like `teams_webhook_url`.
        slack_channel:
          type: string
          maxLength: 200
        dashboard_base_url:
          type: string
          description: http(s) URL of the console used in notification links.
        notify_security_events:
          type: boolean
          description: Also send high/critical threat-protection events.
    NotificationLog:
      type: object
      required: [id, channel, event_type, title, summary, payload_json, delivered, status_note, timestamp]
      properties:
        id:
          type: string
        channel:
          type: string
        event_type:
          type: string
        title:
          type: string
        summary:
          type: string
        payload_json:
          type: string
        delivered:
          type: boolean
        status_note:
          type: string
        timestamp:
          type: string
          format: date-time
    NotificationTestResult:
      type: object
      required: [status, logs]
      properties:
        status:
          type: string
          enum: [queued]
        logs:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/NotificationLog'
    TLSBypassRule:
      type: object
      description: TLS no-break exception (traffic is passed through without interception).
      required: [pattern, reason]
      properties:
        id:
          type: string
          readOnly: true
        pattern:
          type: string
          description: Host name or `*.domain` (no catch-all or TLD wildcards).
        match_type:
          type: string
          readOnly: true
          enum: [exact, wildcard]
        category:
          type: string
          maxLength: 120
        reason:
          type: string
          maxLength: 1000
        group_ids:
          type: array
          items:
            type: string
        server_ids:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          description: Always true on creation; use the toggle endpoint.
        added_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
    EnabledToggle:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    # -------------------------------------------------------------------------
    # Access requests & learning sessions
    # -------------------------------------------------------------------------
    AccessRequestStatus:
      type: string
      enum: [pending, approved, rejected, revoked]
    RequestComment:
      type: object
      required: [author, text, at]
      properties:
        author:
          type: string
        text:
          type: string
        at:
          type: string
          format: date-time
    AccessRequest:
      type: object
      description: Self-service access request. Empty group lists may be serialized as null.
      required: [id, trace_id, server_ip, server_id, server_hostname, group_ids, requested_url, host, path, method, user_agent, requester, reason, requested_scope, suggested_host_pattern, suggested_path_pattern, follow_redirects, target_group_ids, duration, status, created_at, verified]
      properties:
        id:
          type: string
        trace_id:
          type: string
        server_ip:
          type: string
        server_id:
          type: string
        server_hostname:
          type: string
        group_ids:
          type: [array, 'null']
          items:
            type: string
        requested_url:
          type: string
        host:
          type: string
        path:
          type: string
        method:
          type: string
        user_agent:
          type: string
        requester:
          type: string
        reason:
          type: string
        requested_scope:
          type: string
          enum: [prefix_with_objects, exact_path, domain, learning_session_15m]
        suggested_host_pattern:
          type: string
        suggested_path_pattern:
          type: string
        follow_redirects:
          type: boolean
        target_group_ids:
          type: [array, 'null']
          items:
            type: string
        duration:
          type: string
          description: Requested duration (`1h`, `24h`, `7d`, `permanent`).
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        reviewed_by:
          type: string
        reviewer_role:
          type: string
        review_comment:
          type: string
        reviewed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        created_rule_id:
          type: string
        verified:
          type: boolean
          description: True when server identity and URL were attested by a data-plane-signed block token.
        source_ip:
          type: string
        assigned_to:
          type: string
        due_at:
          type: string
          format: date-time
          description: SLA deadline (governance `request_sla_hours`).
        comments:
          type: array
          items:
            $ref: '#/components/schemas/RequestComment'
        created_rule_ids:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          description: Access expiry of an approved request (absent = permanent).
        revoked_by:
          type: string
        revoked_at:
          type: string
          format: date-time
        change_request_ids:
          type: array
          items:
            type: string
          description: |
            Change requests carrying an approval that awaits four-eyes review; the request stays
            `pending` until they are decided.
    AccessRequestList:
      type: object
      required: [requests, total]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/AccessRequest'
        total:
          type: integer
          description: Number of matches before `limit`.
    GrantDuration:
      type: string
      description: Duration a reviewer may grant.
      enum: [1h, 8h, 24h, 7d, 30d, 90d, permanent]
    ReviewOptions:
      type: object
      required: [approve]
      properties:
        approve:
          type: boolean
        comment:
          type: string
          maxLength: 2000
        host_pattern:
          type: string
          description: Override of the suggested host pattern.
        path_pattern:
          type: string
          description: Override of the suggested path pattern.
        follow_redirects:
          type: boolean
        target_group_ids:
          type: array
          description: Groups to grant access for (default - the request's target groups).
          items:
            type: string
        duration:
          type: string
          description: Granted duration ("" = as requested).
          enum: ['', 1h, 8h, 24h, 7d, 30d, 90d, permanent]
        methods:
          type: array
          description: Allowed methods (default - read-only plus the requested method).
          items:
            $ref: '#/components/schemas/HTTPMethod'
    AccessRequestReviewResult:
      type: object
      required: [request, rule, rules]
      properties:
        request:
          $ref: '#/components/schemas/AccessRequest'
        rule:
          description: First created rule (null when rejected or a learning session was started).
          oneOf:
            - $ref: '#/components/schemas/PolicyRule'
            - type: 'null'
        rules:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/PolicyRule'
    BulkReviewRequest:
      type: object
      required: [ids, approve]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
        approve:
          type: boolean
        comment:
          type: string
    BulkResult:
      type: object
      required: [id]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/AccessRequestStatus'
        error:
          type: string
    BulkReviewResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkResult'
    RequestCommentInput:
      type: object
      description: String values only (other members are ignored).
      required: [text]
      properties:
        text:
          type: string
          maxLength: 2000
      additionalProperties:
        type: string
    AssignRequestInput:
      type: object
      description: String values only (other members are ignored).
      required: [assignee]
      properties:
        assignee:
          type: string
          description: Username of the reviewer (`""` unassigns).
      additionalProperties:
        type: string
    RevokeRequestInput:
      type: object
      description: String values only (other members are ignored).
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
      additionalProperties:
        type: string
    ExtendRequestInput:
      type: object
      description: String values only (other members are ignored).
      required: [duration]
      properties:
        duration:
          $ref: '#/components/schemas/GrantDuration'
      additionalProperties:
        type: string
    CompiledRuleCandidate:
      type: object
      description: Rule candidate compiled from a learning session.
      properties:
        id:
          type: string
        host_pattern:
          type: string
        path_pattern:
          type: string
        methods:
          type: [array, 'null']
          items:
            type: string
        follow_redirects:
          type: boolean
        companion_rules:
          type: [array, 'null']
          items:
            type: string
        sample_urls:
          type: [array, 'null']
          items:
            type: string
        redirect_targets:
          type: [array, 'null']
          items:
            type: string
        hit_count:
          type: integer
        is_redirect_child:
          type: boolean
        selected:
          type: boolean
          description: Only selected candidates are published.
    LearningSession:
      type: object
      required: [id, name, description, server_id, server_ip, server_hostname, group_ids, mode, status, started_by, started_at, expires_at, captured_flow_count, compiled_candidates]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        server_id:
          type: string
        server_ip:
          type: string
        server_hostname:
          type: string
        group_ids:
          type: [array, 'null']
          items:
            type: string
        mode:
          type: string
          enum: [record_and_allow, record_only]
        status:
          type: string
          description: '`active` sessions record until `expires_at`.'
          enum: [active, completed, stopped, published]
        started_by:
          type: string
        started_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        captured_flow_count:
          type: integer
        compiled_candidates:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/CompiledRuleCandidate'
    StartSessionRequest:
      type: object
      required: [name, server_id]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        server_id:
          type: string
          description: Server ID or IP.
        duration_minutes:
          type: integer
          minimum: 0
          maximum: 240
          default: 15
          description: 0 or omitted = 15 minutes.
        mode:
          type: string
          enum: [record_and_allow, record_only]
          default: record_and_allow
    SessionPublish:
      type: object
      properties:
        candidates:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CompiledRuleCandidate'
        rule_prefix:
          type: string
          maxLength: 80
          default: Session-Policy
        policy_set_id:
          type: string
          description: Add the rules to this existing set.
        new_set_name:
          type: string
          description: Name of a new set (default - the rule prefix) when `policy_set_id` is empty.
        target_group_ids:
          type: array
          items:
            type: string
        target_server_ids:
          type: array
          items:
            type: string
        publish:
          type: boolean
          description: Publish immediately (when four-eyes review is not required); otherwise the rules stay in the draft.
    SessionPublishResult:
      type: object
      required: [published_count, policy_set, published]
      properties:
        published_count:
          type: integer
        policy_set:
          $ref: '#/components/schemas/PolicySet'
        published:
          type: boolean
          description: True when the set has no pending draft afterwards.
    SimulateSessionRequest:
      type: object
      properties:
        scenario:
          type: string
          description: Sample traffic scenario (`docker_k8s_pull` or default).

    # -------------------------------------------------------------------------
    # Fleet & groups
    # -------------------------------------------------------------------------
    DefenderDevice:
      type: object
      description: Microsoft Defender for Endpoint view of a registered server.
      required: [machine_id, computer_name, risk_score, exposure_level, health_status, isolated, matched_by, synced_at]
      properties:
        machine_id:
          type: string
        computer_name:
          type: string
        risk_score:
          type: string
        exposure_level:
          type: string
        health_status:
          type: string
        isolated:
          type: boolean
        last_seen:
          type: string
          format: date-time
        matched_by:
          type: string
          enum: [hostname, ip]
        synced_at:
          type: string
          format: date-time
    Server:
      type: object
      required: [id, hostname, ip, subnet_cidr, proxy_auth_user, group_ids, os, department, last_seen_at]
      properties:
        id:
          type: string
        hostname:
          type: string
        ip:
          type: string
        subnet_cidr:
          type: string
        proxy_auth_user:
          type: string
        has_proxy_token:
          type: boolean
          readOnly: true
          description: A proxy token is configured (the token and its digest are never returned).
        token_rotated_at:
          type: string
          format: date-time
        group_ids:
          type: array
          items:
            type: string
        os:
          type: string
        department:
          type: string
        last_seen_at:
          type: string
          format: date-time
          description: Last traffic or heartbeat (`0001-01-01T00:00:00Z` when never seen).
        description:
          type: string
        owner_team:
          type: string
        labels:
          $ref: '#/components/schemas/StringMap'
        quarantined:
          type: boolean
        quarantine_reason:
          type: string
        quarantined_by:
          type: string
        quarantined_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        defender:
          $ref: '#/components/schemas/DefenderDevice'
        effective_group_ids:
          type: array
          description: Static `group_ids` plus groups whose `match_labels` match.
          items:
            type: string
    ServerInput:
      type: object
      description: Client-controllable server fields (all other fields are maintained by the server).
      required: [hostname]
      properties:
        id:
          type: string
          description: 2-64 characters, lowercase letters, digits or `-` (`srv-auto-` and `srv-unregistered-` are reserved). Generated when empty.
        hostname:
          type: string
          maxLength: 255
        ip:
          type: string
          description: Unique IPv4/IPv6 address.
        subnet_cidr:
          type: string
        proxy_auth_user:
          type: string
          description: Unique Proxy-Authorization user (2-64 characters, lowercase letters, digits, `.`, `_`, `-`).
        group_ids:
          type: array
          description: Static group memberships (`*` is not allowed).
          items:
            type: string
        os:
          type: string
          maxLength: 120
        department:
          type: string
          maxLength: 120
        owner_team:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        labels:
          type: object
          description: Up to 32 labels; keys lowercase `[a-z0-9._/-]`, values up to 128 characters (`*` not allowed).
          additionalProperties:
            type: string
    ServerGroup:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: 2-64 characters, lowercase letters, digits or `-`.
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        cidrs:
          type: [array, 'null']
          description: Source networks whose clients belong to the group.
          items:
            type: string
        server_count:
          type: integer
          minimum: 0
          description: Declared fleet size of the group (maintained by the client; not computed from the inventory).
        environment:
          type: string
          maxLength: 120
        owner_team:
          type: string
          maxLength: 120
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: '#64748B'
        strict_isolation:
          type: boolean
          description: Zero-internet tier - unscoped TLS exceptions never apply, record-and-allow learning sessions are not permitted
            and temporary grants (learning sessions, redirect objects) never open anything for members.
        require_proxy_token:
          type: boolean
          default: false
          description: Members are identified only by a valid proxy token. A request from a member's IP address without one is treated
            as an unregistered source; a proxy username alone is refused (`AUTH_FAILED`, HTTP 407). Cannot be combined with `cidrs`.
        match_labels:
          type: object
          description: Dynamic membership - every server whose labels contain all pairs (`*` = any value).
          additionalProperties:
            type: string
        block_page_template_id:
          type: string
          description: Block page template for the group ("" = default).
    DiscoveredSource:
      type: object
      required: [ip, suggested_id, matched_groups, first_seen, last_seen, requests, blocked, top_hosts, user_agent_hints]
      properties:
        ip:
          type: string
        suggested_id:
          type: string
        proxy_auth_user:
          type: string
        matched_groups:
          type: array
          items:
            type: string
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        requests:
          type: integer
        blocked:
          type: integer
        top_hosts:
          type: [array, 'null']
          items:
            type: string
        user_agent_hints:
          type: [array, 'null']
          items:
            type: string
    ServerImportRequest:
      type: object
      properties:
        dry_run:
          type: boolean
        csv:
          type: string
          description: CSV in the export format (takes precedence over `servers`).
        servers:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/ServerInput'
    ServerImportResult:
      type: object
      required: [row, id, hostname, action]
      properties:
        row:
          type: integer
        id:
          type: string
        hostname:
          type: string
        action:
          type: string
          enum: [create, update, error]
        error:
          type: string
    ServerImportResponse:
      type: object
      required: [dry_run, results]
      properties:
        dry_run:
          type: boolean
        results:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ServerImportResult'
        error:
          type: string
          description: Present with status 422.
    QuarantineRequest:
      type: object
      required: [quarantined]
      properties:
        quarantined:
          type: boolean
        reason:
          type: string
          maxLength: 500
          description: Required when quarantining.
    QuarantineByIdentityRequest:
      type: object
      properties:
        hostname:
          type: string
          description: FQDN or unique short host name.
        ip:
          type: string
          description: Used when no server matches the host name.
        quarantined:
          type: boolean
          default: true
        reason:
          type: string
          maxLength: 500
          description: Required when quarantining.
    Onboarding:
      type: object
      required: [linux, windows, proxy_url, no_proxy, proxy_address]
      properties:
        linux:
          type: string
          description: Shell snippet (CA trust, proxy environment, package managers, verification).
        windows:
          type: string
          description: PowerShell snippet.
        proxy_url:
          type: string
          description: '`http://<user>:<token>@<proxy address>`.'
        no_proxy:
          type: string
        proxy_address:
          type: string
    RotateTokenResult:
      type: object
      required: [server, proxy_auth_user, token, proxy_url_hint, onboarding, note]
      properties:
        server:
          $ref: '#/components/schemas/Server'
        proxy_auth_user:
          type: string
        token:
          type: string
          description: The new proxy token (`aegis_…`); shown only once.
        proxy_url_hint:
          type: string
        onboarding:
          $ref: '#/components/schemas/Onboarding'
        note:
          type: string
    EffectivePolicySet:
      type: object
      required: [id, name, kind, version, priority, via, rules]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/PolicySetKind'
        version:
          type: integer
        priority:
          type: integer
        via:
          type: [array, 'null']
          description: Why the set applies (`baseline`, `group:<id>`, `server`).
          items:
            type: string
        rules:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/PolicyRule'
    EffectivePolicy:
      type: object
      required: [server, effective_group_ids, dynamic_group_ids, quarantined, strict_isolation, policy_sets, block_rules, allow_rules, tls_bypass, block_page_template_id, blocked_file_types]
      properties:
        server:
          $ref: '#/components/schemas/Server'
        effective_group_ids:
          type: [array, 'null']
          items:
            type: string
        dynamic_group_ids:
          type: [array, 'null']
          items:
            type: string
        quarantined:
          type: boolean
        strict_isolation:
          type: boolean
        policy_sets:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/EffectivePolicySet'
        block_rules:
          type: integer
        allow_rules:
          type: integer
        tls_bypass:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/TLSBypassRule'
        block_page_template_id:
          type: string
        blocked_file_types:
          type: [array, 'null']
          items:
            type: string

    # -------------------------------------------------------------------------
    # Block pages
    # -------------------------------------------------------------------------
    SupportContact:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
        email:
          type: string
        phone:
          type: string
          description: Digits, spaces and `+ ( ) . / -`.
        url:
          type: string
    LinkItem:
      type: object
      properties:
        label:
          type: string
        url:
          type: string
          description: http(s) URL.
    BlockPageTemplate:
      type: object
      description: Customizes what blocked clients see (browser page and CLI text). Texts may use `{company} {hostname} {ip} {url} {host} {method} {trace_id} {groups} {verdict} {reason}`; blank lines separate paragraphs.
      required: [name]
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 80
        is_default:
          type: boolean
        company_name:
          type: string
          maxLength: 120
        logo_data_url:
          type: string
          description: Base64 `data:` URL of a PNG, JPEG, GIF, WebP or SVG image (at most 200 KB).
        primary_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: '#2563EB'
        accent_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: '#DC2626'
        theme:
          type: string
          enum: [auto, light, dark]
          default: auto
        title:
          type: string
          maxLength: 120
        message:
          type: string
          maxLength: 2000
        threat_message:
          type: string
          maxLength: 2000
        footer_text:
          type: string
          maxLength: 1000
        support:
          $ref: '#/components/schemas/SupportContact'
        links:
          type: [array, 'null']
          maxItems: 6
          items:
            $ref: '#/components/schemas/LinkItem'
        show_request_form:
          type: boolean
        show_ca_section:
          type: boolean
        show_technical_details:
          type: boolean
        show_suggested_rule:
          type: boolean
        allowed_scopes:
          type: [array, 'null']
          description: Scopes offered by the self-service form (required when the form is shown).
          items:
            type: string
            enum: [prefix_with_objects, exact_path, domain, learning_session_15m]
        allowed_durations:
          type: [array, 'null']
          description: Durations offered by the self-service form (required when the form is shown).
          items:
            type: string
            enum: [1h, 24h, 7d, permanent]
        default_locale:
          type: string
          enum: [en, de]
          default: en
        cli_header:
          type: string
          maxLength: 1000
        cli_footer:
          type: string
          maxLength: 1000
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true
    BlockPageList:
      type: object
      required: [templates, default_template_id, group_templates, locales, variables]
      properties:
        templates:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/BlockPageTemplate'
        default_template_id:
          type: string
        group_templates:
          description: Server group ID → template ID.
          $ref: '#/components/schemas/StringMap'
        locales:
          type: array
          items:
            type: string
        variables:
          type: array
          items:
            type: string
    BlockPagePreviewRequest:
      type: object
      required: [template]
      properties:
        template:
          $ref: '#/components/schemas/BlockPageTemplate'
        locale:
          type: string
          enum: [en, de]
        variant:
          type: string
          enum: [request, threat]
          default: request
    BlockPagePreview:
      type: object
      required: [html, cli]
      properties:
        html:
          type: string
        cli:
          type: string
    BlockPageShells:
      type: object
      description: Rendered template shells with `%%AEGIS:<key>%%` placeholders substituted by the data-plane.
      required: [request_html, threat_html, request_cli, threat_cli]
      properties:
        request_html:
          type: string
        threat_html:
          type: string
        request_cli:
          type: string
        threat_cli:
          type: string
    BlockPageBundle:
      type: object
      required: [default_template_id, group_templates, templates, keys, raw_keys]
      properties:
        default_template_id:
          type: string
        group_templates:
          $ref: '#/components/schemas/StringMap'
        templates:
          type: object
          description: Template ID → rendered template.
          additionalProperties:
            type: object
            required: [name, default_locale, logo, allowed_scopes, allowed_durations, shells]
            properties:
              name:
                type: string
              default_locale:
                type: string
              logo:
                type: string
              allowed_scopes:
                type: [array, 'null']
                items:
                  type: string
              allowed_durations:
                type: [array, 'null']
                items:
                  type: string
              shells:
                type: object
                description: Locale → shells.
                additionalProperties:
                  $ref: '#/components/schemas/BlockPageShells'
        keys:
          type: array
          description: Placeholder keys.
          items:
            type: string
        raw_keys:
          type: array
          description: Placeholder keys inserted without HTML escaping.
          items:
            type: string

    # -------------------------------------------------------------------------
    # Threat protection & YARA
    # -------------------------------------------------------------------------
    DLPDetector:
      type: string
      enum: [private_key, aws_access_key, aws_secret_key, github_token, gitlab_token, slack_token, slack_webhook, google_api_key, stripe_key, azure_storage_key, npm_token, pypi_token, credit_card, unix_shadow]
    FileType:
      type: string
      enum: [pe, elf, macho, java_class, msi_ole, script, jar, apk, zip, archive, office_macro, iso]
    SecurityPolicy:
      type: object
      description: Global threat-protection settings enforced by every data-plane worker. Updates replace the whole object.
      required: [threat_intel_mode, av_enabled, av_mode, av_fail_mode, av_max_scan_bytes, av_oversize_action, dlp_mode, dlp_max_scan_bytes, dlp_detectors, blocked_file_types, block_ip_literals, block_private_destinations, block_raw_tcp, allowed_ports, punycode_mode, max_upload_bytes, blocked_burst_threshold]
      properties:
        threat_intel_mode:
          type: string
          enum: ['off', monitor, block]
        av_enabled:
          type: boolean
          description: ClamAV (clamd INSTREAM) scanning of downloads.
        av_mode:
          type: string
          enum: [monitor, block]
        av_fail_mode:
          type: string
          description: Behaviour when the scanner is unavailable or fails.
          enum: [open, closed]
        av_max_scan_bytes:
          type: integer
          format: int64
          minimum: 1048576
          maximum: 2147483648
        av_oversize_action:
          type: string
          enum: [allow, block]
        dlp_mode:
          type: string
          enum: ['off', monitor, block]
        dlp_max_scan_bytes:
          type: integer
          format: int64
          minimum: 4096
          maximum: 67108864
          description: The decoded upload is scanned completely up to this size.
        dlp_oversize_action:
          type: string
          description: 'Uploads above the DLP or ICAP REQMOD scan limit: `allow` (forward, flagged `DLP_UNSCANNED:oversize`) or `block` (413). Default `allow`.'
          enum: [allow, block]
        dlp_detectors:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/DLPDetector'
        blocked_file_types:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/FileType'
        group_blocked_file_types:
          type: object
          description: Server group ID → additionally blocked file types.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/FileType'
        block_ip_literals:
          type: boolean
        block_private_destinations:
          type: boolean
        block_raw_tcp:
          type: boolean
        allowed_ports:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
            maximum: 65535
        punycode_mode:
          type: string
          enum: ['off', monitor, block]
        max_upload_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 0 = unlimited.
        blocked_burst_threshold:
          type: integer
          minimum: 0
          maximum: 100000
          description: Blocked requests per server and minute that raise an anomaly event (0 disables).
        telemetry_query_redaction:
          type: string
          enum: ['', none, sensitive, all]
          description: |
            Query-string redaction of recorded URLs (traffic records, access log, exports, block page).
            `sensitive` (default; also for "") replaces the values of credential-like parameters (token, sig,
            password, api_key, SAS and CloudFront signatures, ...) with `REDACTED`; `all` drops the query;
            `none` records it unchanged. User info in URLs is always replaced.
        icap_respmod_url:
          type: string
          description: '`icap://host:1344/service` or `icaps://…` for RESPMOD (antivirus / sandbox); "" = off.'
        icap_reqmod_url:
          type: string
          description: ICAP REQMOD (DLP) service; "" = off.
        icap_mode:
          type: string
          description: Default `block` when empty.
          enum: ['', monitor, block]
        icap_fail_mode:
          type: string
          enum: ['', open, closed]
        icap_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 600
          description: 1-600 (defaulted to 30 when `icap_mode` is empty).
        icap_max_bytes:
          type: integer
          format: int64
          description: 1 MiB - 2 GiB.
        icap_allow_modified:
          type: boolean
          description: Deliver sanitized content (CDR) returned by the engine.
        icap_tls_skip_verify:
          type: boolean
        icap_ca_cert_pem:
          type: string
          maxLength: 65536
        yara_mode:
          type: string
          description: Default `off` when empty.
          enum: ['', 'off', monitor, block]
        yara_max_bytes:
          type: integer
          format: int64
          description: 1 MiB - 2 GiB.
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true
    ThreatFeed:
      type: object
      description: |
        Threat-intelligence source. On input, an existing `id` updates the feed (built-in feeds: only
        `enabled`, `refresh_minutes`, `match_subdomains`, `auth_header_name`, `auth_header_value`); otherwise a
        custom feed is created (`name`, `url` and `format` required). Status fields are maintained by the server.
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        url:
          type: string
          description: https feed URL (TAXII 2.1 collection / MISP URL for structured sources).
        format:
          type: string
          enum: [domains, hosts, urls, ips, sha256, taxii21, misp]
        category:
          type: string
          maxLength: 64
          description: Default `threat_intel`.
        license:
          type: string
          maxLength: 120
        enabled:
          type: boolean
        builtin:
          type: boolean
          readOnly: true
        match_subdomains:
          type: boolean
        refresh_minutes:
          type: integer
          description: 15-10080 (0 = default).
        auth_header_name:
          type: string
          maxLength: 64
          description: Optional request header for feeds that need an API key (e.g. `Auth-Key`).
        lookback_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: Indicator age window (TAXII / MISP).
        ca_cert_pem:
          type: string
          description: Private CA for the feed server (PEM).
        auth_header_value:
          type: string
          format: password
          writeOnly: true
          description: Write-only. Empty keeps the stored value (unless `auth_header_name` is removed).
        has_auth_value:
          type: boolean
          readOnly: true
        last_attempt_at:
          type: string
          format: date-time
          readOnly: true
        last_success_at:
          type: string
          format: date-time
          readOnly: true
        last_error:
          type: string
          readOnly: true
        entry_count:
          type: integer
          readOnly: true
        etag:
          type: string
          readOnly: true
        last_modified:
          type: string
          readOnly: true
        content_sha256:
          type: string
          readOnly: true
    FeedRefreshRequest:
      type: object
      properties:
        id:
          type: string
          description: Feed to refresh (empty = all enabled feeds).
    Indicator:
      type: object
      description: Manually curated indicator of compromise.
      required: [type, value, reason]
      properties:
        id:
          type: string
          readOnly: true
        type:
          type: string
          enum: [domain, url, ip, cidr, sha256]
        value:
          type: string
          description: Normalized by the server (`*.` prefixes of domains are stripped, CIDR prefix ≥ 8).
        category:
          type: string
          maxLength: 64
          default: custom
        reason:
          type: string
          maxLength: 1000
        enabled:
          type: boolean
          readOnly: true
          description: Always true on creation.
        added_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
    ThreatException:
      type: object
      description: Suppresses threat-intelligence matches (false positives).
      required: [type, value, reason]
      properties:
        id:
          type: string
          readOnly: true
        type:
          type: string
          enum: [domain, url, ip, sha256]
        value:
          type: string
        reason:
          type: string
          maxLength: 1000
        added_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    SecurityEvent:
      type: object
      required: [id, timestamp, type, severity, action, server_id, server_ip, server_hostname, detail, count, acknowledged]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          description: Known values - `THREAT_INTEL`, `MALWARE`, `DLP`, `FILE_TYPE`, `POLICY`, `ANOMALY`, `PUNYCODE`, `AV_UNSCANNED`, `AV_ERROR`, `BLOCK_BURST`, `QUARANTINE`, `BREAK_GLASS_LOGIN`, `AUDIT_INTEGRITY_VIOLATION`, `AUDIT_LEGACY_PENDING`, `AUDIT_LEGACY_ACCEPTED`, `AUDIT_RETENTION_APPLIED` (audit trail alerts, severity high).
        severity:
          type: string
          enum: [critical, high, medium, low]
        action:
          type: string
          enum: [blocked, detected]
        server_id:
          type: string
        server_ip:
          type: string
        server_hostname:
          type: string
        group_ids:
          type: array
          items:
            type: string
        method:
          type: string
        host:
          type: string
        url:
          type: string
        verdict:
          type: string
        detail:
          type: string
        indicator:
          type: string
        source:
          type: string
        flow_id:
          type: string
        count:
          type: integer
        acknowledged:
          type: boolean
        acknowledged_by:
          type: string
        acknowledged_at:
          type: string
          format: date-time
    ThreatIntelStatus:
      type: object
      required: [version, compiled_at, domains, urls, ips, cidrs, hashes, exceptions, active_feeds]
      properties:
        version:
          type: string
        compiled_at:
          type: string
          format: date-time
        domains:
          type: integer
        urls:
          type: integer
        ips:
          type: integer
        cidrs:
          type: integer
        hashes:
          type: integer
        exceptions:
          type: integer
        active_feeds:
          type: integer
    ThreatIntelMatch:
      type: object
      required: [type, indicator, category, source_id, source_name]
      properties:
        type:
          type: string
          enum: [domain, url, ip, cidr, sha256]
        indicator:
          type: string
        category:
          type: string
        source_id:
          type: string
        source_name:
          type: string
    ThreatLookupRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 4096
          description: URL, domain, IP address or SHA-256 hash.
    ThreatLookupResult:
      type: object
      required: [value, malicious, matches, version]
      properties:
        value:
          type: string
        malicious:
          type: boolean
        matches:
          type: [array, 'null']
          description: Null when nothing matched.
          items:
            $ref: '#/components/schemas/ThreatIntelMatch'
        version:
          type: string
          description: Threat-intelligence snapshot version.
    YaraRuleSet:
      type: object
      required: [name, source]
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 120
          description: Unique (case-insensitive).
        description:
          type: string
          maxLength: 1000
        source:
          type: string
          maxLength: 262144
          description: YARA rules (no `include` statements).
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true
    YaraRuleSetList:
      type: object
      required: [rule_sets, data_planes]
      properties:
        rule_sets:
          type: array
          items:
            $ref: '#/components/schemas/YaraRuleSet'
        data_planes:
          type: array
          items:
            $ref: '#/components/schemas/DataPlaneStatus'

    # -------------------------------------------------------------------------
    # Integrations
    # -------------------------------------------------------------------------
    ExportSink:
      type: object
      description: |
        Log export destination for the `audit`, `traffic` and `security` streams. Secrets (`secret`,
        `client_key_pem`, header values) are write-only; responses carry `has_secret` / `has_client_key` and the
        header names with empty values.
      required: [name, type, streams]
      properties:
        id:
          type: string
          readOnly: true
          description: Used on input only by the test endpoint (to merge stored secrets).
        name:
          type: string
          maxLength: 80
        type:
          type: string
          enum: [syslog, otlp, splunk_hec, elasticsearch, sentinel, datadog, loki, webhook, file]
        enabled:
          type: boolean
        streams:
          type: array
          minItems: 1
          items:
            type: string
            enum: [audit, traffic, security]
        format:
          type: string
          description: Record format (default - the first format of the type; fixed for structured types).
          enum: [json, ecs, cef, leef, otel, structured]
        traffic_filter:
          type: string
          enum: [all, blocked, security, allowed]
          default: all
        min_severity:
          type: string
          enum: [low, medium, high, critical]
          default: low
        redact_query:
          type: boolean
          description: Remove URL query strings from traffic records.
        endpoint:
          type: string
          description: URL, `host:port` (syslog) or a plain file name (type `file`, written to the export directory).
        transport:
          type: string
          enum: [udp, tcp, tls]
        syslog_protocol:
          type: string
          enum: [rfc5424, rfc3164]
        syslog_facility:
          type: string
          description: local0..local7, user, daemon, auth, authpriv or security.
        syslog_framing:
          type: string
          enum: [octet-counting, newline]
        index:
          type: string
          description: Elasticsearch index/data stream or Splunk index (`{stream}` placeholder).
        source_type:
          type: string
          description: Splunk sourcetype prefix.
        labels:
          $ref: '#/components/schemas/StringMap'
        username:
          type: string
          description: Basic auth user (Elasticsearch, Loki).
        tenant_id:
          type: string
          description: Sentinel. Required with `client_secret`; with `workload_identity` AZURE_TENANT_ID of the pod is used when empty.
        client_id:
          type: string
          description: Sentinel. Required with `client_secret`; user-assigned identity with `managed_identity` (empty = system-assigned); AZURE_CLIENT_ID of the pod with `workload_identity` when empty.
        dcr_immutable_id:
          type: string
        stream_name:
          type: string
          description: Sentinel stream (`Custom-…`).
        authority_url:
          type: string
          description: Default derived from the data collection endpoint (https://login.microsoftonline.com, .us for Azure Government, https://login.chinacloudapi.cn for Azure China); the token audience follows the same cloud.
        azure_auth:
          type: string
          enum: [client_secret, workload_identity, managed_identity]
          default: client_secret
          description: Sentinel authentication. `managed_identity` (Azure VM / VM scale set) and `workload_identity` (AKS) need no secret.
        tls_skip_verify:
          type: boolean
        ca_cert_pem:
          type: string
        client_cert_pem:
          type: string
        secret:
          type: string
          format: password
          writeOnly: true
          description: Token / API key / password / HMAC key / client secret. Empty on update keeps the stored value.
        client_key_pem:
          type: string
          format: password
          writeOnly: true
          description: TLS client key (PEM). Empty on update keeps the stored key while `client_cert_pem` is set.
        headers:
          type: object
          description: Extra HTTP headers. Values are write-only (responses contain empty values); an empty value on update keeps the stored one.
          additionalProperties:
            type: string
        clear_secret:
          type: boolean
          writeOnly: true
          description: Remove the stored secret.
        has_secret:
          type: boolean
          readOnly: true
        has_client_key:
          type: boolean
          readOnly: true
        batch_size:
          type: integer
        flush_seconds:
          type: integer
        spool_mb:
          type: integer
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true
    ExportSinkStatus:
      type: object
      required: [id, node, state, queued, spool_bytes, spool_records, sent, failed, dropped, discarded_batches]
      properties:
        id:
          type: string
        node:
          type: string
        state:
          type: string
          enum: [ok, retrying, error, disabled, idle]
        queued:
          type: integer
        spool_bytes:
          type: integer
          format: int64
        spool_records:
          type: integer
          format: int64
        sent:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        dropped:
          type: integer
          format: int64
          description: Records lost (traffic records while the queue is full, full spool, unencodable records).
        discarded_batches:
          type: integer
          format: int64
          description: |
            Batches the destination rejected permanently (4xx). Sinks carrying audit or security records keep
            them in `dead-letter.jsonl` in their spool directory.
        last_success_at:
          type: string
          format: date-time
        last_error:
          type: string
        last_error_at:
          type: string
          format: date-time
        streams:
          type: object
          description: |
            Delivery state per stream (audit, security, traffic, ...) of the records this node sent. A destination
            may accept one stream and reject every record of another; the posture check "Audit trail forwarded to
            a SIEM" counts the audit stream's own outcome.
          additionalProperties:
            $ref: '#/components/schemas/ExportStreamStatus'
    ExportStreamStatus:
      type: object
      properties:
        last_success_at:
          type: string
          format: date-time
        last_error_at:
          type: string
          format: date-time
        last_error:
          type: string
        rejected:
          type: boolean
          description: The last failure was a rejection (records dead-lettered or lost), not an unavailable destination.
    ExportTypeInfo:
      type: object
      required: [type, label, description, formats, endpoint_hint, fields]
      properties:
        type:
          type: string
        label:
          type: string
        description:
          type: string
        formats:
          type: array
          items:
            type: string
        endpoint_hint:
          type: string
        secret_label:
          type: string
        fields:
          type: [array, 'null']
          description: Type-specific fields the form should show.
          items:
            type: string
    ExportSinkList:
      type: object
      required: [sinks, status, types, export_dir, can_edit]
      properties:
        sinks:
          type: array
          items:
            $ref: '#/components/schemas/ExportSink'
        status:
          type: array
          description: Delivery status on this control-plane replica.
          items:
            $ref: '#/components/schemas/ExportSinkStatus'
        types:
          type: array
          items:
            $ref: '#/components/schemas/ExportTypeInfo'
        export_dir:
          type: string
        can_edit:
          type: boolean
    DefenderConfig:
      type: object
      description: Microsoft Defender for Endpoint integration.
      properties:
        enabled:
          type: boolean
        tenant_id:
          type: string
          description: Required when enabled.
        client_id:
          type: string
          maxLength: 128
          description: Required when enabled.
        client_secret:
          type: string
          format: password
          writeOnly: true
          description: Write-only; empty or masked keeps the stored secret.
        has_client_secret:
          type: boolean
          readOnly: true
        api_base_url:
          type: string
          description: https URL. Default https://api.security.microsoft.com (regional hosts and https://api.securitycenter.microsoft.com work as well); GCC https://api-gcc.securitycenter.microsoft.us, GCC High / DoD https://api-gov.securitycenter.microsoft.us. The token scope follows the cloud.
        authority_url:
          type: string
          description: https URL. Default https://login.microsoftonline.com (https://login.microsoftonline.us for the GCC High / DoD API).
        import_indicators:
          type: boolean
          description: Add Defender custom indicators (block actions) to the threat intelligence.
        indicator_actions:
          type: [array, 'null']
          description: Default `Block`, `AlertAndBlock`, `BlockAndRemediate`.
          items:
            type: string
            enum: [Block, AlertAndBlock, BlockAndRemediate, Alert, Audit, Warn]
        device_sync:
          type: boolean
          description: Map Defender devices to registered servers.
        quarantine_on_risk:
          type: string
          enum: ['', 'off', high, medium]
          default: 'off'
        quarantine_on_isolation:
          type: boolean
        auto_release:
          type: boolean
          description: Release Defender-initiated quarantines when the condition clears.
        sync_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: 1-1440 (0 = default 5).
        last_sync_at:
          type: string
          format: date-time
          readOnly: true
        last_sync_error:
          type: string
          readOnly: true
        last_sync_devices:
          type: integer
          readOnly: true
        matched_servers:
          type: integer
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          readOnly: true
    DefenderIntegration:
      type: object
      required: [config, can_edit, permissions]
      properties:
        config:
          $ref: '#/components/schemas/DefenderConfig'
        can_edit:
          type: boolean
          description: True for Super Admins (people).
        permissions:
          type: array
          description: Required application permissions.
          items:
            type: string
    DefenderTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        indicators:
          type: integer
        indicators_error:
          type: string
        devices:
          type: integer
        devices_error:
          type: string
    DefenderSyncResult:
      type: object
      required: [config]
      properties:
        config:
          $ref: '#/components/schemas/DefenderConfig'

    # -------------------------------------------------------------------------
    # Audit
    # -------------------------------------------------------------------------
    AuditEvent:
      type: object
      description: Hash-chained audit record (`event_hash` covers the event and `prev_hash`).
      required: [id, revision, timestamp, actor, actor_role, action, category, entity_type, entity_id, entity_name, summary]
      properties:
        id:
          type: string
        revision:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
          description: Username, `sa:<name>` for service accounts, or `system`.
        actor_role:
          type: string
        action:
          type: string
          examples: [USER_CREATED, POLICY_SET_CREATED, REQUEST_REJECTED, SERVER_QUARANTINED]
        category:
          type: string
          description: Known values - `RULE`, `APPROVAL`, `SESSION`, `TLS_BYPASS`, `SYSTEM`, `SECURITY`, `IDENTITY`, `FLEET`, `POLICY`.
        entity_type:
          type: string
        entity_id:
          type: string
        entity_name:
          type: string
        summary:
          type: string
        scope_groups:
          type: array
          items:
            type: string
        before_state:
          type: string
        after_state:
          type: string
        rollback_rule:
          $ref: '#/components/schemas/PolicyRule'
        prev_hash:
          type: string
        event_hash:
          type: string
        hash_version:
          type: integer
          enum: [0, 2]
          description: '2 = HMAC-SHA256 with the installation''s audit chain key over a length-prefixed encoding; 0 (or absent) = events written before 2.1.'
    AuditVerifyResult:
      type: object
      description: Verification of the complete audit trail (database in cluster mode, audit.jsonl plus rotated generations otherwise).
      required: [valid, events_checked]
      properties:
        valid:
          type: boolean
        events_checked:
          type: integer
        error:
          type: string
          description: First integrity violation (when `valid` is false).
        first_id:
          type: string
        last_id:
          type: string
        legacy_events:
          type: integer
          description: Events in the pre-2.1 (unkeyed) hash format; accepted only in the sealed prefix before the keyed cutover.
        legacy_pending:
          type: boolean
          description: The unkeyed prefix awaits acceptance by a Super Admin (`POST /api/audit/anchor/accept-legacy`); verification fails until then.
        legacy_head:
          type: string
          description: '`event_hash` of the last unkeyed event while `legacy_pending` is true (64 zeros for an empty prefix).'
        starts_at_genesis:
          type: boolean
          description: The first event links to the genesis hash (false after an audit retention point was applied).
        head_matches:
          type: boolean
          description: The trail reaches the newest event known to the control-plane.
        checkpoint_matches:
          type: boolean
          description: The newest event is exactly the `checkpoint_events`-th event from the sealed origin and carries the revision the sealed checkpoint names (no events cut off the end or inserted).
        checkpoint_events:
          type: integer
          description: Events from the sealed origin up to the newest event according to the sealed checkpoint.
        scope:
          type: string
          enum: [complete]

    # -------------------------------------------------------------------------
    # Traffic, bandwidth, evaluation
    # -------------------------------------------------------------------------
    TrafficFlow:
      type: object
      description: One proxied request as recorded by a data-plane worker. Missing `id` / `timestamp` are filled in by the control-plane on ingest.
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        server_ip:
          type: string
        server_id:
          type: string
        server_hostname:
          type: string
        group_ids:
          type: [array, 'null']
          items:
            type: string
        proxy_auth_user:
          type: string
        method:
          type: string
        scheme:
          type: string
        host:
          type: string
        port:
          type: integer
        path:
          type: string
        full_url:
          type: string
        user_agent:
          type: string
        verdict:
          $ref: '#/components/schemas/Verdict'
        matched_rule_id:
          type: string
        matched_rule_name:
          type: string
        redirect_parent_url:
          type: string
        redirect_location:
          type: string
        status_code:
          type: integer
        latency_ms:
          type: integer
          format: int64
        bytes_sent:
          type: integer
          format: int64
        bytes_received:
          type: integer
          format: int64
        tls_intercepted:
          type: boolean
        follow_redirects:
          type: boolean
        session_id:
          type: string
        block_token:
          type: string
        block_reason:
          type: string
        threat_category:
          type: string
        threat_source:
          type: string
        threat_indicator:
          type: string
        security_flags:
          type: array
          items:
            type: string
        content_sha256:
          type: string
        content_type:
          type: string
        file_type:
          type: string
        av_result:
          type: string
        av_signature:
          type: string
        dlp_findings:
          type: array
          items:
            type: string
        resolved_ip:
          type: string
        data_plane_id:
          type: string
    FlowBatch:
      type: object
      required: [flows]
      properties:
        flows:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TrafficFlow'
    RecordedFlowId:
      type: object
      required: [id]
      properties:
        id:
          type: string
    RecordedFlowCount:
      type: object
      required: [recorded_count]
      properties:
        recorded_count:
          type: integer
          description: Flows recorded by this request.
        duplicate_count:
          type: integer
          description: Flows that were stored already (resent after a lost acknowledgement).
    BandwidthSample:
      type: object
      required: [time_label, mbps_total, mbps_direct_allow, mbps_cdn_objects, mbps_tls_bypass, requests_per_sec]
      properties:
        time_label:
          type: string
        mbps_total:
          type: number
        mbps_direct_allow:
          type: number
        mbps_cdn_objects:
          type: number
        mbps_tls_bypass:
          type: number
        requests_per_sec:
          type: integer
    ServerVolumeEntry:
      type: object
      required: [server_id, hostname, ip, group_ids, bytes_received, bytes_sent, total_bytes, request_count, peak_mbps, top_destination]
      properties:
        server_id:
          type: string
        hostname:
          type: string
        ip:
          type: string
        group_ids:
          type: [array, 'null']
          items:
            type: string
        bytes_received:
          type: integer
          format: int64
        bytes_sent:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
        request_count:
          type: integer
          format: int64
        peak_mbps:
          type: number
        top_destination:
          type: string
    DestinationVolumeEntry:
      type: object
      required: [host, path_pattern, category, total_bytes, request_count, tls_intercepted, is_redirect_asset, parent_rule_name]
      properties:
        host:
          type: string
        path_pattern:
          type: string
        category:
          type: string
        total_bytes:
          type: integer
          format: int64
        request_count:
          type: integer
          format: int64
        tls_intercepted:
          type: boolean
        is_redirect_asset:
          type: boolean
        parent_rule_name:
          type: string
    GroupVolumeEntry:
      type: object
      required: [group_id, group_name, server_count, total_bytes, current_mbps, request_count, color]
      properties:
        group_id:
          type: string
        group_name:
          type: string
        server_count:
          type: integer
        total_bytes:
          type: integer
          format: int64
        current_mbps:
          type: number
        request_count:
          type: integer
          format: int64
        color:
          type: string
    BandwidthSummary:
      type: object
      required: [current_mbps, peak_mbps_24h, total_bytes_24h, cdn_redirect_bytes_24h, tls_bypass_bytes_24h, time_series, top_servers, top_destinations, group_breakdown]
      properties:
        current_mbps:
          type: number
        peak_mbps_24h:
          type: number
        total_bytes_24h:
          type: integer
          format: int64
        cdn_redirect_bytes_24h:
          type: integer
          format: int64
        tls_bypass_bytes_24h:
          type: integer
          format: int64
        time_series:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/BandwidthSample'
        top_servers:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ServerVolumeEntry'
        top_destinations:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/DestinationVolumeEntry'
        group_breakdown:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/GroupVolumeEntry'
    EvaluationRequest:
      type: object
      properties:
        server_ip:
          type: string
        proxy_auth_user:
          type: string
        method:
          type: string
        scheme:
          type: string
          enum: [http, https]
        host:
          type: string
        port:
          type: integer
        path:
          type: string
        full_url:
          type: string
        user_agent:
          type: string
    EvaluationResult:
      type: object
      required: [allowed, verdict, tls_bypass, server_id, server_hostname, group_ids, follow_redirects, suggested_host, suggested_path]
      properties:
        allowed:
          type: boolean
        verdict:
          $ref: '#/components/schemas/Verdict'
        tls_bypass:
          type: boolean
        server_id:
          type: string
        server_hostname:
          type: string
        group_ids:
          type: [array, 'null']
          items:
            type: string
        matched_rule_id:
          type: string
        matched_rule_name:
          type: string
        follow_redirects:
          type: boolean
        redirect_parent_url:
          type: string
        session_id:
          type: string
        suggested_host:
          type: string
        suggested_path:
          type: string
        block_reason:
          type: string
          examples: [default_deny]
        threat_category:
          type: string
        threat_source:
          type: string
        threat_indicator:
          type: string
        security_flags:
          type: array
          items:
            type: string

    # -------------------------------------------------------------------------
    # Data-plane
    # -------------------------------------------------------------------------
    DataPlaneGroup:
      type: object
      required: [id, cidrs, strict_isolation, require_proxy_token]
      properties:
        id:
          type: string
        cidrs:
          type: [array, 'null']
          items:
            type: string
        strict_isolation:
          type: boolean
        require_proxy_token:
          type: boolean
    DataPlaneServer:
      type: object
      required: [id, hostname, ip, subnet_cidr, proxy_auth_user, proxy_auth_token_hash, group_ids]
      properties:
        id:
          type: string
        hostname:
          type: string
        ip:
          type: string
        subnet_cidr:
          type: string
        proxy_auth_user:
          type: string
        proxy_auth_token_hash:
          type: string
        group_ids:
          type: [array, 'null']
          description: Effective memberships (static + label-matched).
          items:
            type: string
        quarantined:
          type: boolean
    DataPlaneSession:
      type: object
      required: [id, name, server_id, server_ip, mode, status, expires_at]
      properties:
        id:
          type: string
        name:
          type: string
        server_id:
          type: string
        server_ip:
          type: string
        mode:
          type: string
          enum: [record_and_allow, record_only]
        status:
          type: string
        expires_at:
          type: string
          format: date-time
    DataPlaneBundle:
      type: object
      required: [revision, yara_rule_sets, rules, tls_bypass, sessions, groups, servers, security_policy, threat_intel_version, block_pages, internal_domains, public_url, dashboard_url, synced_at]
      properties:
        revision:
          type: integer
          format: int64
        yara_rule_sets:
          type: array
          description: Enabled YARA rule sets.
          items:
            type: object
            required: [id, name, source]
            properties:
              id:
                type: string
              name:
                type: string
              source:
                type: string
        rules:
          type: array
          description: Enabled, unexpired effective rules (descriptions removed).
          items:
            $ref: '#/components/schemas/PolicyRule'
        tls_bypass:
          type: array
          items:
            $ref: '#/components/schemas/TLSBypassRule'
        sessions:
          type: array
          description: Active learning sessions.
          items:
            $ref: '#/components/schemas/DataPlaneSession'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/DataPlaneGroup'
        servers:
          type: array
          items:
            $ref: '#/components/schemas/DataPlaneServer'
        security_policy:
          $ref: '#/components/schemas/SecurityPolicy'
        threat_intel_version:
          type: string
        block_pages:
          $ref: '#/components/schemas/BlockPageBundle'
        internal_domains:
          type: [array, 'null']
          description: Internal domain suffixes (never proxied upstream / no-proxy).
          items:
            type: string
        public_url:
          type: string
        dashboard_url:
          type: string
        synced_at:
          type: string
          format: date-time
    ThreatIntelExport:
      type: object
      description: Compiled threat-intelligence snapshot. Map values are indices into `sources`.
      required: [version, compiled_at, sources, domains, domains_sub, urls, ips, cidrs, hashes, exceptions]
      properties:
        version:
          type: string
        compiled_at:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: object
            required: [id, name, category]
            properties:
              id:
                type: string
              name:
                type: string
              category:
                type: string
        domains:
          type: [object, 'null']
          description: Exact domain → source index.
          additionalProperties:
            type: integer
        domains_sub:
          type: [object, 'null']
          description: Domain (including subdomains) → source index.
          additionalProperties:
            type: integer
        urls:
          type: [object, 'null']
          additionalProperties:
            type: integer
        ips:
          type: [object, 'null']
          additionalProperties:
            type: integer
        cidrs:
          type: array
          description: '`[cidr, source index]` pairs.'
          items:
            type: array
            prefixItems:
              - type: string
              - type: integer
            minItems: 2
            maxItems: 2
        hashes:
          type: [object, 'null']
          additionalProperties:
            type: integer
        exceptions:
          type: object
          required: [domains, urls, hashes, ips]
          properties:
            domains:
              type: array
              items:
                type: string
            urls:
              type: array
              items:
                type: string
            hashes:
              type: array
              items:
                type: string
            ips:
              type: array
              items:
                type: string
