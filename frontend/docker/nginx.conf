# AegisProxy console (static SPA). Runtime pieces are generated into /tmp/aegis by 40-aegis-config.sh.
server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /tmp/aegis/headers.conf;
    include /tmp/aegis/api-proxy.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        alias /tmp/aegis/config.js;
        default_type application/javascript;
        include /tmp/aegis/headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        include /tmp/aegis/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /tmp/aegis/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
