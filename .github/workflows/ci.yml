name: ci
on:
  push:
    branches: ["**"]   # tag pushes run these gates through release.yml
  pull_request:
  workflow_call:       # release.yml: no image is published unless every job here passes

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env: { POSTGRES_USER: aegis, POSTGRES_PASSWORD: aegis, POSTGRES_DB: aegis }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - run: test -z "$(gofmt -l control-plane)" || (gofmt -l control-plane; exit 1)
      - run: go -C control-plane vet ./...
      - run: go -C control-plane test -race -count=1 -timeout 30m ./...
        env:
          AEGIS_TEST_DATABASE_URL: postgres://aegis:aegis@localhost:5432/aegis?sslmode=disable
      - run: GOOS=windows GOARCH=amd64 go -C control-plane build -o /dev/null .
      - name: govulncheck (fails on reachable vulnerabilities)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -C control-plane ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 -checks inherit,-ST1003,-ST1005 ./...
        working-directory: control-plane

  data-plane:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.14" }
      - name: hash-locked data-plane environment (install-linux.sh lock - mitmproxy, YARA-X, security overrides)
        run: |
          python -m venv /tmp/dp
          /tmp/dp/bin/pip install -q --require-hashes --no-deps --only-binary=:all: -r data-plane/requirements-lock.txt
      # Hook tests need mitmproxy and the YARA tests YARA-X: a skipped test fails the job here.
      - name: data-plane tests (no skips allowed)
        run: /tmp/dp/bin/python -I data-plane/tests/run_no_skips.py
      - name: pip-audit (the hash-locked data-plane environment)
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install -q --require-hashes --only-binary=:all: -r .github/requirements-audit.txt
          /tmp/audit/bin/pip-audit --path /tmp/dp/lib/python3*/site-packages
      # The venv above holds only what Linux CPython 3.14 installs. The lock also pins packages for Windows (pydivert,
      # mitmproxy-windows), macOS and CPython 3.12/3.13 (backports-zstd), and the console regression suite has its own
      # lock: every pin of both, with the environment markers removed, is audited as well (still hash-locked).
      - name: pip-audit (every pin of the data-plane, image and e2e locks, any platform or Python version)
        run: |
          for lock in data-plane/requirements-lock.txt data-plane/requirements-image.txt data-plane/requirements-extra.txt frontend/e2e/requirements.txt; do
            sed -E '/^[^#]/ s/ *;[^\\]*( \\)$/\1/' "$lock" > "$RUNNER_TEMP/all-pins.txt"
            if grep -qE '^[A-Za-z0-9][^#]*;' "$RUNNER_TEMP/all-pins.txt"; then echo "::error::$lock: environment marker left"; exit 1; fi
            /tmp/audit/bin/pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/all-pins.txt"
          done
      - name: cross-language block token
        run: |
          TOK=$(python -I -c "import sys; sys.path.insert(0,'data-plane'); from aegis_dp.controlplane import sign_block_token; print(sign_block_token('k'*40, {'ip':'10.1.0.5','url':'https://x.example/ü','m':'GET','tid':'t'}))")
          echo "AEGIS_XLANG_BLOCK_TOKEN=$TOK" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - run: go -C control-plane test -run TestCrossLanguageBlockToken -v ./internal/auth/

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm --prefix frontend ci --no-fund
      # Development dependencies included: the build toolchain (Vite, Rolldown, Tailwind, plugins) produces the
      # shipped bundle.
      - run: npm --prefix frontend audit --audit-level=high
      - run: npm --prefix frontend run build

  # Browser regression suite (frontend/e2e): the built console against fresh control planes, as every role.
  console-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.14" }
      - run: go -C control-plane build -o "$RUNNER_TEMP/aegis-control-plane" .
      - run: npm --prefix frontend ci --no-fund
      - run: npm --prefix frontend run build
      - name: Playwright (hash-locked) and Chromium
        run: |
          python -m venv "$RUNNER_TEMP/e2e"
          "$RUNNER_TEMP/e2e/bin/pip" install -q --require-hashes --only-binary=:all: -r frontend/e2e/requirements.txt
          "$RUNNER_TEMP/e2e/bin/python" -m playwright install --with-deps chromium
      - name: console regression suite
        run: frontend/e2e/run.sh "$RUNNER_TEMP/aegis-control-plane" frontend/dist
        env:
          PYTHON: ${{ runner.temp }}/e2e/bin/python
          AEGIS_E2E_OUT: ${{ runner.temp }}/e2e-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: console-e2e
          path: ${{ runner.temp }}/e2e-out
          retention-days: 7

  deploy-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: helm lint + kubeconform
        run: |
          set -o pipefail
          clients=(--set 'networkPolicy.proxyClientCIDRs={10.0.0.0/8}')
          helm lint deploy/helm/aegisproxy --set storage.postgres.url=postgres://u:p@db/aegis "${clients[@]}"
          helm template t deploy/helm/aegisproxy --set storage.postgres.cnpg.enabled=true --set console.enabled=true "${clients[@]}" > rendered.yaml
          helm template t deploy/helm/aegisproxy --set storage.type=file --set ingress.enabled=true --set ingress.trustedController.enabled=true \
            --set networkPolicy.dataPlaneEgressIPv6=true --set 'networkPolicy.clusterIPv6CIDRs={fd00::/8}' \
            --set 'dataPlane.service.loadBalancerSourceRanges={10.0.0.0/8}' > rendered-variants.yaml
          # Exposure guard: an unrestricted proxy LoadBalancer must not render.
          if helm template t deploy/helm/aegisproxy --set storage.postgres.url=postgres://u:p@db/aegis > /dev/null 2>&1; then
            echo "unrestricted proxy LoadBalancer rendered"; exit 1
          fi
          docker run --rm -v "$PWD":/w ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -ignore-missing-schemas /w/rendered.yaml /w/rendered-variants.yaml
      - name: bicep v0.48.1 build (pinned SHA-256)
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          echo "b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e  bicep" | sha256sum -c -
          chmod +x bicep
          ./bicep build deploy/sentinel/aegisproxy-sentinel.bicep --stdout > /dev/null
      # Syntax, PSScriptAnalyzer (incl. PS 5.1 compatibility) and the Pester suite, which runs the unchanged
      # installers against an in-memory Windows (deploy/windows/tests/FakeWindows.ps1).
      - name: Windows installers (PSScriptAnalyzer + Pester)
        shell: pwsh
        run: ./deploy/windows/tests/Invoke-InstallerTests.ps1 -OutputDir test-results
      - name: shell syntax (bash -n checks one file per call)
        run: for f in deploy/systemd/install-linux.sh scripts/gen-secrets.sh scripts/gen-dockerignore.sh scripts/build-images.sh scripts/audit-image-python.sh frontend/e2e/run.sh; do bash -n "$f"; done
      # The .dockerignore files allowlist exactly the tracked files of each image build context: a file added,
      # renamed or deleted without regenerating them fails here (and in make images).
      - name: image build contexts allowlist the tracked files
        run: scripts/gen-dockerignore.sh --check

  # Both Windows installers on real Windows Server runners: services, virtual service accounts, ACLs,
  # CA roll-out script, proxying through the data-plane service, uninstall.
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: installer unit tests (Pester, fake system - touches nothing on the runner)
        run: ./deploy/windows/tests/Invoke-InstallerTests.ps1 -OutputDir test-results
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: control-plane/go.mod, cache-dependency-path: control-plane/go.sum }
      - name: Go tests on Windows (file sharing semantics, paths, service code)
        run: go -C control-plane test -count=1 -timeout 30m ./...
      # The installer refuses interpreters that non-administrators can modify (C:\Python312 inherits "create
      # files" for users from C:\), so Python goes to Program Files like a python.org all-users installation.
      - name: Python for all users in Program Files (services cannot use per-user installations)
        run: |
          choco install python312 -y --no-progress --params "/InstallDir:'C:\Program Files\Python312'"
          & 'C:\Program Files\Python312\python.exe' --version
      - name: data-plane unit tests on Windows CPython
        run: |
          & 'C:\Program Files\Python312\python.exe' -m venv "$env:RUNNER_TEMP\dp-venv"
          $py = "$env:RUNNER_TEMP\dp-venv\Scripts\python.exe"
          # The hash-locked environment of the installers (win_amd64 wheels of mitmproxy, pydivert, YARA-X, ... are in the lock).
          & $py -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: -r data-plane/requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'hash-locked data-plane install failed' }
          & $py -I data-plane/tests/run_no_skips.py
          if ($LASTEXITCODE -ne 0) { throw 'data-plane unit tests failed (or were skipped)' }
      - name: build the Windows control-plane
        run: |
          $env:CGO_ENABLED = '0'
          go -C control-plane build -trimpath -ldflags "-X main.Version=ci" -o ..\deploy\windows\aegis-control-plane.exe .
      - name: WinSW 2.12.0 (pinned SHA-256)
        run: |
          Invoke-WebRequest -UseBasicParsing https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe -OutFile "$env:RUNNER_TEMP\WinSW-x64.exe"
          $h = (Get-FileHash "$env:RUNNER_TEMP\WinSW-x64.exe" -Algorithm SHA256).Hash
          if ($h -ne '05B82D46AD331CC16BDC00DE5C6332C1EF818DF8CEEFCD49C726553209B3A0DA') { throw "WinSW hash mismatch: $h" }
      # The installers refuse sources that non-administrators can change, including every folder above them: lock the
      # top-level folder that holds the checkout and RUNNER_TEMP (WinSW) down like docs/deployment/windows.md, section 2.
      - name: release folder only administrators can change
        run: |
          $dirs = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP | ForEach-Object {
              $root = [System.IO.Path]::GetPathRoot($_)
              $top = $_.Substring($root.Length).Split('\')[0]
              if (-not $top) { throw "$_ is a volume root" }
              Join-Path $root $top
            } | Sort-Object -Unique)
          icacls ([System.IO.Path]::GetPathRoot($dirs[0]))
          foreach ($dir in $dirs) {
            icacls $dir /inheritance:r /grant:r '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-18:(OI)(CI)F' /Q
            if ($LASTEXITCODE -ne 0) { throw "icacls /inheritance:r $dir failed with exit code $LASTEXITCODE" }
            icacls $dir /setowner '*S-1-5-32-544' /T /L /C /Q
            if ($LASTEXITCODE -ne 0) { Write-Warning "icacls /setowner $dir exited with $LASTEXITCODE (files it could not change are reported by the installers)" }
            icacls $dir
          }
      - name: install the control-plane service
        run: |
          $pw = ConvertTo-SecureString 'Ci-Windows-Root-Pass-2026' -AsPlainText -Force
          # 1 MB audit rotation so that the end-to-end step exercises the built-in rotation on NTFS.
          ./deploy/windows/Install-AegisControlPlane.ps1 -PublicUrl http://127.0.0.1:8081 -ProxyAddress 127.0.0.1:8080 -BootstrapAdminPassword $pw -SkipFirewall `
            -ExtraEnvironment @{ AEGIS_AUDIT_ROTATE_MB = '1' }
          Get-Service AegisControlPlane | Format-List Name, Status, StartType
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8081/readyz).StatusCode
          $image = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\AegisControlPlane').ImagePath
          if ($image -notmatch '^".+\\aegis-control-plane\.exe" service$') { throw "unexpected ImagePath: $image" }
          $src = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\AegisControlPlane'
          if ($src.EventMessageFile -notlike '*\System32\EventCreate.exe' -or $src.TypesSupported -ne 7) { throw 'event log source AegisControlPlane not registered' }
          if (-not [System.Diagnostics.EventLog]::SourceExists('AegisControlPlane')) { throw 'event log source AegisControlPlane unknown to the event log' }
      - name: log rotation task runs as the service account
        run: |
          $name = 'AegisProxy Control-Plane Log Rotation'
          $task = Get-ScheduledTask -TaskPath '\AegisProxy\' -TaskName $name
          if ($task.Principal.UserId -notlike '*AegisControlPlane') { throw "unexpected task principal: $($task.Principal.UserId)" }
          $since = (Get-Date).AddSeconds(-2)
          Start-ScheduledTask -TaskPath '\AegisProxy\' -TaskName $name
          do {
            Start-Sleep -Seconds 2
            $info = Get-ScheduledTaskInfo -TaskPath '\AegisProxy\' -TaskName $name
            $state = (Get-ScheduledTask -TaskPath '\AegisProxy\' -TaskName $name).State
          } while (($state -eq 'Running' -or $info.LastRunTime -lt $since) -and (Get-Date) -lt $since.AddMinutes(2))
          Write-Host "state=$state last run=$($info.LastRunTime) result=$($info.LastTaskResult)"
          if ($info.LastTaskResult -ne 0) { throw "log rotation task failed: $($info.LastTaskResult)" }
          if (-not (Get-ChildItem "$env:ProgramData\AegisProxy\logs" -Filter 'control-plane-*.log.zip')) { throw 'log rotation produced no archive' }
      - name: install the data-plane service
        run: |
          $root = Join-Path $env:ProgramData 'AegisProxy'
          # The default installation: the shipped hash lock (data-plane\requirements-lock.txt), wheels only, no resolver.
          ./deploy/windows/Install-AegisDataPlane.ps1 -ControlPlaneUrl http://127.0.0.1:8081 -DataPlaneKeyFile "$root\secrets\dataplane.key" `
            -CaFile "$root\certs\mitmproxy-ca.pem" -WinSWExe "$env:RUNNER_TEMP\WinSW-x64.exe" -PythonExe 'C:\Program Files\Python312\python.exe' -SkipFirewall
          Get-Service AegisDataPlane | Format-List Name, Status, StartType
      - name: end to end through the Windows services
        run: |
          $ErrorActionPreference = 'Stop'
          # Trust the enterprise CA with the product's own roll-out, exactly the command the console hands out
          # (windows_command of /api/public/ca/info), in Windows PowerShell 5.1 as an administrator would: it
          # downloads the installer into memory, compares it with windows_script_sha256, writes those bytes with
          # CreateNew into a new random-named directory and runs that file. A wrong hash must stop it first.
          $info = Invoke-RestMethod http://127.0.0.1:8081/api/public/ca/info
          $sha = "$($info.windows_script_sha256)"
          if ($sha -notmatch '^[0-9A-Fa-f]{64}$' -or -not "$($info.windows_command)".Contains("-ne '$sha'")) { throw "unexpected CA info: $($info | ConvertTo-Json -Compress)" }
          function Invoke-WindowsPowerShell([string]$command) {
            powershell -NoProfile -NonInteractive -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes("$command; exit `$LASTEXITCODE")))
          }
          $out = Invoke-WindowsPowerShell $info.windows_command.Replace($sha, ('0' * 64)) 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $out -notmatch 'SHA-256 mismatch, not running it') { throw "CA installer command with a wrong hash was not refused ($LASTEXITCODE): $out" }
          Invoke-WindowsPowerShell $info.windows_command
          if ($LASTEXITCODE -ne 0) { throw "CA installer failed with exit code $LASTEXITCODE" }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $h = @{ 'X-Requested-With' = 'aegis-ui' }
          Invoke-RestMethod -Method Post http://127.0.0.1:8081/api/auth/login -WebSession $s -Headers $h -ContentType application/json -Body '{"username":"admin","password":"Ci-Windows-Root-Pass-2026"}' | Out-Null
          Invoke-RestMethod -Method Post http://127.0.0.1:8081/api/groups -WebSession $s -Headers $h -ContentType application/json -Body '{"id":"grp-ci","name":"CI","cidrs":["127.0.0.0/8"]}' | Out-Null
          Invoke-RestMethod -Method Post http://127.0.0.1:8081/api/servers -WebSession $s -Headers $h -ContentType application/json -Body '{"id":"srv-ci","hostname":"runner","ip":"127.0.0.1","group_ids":["grp-ci"]}' | Out-Null
          $set = Invoke-RestMethod -Method Post http://127.0.0.1:8081/api/policy-sets -WebSession $s -Headers $h -ContentType application/json -Body '{"kind":"standard","spec":{"name":"CI egress","enabled":true,"group_ids":["grp-ci"],"rules":[{"name":"example","action":"ALLOW","host_pattern":"example.com","path_pattern":"/**","methods":["GET"],"enabled":true}]}}'
          Invoke-RestMethod -Method Post "http://127.0.0.1:8081/api/policy-sets/$($set.id)/publish" -WebSession $s -Headers $h -ContentType application/json -Body '{"comment":"ci"}' | Out-Null
          Start-Sleep -Seconds 15
          $allowed = & curl.exe -s -o NUL -w '%{http_code}' --ssl-no-revoke --proxy http://127.0.0.1:8080 https://example.com/
          $denied  = & curl.exe -s -o NUL -w '%{http_code}' --ssl-no-revoke --proxy http://127.0.0.1:8080 https://www.wikipedia.org/
          Write-Host "allowed=$allowed denied=$denied"
          if ($allowed -ne '200') { throw "allowed destination returned $allowed" }
          if ($denied -notmatch '403|000') { throw "default deny returned $denied" }
          Start-Sleep -Seconds 10   # telemetry batches are flushed every few seconds
          $state = Invoke-RestMethod http://127.0.0.1:8081/api/state -WebSession $s -Headers $h
          if (-not ($state.data_planes | Where-Object healthy)) { throw 'data-plane service does not report' }
          if (-not ($state.flows | Where-Object { $_.host -eq 'example.com' -and $_.verdict -eq 'ALLOWED' })) { throw 'flow not recorded' }
          # Built-in audit rotation: Windows cannot rename the open file from outside, the service rotates it itself.
          $cidrs = (0..119 | ForEach-Object { "10.$([math]::Floor($_ / 256)).$($_ % 256).0/24" })
          $data = Join-Path $env:ProgramData 'AegisProxy\data'
          for ($i = 0; $i -lt 4000 -and -not (Get-ChildItem $data -Filter 'audit.jsonl-*.gz' -ErrorAction SilentlyContinue); $i++) {
            $body = @{ id = 'grp-rot'; name = "rotation $i"; cidrs = @($cidrs[($i % 7)..119] + $cidrs[0..($i % 7)]) } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post http://127.0.0.1:8081/api/groups -WebSession $s -Headers $h -ContentType application/json -Body $body | Out-Null
            if ($i % 40 -eq 39) { Start-Sleep -Milliseconds 1100 }   # generation names have second precision
          }
          Get-ChildItem $data -Filter 'audit.jsonl*' | Format-Table Name, Length
          if (-not (Get-ChildItem $data -Filter 'audit.jsonl-*.gz')) { throw 'audit log was not rotated and compressed' }
          $verify = Invoke-RestMethod http://127.0.0.1:8081/api/audit/verify -WebSession $s -Headers $h
          Write-Host "audit verify: valid=$($verify.valid) events=$($verify.events_checked)"
          if (-not $verify.valid -or $verify.events_checked -lt $i) { throw "audit chain across rotated generations: $($verify | ConvertTo-Json -Compress)" }
      - name: a configuration error is reported in the Application event log
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Services\AegisControlPlane'
          $saved = (Get-ItemProperty $key).Environment
          Stop-Service AegisControlPlane
          Set-ItemProperty $key -Name Environment -Value ([string[]](@($saved | Where-Object { $_ -notlike 'AEGIS_AUDIT_ROTATE_MB=*' }) + 'AEGIS_AUDIT_ROTATE_MB=-1')) -Type MultiString
          $since = Get-Date
          Start-Service AegisControlPlane -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          $ev = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'AegisControlPlane'; Id = 1; StartTime = $since } -ErrorAction SilentlyContinue | Select-Object -First 1
          Set-ItemProperty $key -Name Environment -Value ([string[]]$saved) -Type MultiString
          Start-Service AegisControlPlane
          if (-not $ev -or $ev.Message -notmatch 'AEGIS_AUDIT_ROTATE_MB') { throw "no event log entry with the configuration error: $($ev.Message)" }
          Write-Host "event log: $($ev.Message)"
      - name: uninstall
        if: always()
        run: |
          ./deploy/windows/Install-AegisDataPlane.ps1 -Uninstall -Confirm:$false
          ./deploy/windows/Install-AegisControlPlane.ps1 -Uninstall -Confirm:$false
          if (Get-Service AegisDataPlane, AegisControlPlane -ErrorAction SilentlyContinue) { throw 'services still installed' }
          if (Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\AegisControlPlane') { throw 'event log source still registered' }
      - name: logs
        if: failure()
        run: Get-ChildItem -Recurse "$env:ProgramData\AegisProxy" -Include *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $_"; Get-Content -Tail 80 $_ }

  # Helm chart on Kubernetes with NetworkPolicies enforced (kind + Cilium + CloudNativePG).
  kubernetes:
    runs-on: ubuntu-24.04
    needs: [control-plane, data-plane, frontend]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: kind v0.33.0 (pinned SHA-256)
        run: |
          curl -sSLo /usr/local/bin/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /usr/local/bin/kind" | sha256sum -c -
          chmod +x /usr/local/bin/kind
      # Tagged like the release images (ghcr.io/atomfritte/aegisproxy-*:v2.1.0), which the chart uses by default.
      - run: make images VERSION=2.1.0
      - name: cluster with Cilium and CloudNativePG (chart and manifest pinned by SHA-256)
        run: |
          kind create cluster --config deploy/helm/ci/kind-cilium.yaml --wait 0s
          curl -sSfLo cilium-1.20.3.tgz https://helm.cilium.io/cilium-1.20.3.tgz
          echo "0805a5273118c436c9772bb9566d87ec558d8b25cc2ce5dc32918ecdd36f2c7c  cilium-1.20.3.tgz" | sha256sum -c -
          helm install cilium ./cilium-1.20.3.tgz -n kube-system --set kubeProxyReplacement=true \
            --set k8sServiceHost=aegis-control-plane --set k8sServicePort=6443 --set ipam.mode=kubernetes \
            --set operator.replicas=1 --set hubble.enabled=false
          kubectl -n kube-system rollout status ds/cilium --timeout=600s
          curl -sSfLo cnpg-1.30.1.yaml https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/releases/cnpg-1.30.1.yaml
          echo "37237f145d8138256ea25ae830f87759255665ff08f8d552fdd8224a5ec032fb  cnpg-1.30.1.yaml" | sha256sum -c -
          kubectl apply --server-side -f cnpg-1.30.1.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=600s
          for i in control-plane data-plane console; do kind load docker-image "ghcr.io/atomfritte/aegisproxy-$i:v2.1.0" --name aegis; done
      - name: install the chart (policies enforced, exec probes)
        run: |
          kubectl create namespace aegis
          helm install aegis deploy/helm/aegisproxy -n aegis -f deploy/helm/ci/values-ci.yaml --wait --timeout 20m
          kubectl -n aegis get pods -o wide
      - name: NetworkPolicy connectivity matrix
        run: scripts/verify-networkpolicies.sh aegis aegis-aegisproxy
      - name: diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n aegis describe pods | tail -200
          kubectl -n aegis logs -l app.kubernetes.io/component=control-plane --tail=100 || true

  images:
    runs-on: ubuntu-24.04
    needs: [control-plane, data-plane, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The go line of control-plane/go.mod (what CI's setup-go installs and the floor for source builds) is the Go
      # of the image builds: bump the golang image digest and go.mod together.
      - name: go.mod toolchain floor equals the Go of the image builds
        run: |
          set -euo pipefail
          want="go$(sed -n 's/^go //p' control-plane/go.mod)"
          for f in Dockerfile control-plane/Dockerfile; do
            img=$(sed -n 's/^FROM \(golang:[^ ]*\) AS build$/\1/p' "$f")
            got=$(docker run --rm --network none --entrypoint go "$img" env GOVERSION)
            echo "$f: $img -> $got; control-plane/go.mod -> $want"
            if [ "$got" != "$want" ]; then echo "::error::$f builds with $got, control-plane/go.mod requires $want: bump them together"; exit 1; fi
          done
      - run: make images VERSION=${{ github.sha }} IMAGE_TAG=${{ github.sha }}
      # What the data-plane image actually ships (the mitmproxy base image's packages plus requirements-image.txt
      # and requirements-extra.txt), not only the lock files: its site-packages are copied out of the built image
      # and audited with the hash-locked pip-audit. Unlike the Trivy gate below this also fails on medium/low and
      # unrated advisories.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.14" }
      - name: pip-audit (the packages in the data-plane image)
        env:
          IMAGE: ghcr.io/atomfritte/aegisproxy-data-plane:${{ github.sha }}
        run: scripts/audit-image-python.sh "$IMAGE" "$RUNNER_TEMP/image-audit" mitmproxy msgpack urllib3 tornado brotli yara-x certifi
      - name: vulnerability scan (fails on fixable critical/high)
        # Trivy CLI image pinned by digest (no third-party action in the pipeline).
        env:
          TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          for img in control-plane control-plane-api data-plane console; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
              image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "ghcr.io/atomfritte/aegisproxy-$img:${{ github.sha }}"
          done
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/atomfritte/aegisproxy-control-plane:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-control-plane.spdx.json
