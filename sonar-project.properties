# SonarQube analysis configuration for AegisProxy.
# Run against a local SonarQube with the sonar-scanner CLI (see docs/security/README.md).
sonar.projectKey=aegisproxy
sonar.projectName=AegisProxy
sonar.projectVersion=3.0.0

# Multi-language sources: Go control-plane, Python data-plane addon, TypeScript console.
sonar.sources=control-plane,data-plane/aegis_dp,frontend/src
sonar.tests=frontend/e2e
sonar.sourceEncoding=UTF-8

# Exclude generated/vendored/throwaway content and our own scan outputs.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.claude/**,**/vendor/**,docs/security/**,**/*.min.js,frontend/public/**
# Go test files are analyzed separately; keep the main scan focused on production code.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx
