openapi: 3.1.0
info:
  title: AegisProxy Control-Plane API
  version: 2.1.0
  summary: REST API of the AegisProxy Enterprise zero-trust egress gateway control-plane.
  description: |
    The control-plane API manages policy sets, access requests, learning sessions, the server fleet,
    threat protection, integrations and identities of AegisProxy, and serves the data-plane workers.
    It is the API used by the web console, by SOAR/ITSM integrations and by automation.

    This document is served by every control-plane at `GET /api/openapi.yaml` (no authentication).
    It is kept in sync with the route registrations by a unit test.

    ## Authentication

    | Client | Mechanism | Security scheme |
    |---|---|---|
    | Automation (recommended) | Service-account API key `Authorization: Bearer aegis_sa_…` (created by a Super Admin, shown once) | `serviceAccountKey` |
    | API client with a user account | `POST /api/auth/login` **without** `X-Requested-With` returns a `token`; send `Authorization: Bearer <token>` | `bearerToken` |
    | Web console | `POST /api/auth/login` **with** `X-Requested-With` (or single sign-on) sets the HttpOnly session cookie `aegis_session` | `sessionCookie` |
    | Data-plane workers | `X-Aegis-DataPlane-Key: <AEGIS_DATAPLANE_KEY>` | `dataPlaneKey` |
    | IdP provisioning (SCIM 2.0) | `Authorization: Bearer aegis_scim_…` on `/api/scim/v2/*` only (created by a Super Admin, shown once) | `scimToken` |
    | Prometheus | `Authorization: Bearer <AEGIS_METRICS_TOKEN>` (only when configured) | `metricsToken` |

    When an `Authorization: Bearer` header is present it takes precedence over the session cookie.
    Role and group membership of user sessions are re-validated against the live user record on every
    request; password changes, resets, role changes, account deactivation and logout revoke sessions.
    Service-account keys are checked for expiry, disabled state and the source-CIDR allowlist on every
    request; their actions are audited as `sa:<name>`.

    ### CSRF protection (cookie sessions only)

    Requests authenticated with the `aegis_session` cookie that use an unsafe method (`POST`, `PUT`,
    `PATCH`, `DELETE`) must carry a non-empty `X-Requested-With` header (the web console sends
    `X-Requested-With: aegis-ui`). If the request carries an `Origin` header, it must be same-origin: the
    request host, the host of `AEGIS_PUBLIC_URL`, or an origin listed in `AEGIS_CORS_ORIGINS`. Otherwise the
    request is rejected with `403`. The cookie is `SameSite=Strict` by default. Bearer-authenticated
    requests (tokens and service-account keys) are not subject to this check.

    ### Roles

    | Role | Meaning |
    |---|---|
    | `SUPER_ADMIN` | Everything, including identities (users, service accounts, single sign-on), log export destinations and the Defender integration. |
    | `INFOSEC_APPROVER` | System administration: fleet, groups, threat protection, TLS exceptions, block pages, governance; approvals for all server groups. |
    | `TEAM_LEAD_APPROVER` | Approvals and policy changes for the server groups in `allowed_groups` only (no BLOCK rules, no catch-all hosts, no baseline sets). |
    | `OPERATOR_AUDITOR` | Read-only. |

    Each operation states the required roles. **Any authenticated role** means every role, including
    `OPERATOR_AUDITOR`. **Scoped** means: Super Admin and InfoSec Approver for all server groups, Team Lead
    Approver for their allowed server groups, Operator/Auditor denied (403). Service accounts can hold
    every role except `SUPER_ADMIN`.

    ## Errors

    Errors are JSON objects `{"error": "<message>"}` (schema `Error`). Authorization failures return
    `403` with a message starting with `RBAC Policy:`. Domain errors are mapped as follows: messages
    containing "not found" → `404`, "already …" → `409`, other validation errors → `400`.

    ## Common behaviour

    * Request bodies are JSON. When a `Content-Type` header is sent it must be `application/json`
      (otherwise `415`). Bodies are limited to 1 MiB, or 16 MiB for `/api/dataplane/*` and
      `/api/security/indicators*` (`413` when exceeded).
    * Every response carries `X-Request-ID` (a valid client-supplied `X-Request-ID` of 1-64 characters
      `[A-Za-z0-9_-]` is echoed, otherwise a random ID is generated).
    * Responses under `/api/` carry `Cache-Control: no-store` unless an operation states otherwise.
    * A request with a method that is not registered for a path is answered with `405` by the router
      (plain text, `Allow` header).
    * Cross-origin requests with credentials are only allowed for origins listed in `AEGIS_CORS_ORIGINS`.
      `/api/public/requests` and `/api/public/ca/*` allow any origin without credentials.
    * Timestamps are RFC 3339 strings in UTC.
    * `/api/scim/v2/*` (SCIM 2.0, RFC 7644) deviates where the SCIM standard requires it: bodies are
      `application/scim+json` (`application/json` is accepted), limited to 8 MiB, errors are SCIM error
      documents (also for unknown paths and wrong methods), and `PATCH` is used.
  contact:
    name: AegisProxy
  license:
    name: Proprietary
    identifier: LicenseRef-AegisProxy-Proprietary
servers:
  - url: /
    description: The control-plane that serves this document (AEGIS_PUBLIC_URL).
security:
  - sessionCookie: []
  - serviceAccountKey: []
  - bearerToken: []
tags:
  - name: Auth
    description: Password login, session and own account.
  - name: SSO
    description: Single sign-on (Microsoft Entra ID / OpenID Connect).
  - name: Users
    description: Console user accounts (Super Admin).
  - name: Service accounts
    description: Non-human API identities for automation (SOAR, CI, Terraform).
  - name: SCIM
    description: SCIM 2.0 user and group provisioning from Microsoft Entra ID and Okta (RFC 7643/7644) and its administration.
  - name: Policy sets
    description: Versioned rule collections with drafts, publishing, simulation, diff and rollback; effective rules and policy simulation.
  - name: Change requests
    description: Four-eyes review of policy set changes.
  - name: Access requests
    description: Self-service access request workflow (review, assignment, comments, revocation, extension).
  - name: Learning sessions
    description: Record traffic of a server and compile it into rules.
  - name: Fleet
    description: Server inventory, quarantine, proxy tokens, import/export and effective policy.
  - name: Groups
    description: Server groups (static CIDRs and dynamic label selectors).
  - name: Block pages
    description: Branded block page templates shown to blocked clients (browser and CLI).
  - name: Threat protection
    description: Threat-protection policy, threat-intelligence feeds, indicators, exceptions and security events.
  - name: YARA
    description: YARA rule sets applied by the data-plane to downloads.
  - name: Integrations
    description: Log export (SIEM/observability) and Microsoft Defender for Endpoint.
  - name: Settings
    description: Governance, notifications (Teams/Slack) and TLS no-break exceptions.
  - name: Audit
    description: Tamper-evident audit trail.
  - name: System
    description: Health, metrics, console state, live flow stream, security posture and the web console.
  - name: Data-plane
    description: API for mitmproxy data-plane workers (X-Aegis-DataPlane-Key).
  - name: Package firewall
    description: Transparent approval of npm, PyPI, NuGet and PowerShell Gallery packages (3.0).
  - name: Sandbox
    description: Package behavior-analysis workers (X-Aegis-Sandbox-Key).
  - name: Public
    description: Unauthenticated endpoints (CA trust bootstrap, self-service block portal, metadata, this document).
paths:
  # ---------------------------------------------------------------------------
  # System
  # ---------------------------------------------------------------------------
  /:
    get:
      tags: [System]
      operationId: getConsoleRoot
      summary: Web console (or API banner)
      description: |
        Serves the bundled web console (single-page application; unknown non-API paths fall back to
        `index.html`, hashed assets under `/assets/` are cacheable for a year). The console is a catch-all
        for `GET` requests outside `/api/`; unknown `GET /api/...` paths return `404` with an `Error` body.

        When no console is bundled (`AEGIS_UI_DIR` unset and no `./ui` or `../frontend/dist`), only `/`
        is served and returns a plain-text banner.
      security: []
      responses:
        '200':
          description: Console page / asset (`text/html`, …) or plain-text banner.
          content:
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
              example: |
                AegisProxy control-plane API is running. The web console is not bundled with this instance (set AEGIS_UI_DIR).
  /healthz:
    get:
      tags: [System]
      operationId: getHealthz
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            text/plain:
              schema:
                type: string
              example: |
                ok
  /readyz:
    get:
      tags: [System]
      operationId: getReadyz
      summary: Readiness probe
      description: Ready when the state is loaded and the storage backend answers within 3 seconds. Fails while draining for shutdown.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: Not ready (`shutting down`, `state not loaded`, `storage unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Prometheus text exposition format (`text/plain; version=0.0.4; charset=utf-8`): HTTP, login,
        evaluation and flow counters, configuration revision, fleet, request and security-event gauges,
        threat-intelligence feed ages, data-plane health, log-export delivery and Go runtime metrics.

        When `AEGIS_METRICS_TOKEN` is configured, `Authorization: Bearer <token>` is required; otherwise
        the endpoint is open (restrict it at the network level).
      security:
        - metricsToken: []
        - {}
      responses:
        '200':
          description: Metrics in Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
              example: |
                aegis_http_requests_total{method="GET",route="/api/state",code="2xx"} 42
                # HELP aegis_build_info Build information.
                # TYPE aegis_build_info gauge
                aegis_build_info{version="2.1.0"} 1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/state:
    get:
      tags: [System]
      operationId: getConsoleState
      summary: Complete console state
      description: |
        The complete state rendered by the web console: fleet, effective rules, policy sets, change
        requests, access requests, learning sessions, TLS exceptions, users, audit events, threat
        protection, bandwidth statistics, data-plane workers and work-queue counters.

        **Roles:** any authenticated role. **Team Leads** receive only the servers, access requests, traffic,
        learning sessions, security events, audit events and policy objects (policy sets, effective rules,
        change requests, TLS exceptions) of their server groups (need-to-know; baseline sets and unscoped
        TLS exceptions apply to every server and stay visible); unattributable bandwidth figures are
        omitted. The notification log is returned to InfoSec Approvers and Super Admins only.

        For integrations prefer the dedicated list endpoints (`/api/requests`, `/api/servers`,
        `/api/policy-sets`, …): this document is large and its shape follows the console.
      parameters:
        - name: exclude_flows
          in: query
          description: '`1` omits the recorded traffic flows (`flows`) from the response.'
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: Console state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleState'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/flows/stream:
    get:
      tags: [System]
      operationId: streamFlows
      summary: Live traffic flows (Server-Sent Events)
      description: |
        Long-lived `text/event-stream` of recorded traffic flows.

        * On connect: `retry: 5000`, then `event: connected` with `data: {"status":"live"}`.
        * Every flow: an unnamed event (`message`) whose `data` is a JSON `TrafficFlow`.
        * Every 25 s: a comment line `: ping` (keep-alive).
        * The session is re-validated every minute; when it is no longer valid the server sends
          `event: session_expired` with `data: {}` and closes the stream.

        At most 200 concurrent stream clients per control-plane. Browsers use `EventSource` (cookie);
        API clients send `Authorization: Bearer`.

        **Roles:** any authenticated role.
      responses:
        '200':
          description: 'Event stream (`Cache-Control: no-cache`, `X-Accel-Buffering: no`).'
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream. The `data` field of unnamed events is a JSON-encoded `TrafficFlow`.
              example: |
                retry: 5000
                event: connected
                data: {"status":"live"}

                data: {"id":"flw-1","timestamp":"2026-10-23T08:00:00Z","server_ip":"10.0.0.5","verdict":"ALLOWED"}

                : ping
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The connection does not support streaming.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Too many live stream clients (200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/system/posture:
    get:
      tags: [System]
      operationId: getSecurityPosture
      summary: Security posture report
      description: |
        Hardening checks (TLS, demo mode, encryption at rest, single sign-on, Super Admin and break-glass
        counts, stale accounts, service-account key expiry and CIDR restrictions, four-eyes review,
        recertification, catch-all rules, audit export, audit chain, threat intelligence, malware
        scanning, DLP, feed health, data-plane workers) with a score (pass = 2, warn = 1, fail = 0 of 2
        points per check; `info` checks are not scored).

        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          description: Posture report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostureReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/simulate/request:
    post:
      tags: [Policy sets]
      operationId: simulateProxyRequest
      summary: Simulate a proxied request (policy dry run)
      description: |
        Evaluates "what would happen if server X requested URL Y?" against the live policy, threat
        protection and TLS exceptions. Outside demo mode this is side-effect free (`dry_run: true`): no
        flows are recorded, no redirect grants are minted and learning sessions are not touched. In demo
        mode (`AEGIS_DEMO_MODE`) users who may approve for the server's groups record the simulated flows.

        With `simulate_redirect: true` and an allowed `github.com` URL whose rule follows redirects, a
        302 to a CDN object is simulated and evaluated as `child_flow`.

        **Roles:** any authenticated role. Team Leads simulate servers of their own groups only; any
        other address or proxy user (unknown or foreign) answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateProxyRequestInput'
      responses:
        '200':
          description: Evaluation result, the (simulated) flow and the CLI block message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateProxyRequestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  # ---------------------------------------------------------------------------
  # Public
  # ---------------------------------------------------------------------------
  /api/openapi.yaml:
    get:
      tags: [Public]
      operationId: getOpenAPISpec
      summary: This OpenAPI document
      description: |
        The OpenAPI 3.1 description of this API, embedded in the control-plane binary. Supports
        conditional requests (`ETag` / `If-None-Match`).
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: ETag of a cached copy.
          schema:
            type: string
      responses:
        '200':
          description: 'The OpenAPI document (`Cache-Control: public, max-age=3600`).'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/yaml:
              schema:
                type: string
        '304':
          description: Not modified.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
  /api/public/meta:
    get:
      tags: [Public]
      operationId: getPublicMeta
      summary: Product metadata and login options
      security: []
      responses:
        '200':
          description: Metadata for the login page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMeta'
  /api/public/ca/info:
    get:
      tags: [Public]
      operationId: getPublicCAInfo
      summary: Interception root CA details
      description: Subject, validity, SHA-256 fingerprint and PEM of the CA used for TLS interception, plus download links. Rate limited (120 requests/minute per client IP); `Cache-Control public, max-age=300`; CORS `*`.
      security: []
      responses:
        '200':
          description: CA details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CAInfo'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/public/ca/aegis-ca.crt:
    get:
      tags: [Public]
      operationId: downloadCACertificateCRT
      summary: Root CA certificate (PEM, .crt)
      description: PEM-encoded CA certificate as attachment `aegis-enterprise-ca.crt`. Rate limited (120/min per IP).
      security: []
      responses:
        '200':
          description: PEM certificate.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
          content:
            application/x-x509-ca-cert:
              schema:
                type: string
              example: |
                -----BEGIN CERTIFICATE-----
                MIIB...
                -----END CERTIFICATE-----
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/public/ca/aegis-ca.pem:
    get:
      tags: [Public]
      operationId: downloadCACertificatePEM
      summary: Root CA certificate (PEM)
      description: Same content as `aegis-ca.crt` (PEM, attachment `aegis-enterprise-ca.crt`). Rate limited (120/min per IP).
      security: []
      responses:
        '200':
          description: PEM certificate.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
          content:
            application/x-x509-ca-cert:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/public/ca/aegis-ca.der:
    get:
      tags: [Public]
      operationId: downloadCACertificateDER
      summary: Root CA certificate (DER)
      description: DER-encoded CA certificate as attachment `aegis-enterprise-ca.der`. Rate limited (120/min per IP).
      security: []
      responses:
        '200':
          description: DER certificate.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
          content:
            application/pkix-cert:
              schema:
                type: string
                format: binary
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/public/ca/install-linux.sh:
    get:
      tags: [Public]
      operationId: getLinuxCAInstallScript
      summary: Linux CA trust installer
      description: |
        Bash script that downloads the CA from `AEGIS_PUBLIC_URL`, refuses a download that is not exactly
        one certificate, verifies its pinned SHA-256 fingerprint and installs only that certificate
        (re-encoded by openssl) into the Debian/Ubuntu/Alpine, RHEL/Fedora or SLES trust store, and
        sets `SSL_CERT_FILE`, `REQUESTS_CA_BUNDLE`, `PIP_CERT`, `GIT_SSL_CAINFO` and `NODE_EXTRA_CA_CERTS`.
        Never pipe it into a shell: use `linux_command` from `/api/public/ca/info` (shown in the console),
        which downloads the script, checks it against `linux_script_sha256` and only then runs it with sudo.
        Plain-http deployments get an additional warning in the script. Rate limited (120/min per IP).
      security: []
      responses:
        '200':
          description: Shell script.
          content:
            text/x-shellscript:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/public/ca/install-windows.ps1:
    get:
      tags: [Public]
      operationId: getWindowsCAInstallScript
      summary: Windows CA trust installer
      description: |
        PowerShell script (run elevated) that refuses a download that is not byte for byte the pinned
        DER certificate (PKCS#7 bundles, PFX, PEM, trailing data), adds only that certificate to
        `Cert:\LocalMachine\Root`, writes a PEM copy for Node.js and optionally (`$env:AEGIS_PROXY`)
        configures the WinHTTP and machine-wide proxy. Served as `text/plain` (`Content-Disposition:
        inline; filename="install-windows.ps1"`). Never pipe it into `iex`: use `windows_command` from
        `/api/public/ca/info`, which checks the download against `windows_script_sha256` before running it.
        Rate limited (120/min per IP).
      security: []
      responses:
        '200':
          description: PowerShell script.
          content:
            text/plain:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/public/requests:
    post:
      tags: [Public]
      operationId: createPublicAccessRequest
      summary: Submit a self-service access request
      description: |
        Used by the block page and by the CLI one-liner printed in block messages. With a `block_token`
        (signed by a data-plane worker) server identity, URL and method are attested by the proxy and the
        request is `verified`; without a token the TCP source address identifies the server, `requested_url`
        and `method` are taken from the body and the request is flagged as unverified.

        An identical pending request for the same server, host and path is de-duplicated (`200`).
        `requested_scope` and `duration` must be offered by the block page template of the server's groups.
        Rate limited to 20 requests per minute per client IP. CORS `*` without credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAccessRequestInput'
      responses:
        '201':
          description: Request created; InfoSec and Team Leads are notified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAccessRequestResult'
        '200':
          description: An identical request is already pending; the existing request is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAccessRequestResult'
        '400':
          description: Invalid or expired block token, invalid `requested_url`, or a validation error (reason/requester, scope or duration not offered).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Too many pending access requests (queue full).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    options:
      tags: [Public]
      operationId: preflightPublicAccessRequest
      summary: CORS preflight for the access request endpoint
      description: Answers browser preflight requests from block pages served on arbitrary origins (`Access-Control-Allow-Origin *`, methods `GET, POST, OPTIONS`, header `Content-Type`, max age 600 s).
      security: []
      responses:
        '204':
          description: Preflight accepted.
          headers:
            Access-Control-Allow-Origin:
              description: '`*` (when the request carried an `Origin` header).'
              schema:
                type: string
            Access-Control-Allow-Methods:
              description: '`GET, POST, OPTIONS`.'
              schema:
                type: string
  /api/public/request-options:
    get:
      tags: [Public]
      operationId: getPublicRequestOptions
      summary: Options of the self-service request form
      description: |
        Tells the block portal what may be requested for the blocked server (scopes and durations of its
        block page template, branding and support contact). Without `bt` the TCP source address identifies
        the server. `request_form` is false for threat-protection verdicts (except `POLICY_BLOCKED`) or when
        the template disables the form. Rate limited to 20 requests per minute per client IP.
      security: []
      parameters:
        - name: bt
          in: query
          required: false
          description: Block token from the block page / CLI message.
          schema:
            type: string
      responses:
        '200':
          description: Form options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRequestOptions'
        '400':
          description: Invalid or expired block token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with username and password
      description: |
        Verifies local credentials and starts a session. Always sets the HttpOnly `aegis_session` cookie.
        API clients (requests **without** `X-Requested-With`) additionally receive the session as `token`
        for `Authorization: Bearer`; browser requests (with `X-Requested-With`) do not.

        Password login is rejected (`401`) when single sign-on is enabled and `allow_local_login` is false,
        except for break-glass accounts (every such login raises a security alert). Failed attempts are
        throttled per account and per client IP (`429` with `Retry-After`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: '`aegis_session=<token>; Path=/; HttpOnly; SameSite=Strict` (Secure and Domain per configuration).'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password, or password login disabled (`password login is disabled; use single sign-on`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Token signing error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: |
        Revokes the presented user session (cookie or bearer token) and clears the session cookie. Always
        succeeds, also without credentials. Service-account keys are not revoked (rotate or delete the
        account instead). For cookie sessions the token is only revoked when the CSRF check passes.
      security:
        - {}
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: Signed out (`{"status":"signed_out"}`); the session cookie is cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: signed_out
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentIdentity
      summary: Current identity
      description: |
        Returns the signed-in user (`user`, `expires_at`) or, for service-account keys, the service account
        (`service_account`).

        **Roles:** any authenticated role.
      responses:
        '200':
          description: Current identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password:
    post:
      tags: [Auth]
      operationId: changeOwnPassword
      summary: Change own password
      description: |
        Changes the password of the signed-in local user. All other sessions (including bearer tokens) are
        revoked; a fresh session cookie is set for the caller. API clients that use a bearer token must sign
        in again afterwards. Not available for service accounts (`400 user not found`).

        **Roles:** any authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed (`{"status":"password_changed"}`).
          headers:
            Set-Cookie:
              description: New `aegis_session` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: password_changed
        '400':
          description: Current password incorrect, new password too weak or unchanged, invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  # ---------------------------------------------------------------------------
  # SSO
  # ---------------------------------------------------------------------------
  /api/auth/sso/login:
    get:
      tags: [SSO]
      operationId: startSingleSignOn
      summary: Start single sign-on (browser redirect)
      description: |
        Browser navigation endpoint. Redirects (`302`) to the identity provider's authorization endpoint
        (authorization code flow with PKCE, state and nonce kept in the signed, HttpOnly `aegis_sso`
        cookie scoped to `/api/auth/sso`, valid 10 minutes). On provider configuration or discovery
        failures it redirects to `<console>/login?sso_error=configuration|provider_unreachable`.
      security: []
      parameters:
        - name: next
          in: query
          required: false
          description: Local console path to return to after sign-in (other values fall back to `/`).
          schema:
            type: string
        - name: login_hint
          in: query
          required: false
          description: Passed to the identity provider (ignored when 256 characters or longer).
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the identity provider, or to the console login page with `sso_error`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              description: '`aegis_sso` login-state cookie.'
              schema:
                type: string
        '404':
          description: Single sign-on is not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/sso/callback:
    get:
      tags: [SSO]
      operationId: completeSingleSignOn
      summary: Single sign-on redirect target (browser)
      description: |
        Redirect URI registered at the identity provider. Validates state, exchanges the code (PKCE),
        verifies the ID token and nonce, maps IdP groups to a role (most privileged match wins) and
        provisions/updates the user. On success it sets the `aegis_session` cookie and redirects to the
        console (`next`). On failure it redirects to `<console>/login?sso_error=<code>` with one of:
        `idp_<error>`, `session`, `state`, `disabled`, `configuration`, `token`, `id_token`,
        `group_overage`, `provisioning`, `not_authorized`.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Error code returned by the identity provider.
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the console (signed in) or to the console login page with `sso_error`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              description: '`aegis_session` on success; the `aegis_sso` state cookie is cleared.'
              schema:
                type: string
  /api/settings/sso/test:
    post:
      tags: [SSO]
      operationId: testSingleSignOn
      summary: Test OIDC discovery
      description: |
        Checks OpenID Connect discovery and JWKS reachability for the stored configuration (empty body) or a
        submitted, unsaved configuration (`issuer_url` or `tenant_id`). For submitted configurations the
        stored client secret is never sent to the submitted issuer. Connectivity failures are reported with
        `200` and `ok: false`.

        **Roles:** Super Admin only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntraIDConfig'
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/settings/entra:
    post:
      tags: [SSO]
      operationId: updateSingleSignOnSettings
      summary: Update single sign-on configuration
      description: |
        Stores the OIDC / Microsoft Entra ID configuration (provider, client, issuer, claims, group → role and
        group → server-group mappings, `allow_local_login`). `client_secret` is write-only: empty or masked
        values keep the stored secret. The current configuration (without secret) is part of
        `GET /api/state` (`entra_config`).

        **Roles:** Super Admin (person) only; service-account keys are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntraIDConfig'
      responses:
        '200':
          description: Effective (normalized) configuration without the client secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntraIDConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /api/auth/sso/jwks.json:
    get:
      tags: [SSO]
      operationId: getSingleSignOnClientJwks
      summary: Public keys of the private_key_jwt client keys (JWKS)
      description: |
        JSON Web Key Set (RFC 7517) with the public keys the control-plane uses to sign `private_key_jwt`
        client assertions: the active key, a staged (`next`) key and retired keys during their 7-day grace
        period. Register this URL at IdPs that verify assertions against a JWKS URL (Keycloak client
        authenticator *Signed JWT* with *Use JWKS URL*, Okta, Ping). Each key carries `kid` (RFC 7638
        thumbprint), `alg` (`RS256` or `ES256`), `use: sig`, the self-signed certificate (`x5c`) and its
        thumbprints `x5t` / `x5t#S256`. Private key members are never included. Returns `{"keys":[]}` when no
        key exists. Cacheable (`Cache-Control: public, max-age=300`).
      security: []
      responses:
        '200':
          description: JWK set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSet'
  /api/settings/sso/client-keys:
    get:
      tags: [SSO]
      operationId: listSingleSignOnClientKeys
      summary: List private_key_jwt client keys
      description: |
        Client keys without private key material, active first, with the JWKS URL to register at the IdP.

        **Roles:** any authenticated role (public key material only); `can_edit` is true for Super Admins.
      responses:
        '200':
          description: Client keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOClientKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [SSO]
      operationId: generateSingleSignOnClientKey
      summary: Generate a private_key_jwt client key
      description: |
        Generates a key pair (`RS256`: RSA-3072, default; `ES256`: P-256) and a self-signed certificate valid
        for two years. The private key is stored encrypted (`AEGIS_ENCRYPTION_KEY`) and never returned. The
        first key becomes `active`; later keys are staged as `next` (published in the JWKS at once, certificate
        downloadable) until activated, so that the certificate can be uploaded to the IdP first. With
        `activate: true` the new key replaces the active one immediately. At most one staged key and eight
        keys in total. Audited as `SSO_CLIENT_KEY_GENERATED`.

        **Roles:** Super Admin (person) only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                alg:
                  type: string
                  enum: [RS256, ES256]
                  default: RS256
                activate:
                  type: boolean
                  default: false
                  description: Make the new key active immediately (the previous key is retired).
      responses:
        '201':
          description: Generated key.
          content:
            application/json:
              schema:
                type: object
                required: [key, jwks_uri]
                properties:
                  key:
                    $ref: '#/components/schemas/SSOClientKey'
                  jwks_uri:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/settings/sso/client-keys/{kid}/activate:
    parameters:
      - $ref: '#/components/parameters/ClientKeyId'
    post:
      tags: [SSO]
      operationId: activateSingleSignOnClientKey
      summary: Activate a staged client key (rotation)
      description: |
        Makes a `next` key the signing key. The previous active key becomes `retired`: its private key is
        erased and its public key stays in the JWKS for 7 days (`published_until`), so that IdPs with cached
        keys keep accepting in-flight sign-ins. Upload the new certificate to Entra ID (or let the IdP
        refresh the JWKS) before activating. Audited as `SSO_CLIENT_KEY_ACTIVATED`. No request body.

        **Roles:** Super Admin (person) only.
      responses:
        '200':
          description: Activated key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: '#/components/schemas/SSOClientKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/settings/sso/client-keys/{kid}:
    parameters:
      - $ref: '#/components/parameters/ClientKeyId'
    delete:
      tags: [SSO]
      operationId: deleteSingleSignOnClientKey
      summary: Delete a client key
      description: |
        Removes a staged or retired key immediately (for example after a suspected compromise); it disappears
        from the JWKS. The active key cannot be deleted while `token_auth_method` is `private_key_jwt`
        (`400`). Audited as `SSO_CLIENT_KEY_DELETED`.

        **Roles:** Super Admin (person) only.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/settings/sso/client-certificate:
    get:
      tags: [SSO]
      operationId: downloadSingleSignOnClientCertificate
      summary: Download the certificate of a client key
      description: |
        Self-signed X.509 certificate of a client key (default: the active key) for IdPs that require a
        certificate upload - Microsoft Entra ID: *App registrations → Certificates & secrets → Certificates →
        Upload certificate* accepts `.cer`, `.pem` and `.crt`. The response header
        `X-Certificate-Thumbprint-SHA1` carries the base64url SHA-1 thumbprint (`x5t`) that Entra ID shows
        (hex-encoded) after the upload.

        **Roles:** any authenticated role.
      parameters:
        - name: kid
          in: query
          required: false
          description: 'Key ID (default: the active key).'
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [pem, cer]
            default: pem
          description: '`pem` (PEM, `.pem`) or `cer` (DER, `.cer`).'
      responses:
        '200':
          description: Certificate file.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            X-Certificate-Thumbprint-SHA1:
              description: base64url SHA-1 thumbprint of the certificate (`x5t`).
              schema:
                type: string
          content:
            application/x-pem-file:
              schema:
                type: string
            application/pkix-cert:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Users
  # ---------------------------------------------------------------------------
  /api/users:
    post:
      tags: [Users]
      operationId: upsertUser
      summary: Create or update a user
      description: |
        Creates a local user (no `id`) or updates an existing one (`id`). Without `password` a new user gets a
        generated temporary password, returned once as `temporary_password`. Changes of role, groups,
        disabled state or password revoke the user's sessions. Roles of single sign-on users
        (`auth_provider: oidc`) are managed through the IdP group mapping. Break-glass accounts must be
        Super Admins. You cannot demote or disable yourself or the last active Super Admin.

        Both creation and update return `200`.

        **Roles:** Super Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Saved user (and the generated temporary password for new users without `password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpsertResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        Deletes a user account. You cannot delete your own account or the last active Super Admin (`400`).

        **Roles:** Super Admin only.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Reset a user's password
      description: |
        Sets a random temporary password (returned once) and revokes all sessions of the user. No request body.

        **Roles:** Super Admin only.
      responses:
        '200':
          description: Temporary password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPasswordResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Service accounts
  # ---------------------------------------------------------------------------
  /api/service-accounts:
    get:
      tags: [Service accounts]
      operationId: listServiceAccounts
      summary: List service accounts
      description: |
        Service accounts without key material (`key_prefix` identifies the key).

        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          description: Service accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Service accounts]
      operationId: createServiceAccount
      summary: Create a service account
      description: |
        Creates an API identity and returns its key **once** (`api_key`, format `aegis_sa_<43 base64url
        characters>`). Use it as `Authorization: Bearer <key>`. Service accounts cannot be Super Admins;
        Team Lead accounts need concrete `allowed_groups`; InfoSec accounts always get `["*"]`.
        `expires_at` defaults to one year and must be between 1 hour and 730 days from now. At most 200
        service accounts.

        **Roles:** Super Admin (person) only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountInput'
      responses:
        '201':
          description: Created; the key is shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/service-accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ServiceAccountId'
    put:
      tags: [Service accounts]
      operationId: updateServiceAccount
      summary: Update a service account
      description: |
        Replaces the editable fields (including `disabled`). The key is not changed.

        **Roles:** Super Admin (person) only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountInput'
      responses:
        '200':
          description: Updated service account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      tags: [Service accounts]
      operationId: deleteServiceAccount
      summary: Delete a service account
      description: |
        Deletes the account; its key stops working immediately.

        **Roles:** Super Admin (person) only.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/service-accounts/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/ServiceAccountId'
    post:
      tags: [Service accounts]
      operationId: rotateServiceAccountKey
      summary: Rotate a service-account key
      description: |
        Issues a new key (returned once); the previous key stops working immediately. No request body.

        **Roles:** Super Admin (person) only.
      responses:
        '200':
          description: New key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountKeyRotated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'


  # ---------------------------------------------------------------------------
  # SCIM provisioning: administration
  # ---------------------------------------------------------------------------
  /api/settings/scim:
    get:
      tags: [SCIM]
      operationId: getScimSettings
      summary: SCIM provisioning status
      description: |
        Whether provisioning is enabled, the SCIM base URL to enter in the IdP (`<AEGIS_PUBLIC_URL>/api/scim/v2`),
        the provisioning tokens (metadata only) and statistics: provisioned users (and how many are enabled),
        groups, number of changes and the time of the last change and of the last request.

        **Roles:** InfoSec Approver or Super Admin (`can_edit`: Super Admin person).
      responses:
        '200':
          description: SCIM settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [SCIM]
      operationId: updateScimSettings
      summary: Enable or disable SCIM provisioning
      description: |
        While disabled every SCIM request is answered with `403`; provisioned accounts keep their state.
        Enabling re-applies the group mapping to every SCIM-managed account. Audited as `SCIM_CONFIG_UPDATED`.

        **Roles:** Super Admin (person) only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: SCIM settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/settings/scim/tokens:
    post:
      tags: [SCIM]
      operationId: createScimToken
      summary: Create a SCIM provisioning token
      description: |
        Issues a bearer token for the IdP's provisioning service and returns it **once** (`secret`, format
        `aegis_scim_<43 base64url characters>`); only its SHA-256 digest is stored. Enter it as *Secret Token*
        (Entra ID) or as HTTP header `Authorization: Bearer <token>` (Okta). `expires_at` defaults to one year
        and must be between 1 hour and 730 days from now; at most 5 tokens (create the new token, update the
        IdP, then revoke the old one). SCIM tokens are accepted only by `/api/scim/v2/*`. Audited as
        `SCIM_TOKEN_CREATED`.

        **Roles:** Super Admin (person) only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
                  default: scim
                expires_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Created; the token is shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMTokenIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/settings/scim/tokens/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/SCIMTokenId'
    post:
      tags: [SCIM]
      operationId: rotateScimToken
      summary: Rotate a SCIM provisioning token
      description: |
        Replaces the token value (returned once); the previous value stops working immediately. Audited as
        `SCIM_TOKEN_ROTATED`. No request body.

        **Roles:** Super Admin (person) only.
      responses:
        '200':
          description: New token value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMTokenIssued'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/settings/scim/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/SCIMTokenId'
    delete:
      tags: [SCIM]
      operationId: revokeScimToken
      summary: Revoke a SCIM provisioning token
      description: |
        The token stops working immediately. Audited as `SCIM_TOKEN_REVOKED`.

        **Roles:** Super Admin (person) only.
      responses:
        '200':
          description: Revoked (`{"status":"revoked"}`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # SCIM 2.0 service provider (RFC 7643 / RFC 7644)
  # ---------------------------------------------------------------------------
  /api/scim/v2/ServiceProviderConfig:
    get:
      tags: [SCIM]
      operationId: getScimServiceProviderConfig
      summary: SCIM service provider configuration
      description: |
        Supported features (RFC 7643 section 5): PATCH, filter (`maxResults` 200), ETags; no bulk, sorting or
        password changes; authentication with an OAuth bearer token (the SCIM provisioning token).
      security:
        - scimToken: []
      responses:
        '200':
          description: SCIM service provider configuration.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMObject'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
  /api/scim/v2/ResourceTypes:
    get:
      tags: [SCIM]
      operationId: listScimResourceTypes
      summary: SCIM resource types
      description: |
        `User` (`/Users`, schema extension `urn:ietf:params:scim:schemas:extension:enterprise:2.0:User`) and
        `Group` (`/Groups`), as a list response.
      security:
        - scimToken: []
      responses:
        '200':
          description: SCIM resource types.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
  /api/scim/v2/ResourceTypes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [SCIM]
      operationId: getScimResourceType
      summary: SCIM resource type
      description: |
        One resource type (`User` or `Group`).
      security:
        - scimToken: []
      responses:
        '200':
          description: SCIM resource type.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMObject'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '404':
          $ref: '#/components/responses/SCIMNotFound'
  /api/scim/v2/Schemas:
    get:
      tags: [SCIM]
      operationId: listScimSchemas
      summary: SCIM schemas
      description: |
        Definitions of the attributes AegisProxy stores (User core schema subset, enterprise extension
        `department`, Group). Other attributes sent by an IdP are accepted and ignored.
      security:
        - scimToken: []
      responses:
        '200':
          description: SCIM schemas.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
  /api/scim/v2/Schemas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [SCIM]
      operationId: getScimSchema
      summary: SCIM schema
      description: |
        One schema by URN, e.g. `urn:ietf:params:scim:schemas:core:2.0:User`.
      security:
        - scimToken: []
      responses:
        '200':
          description: SCIM schema.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMObject'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '404':
          $ref: '#/components/responses/SCIMNotFound'
  /api/scim/v2/.search:
    post:
      tags: [SCIM]
      operationId: searchScimResources
      summary: Search users and groups
      description: |
        Searches `/Users` and `/Groups` at once (RFC 7644 section 3.4.3); users are listed before groups.
      security:
        - scimToken: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMSearchRequest'
      responses:
        '200':
          description: Matching resources.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
  /api/scim/v2/Users:
    get:
      tags: [SCIM]
      operationId: listScimUsers
      summary: List or filter users
      description: |
        SCIM-managed accounts (local and break-glass accounts are never listed). Supported filters: every
        operator of RFC 7644 (`eq ne co sw ew gt ge lt le pr`, `and`, `or`, `not ( )`, value paths), e.g.
        `userName eq "a@corp.example"` (Entra ID and Okta matching), `externalId eq "<objectId>"`,
        `emails[type eq "work"].value eq "a@corp.example"`. `userName` is compared case-insensitively,
        `id`/`externalId` case-exactly. Pagination with `startIndex` (1-based) and `count` (default and maximum 200).
      security:
        - scimToken: []
      parameters:
        - $ref: '#/components/parameters/SCIMFilter'
        - $ref: '#/components/parameters/SCIMStartIndex'
        - $ref: '#/components/parameters/SCIMCount'
        - $ref: '#/components/parameters/SCIMAttributes'
        - $ref: '#/components/parameters/SCIMExcludedAttributes'
      responses:
        '200':
          description: One page of matching users.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
    post:
      tags: [SCIM]
      operationId: createScimUser
      summary: Create a user
      description: |
        Provisions a console account (`auth_provider: oidc`, no password). Required: `userName` (unique,
        case-insensitive; `409 uniqueness` otherwise). Stored: `externalId`, `active`, `displayName`, `name`,
        `title`, `emails`, enterprise `department`; other attributes (password, phone numbers, addresses, manager,
        `groups` …) are ignored. The console username is derived from `userName` like single sign-on does (`@` →
        `.`); it never takes over a local account or the name of a deleted user's record (a suffix is added). A
        single-sign-on account that signed in before with `externalId` as its subject is taken over instead of
        duplicated (`USER_LINKED_SCIM`), and a user deleted earlier by SCIM is revived when the `externalId` is
        the same (compared exactly; a `userName` alone never revives a record or takes over an account). Role and
        Team Lead scope come from the SCIM groups the user is a member of (see `Groups`); without a mapped group
        the account stays disabled. Audited as `USER_PROVISIONED_SCIM`.
      security:
        - scimToken: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMUser'
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMUser'
      responses:
        '201':
          description: Created user.
          headers:
            Location:
              description: URI of the new resource (`meta.location`).
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '409':
          $ref: '#/components/responses/SCIMConflict'
        '413':
          $ref: '#/components/responses/SCIMPayloadTooLarge'
        '415':
          $ref: '#/components/responses/SCIMUnsupportedMediaType'
  /api/scim/v2/Users/.search:
    post:
      tags: [SCIM]
      operationId: searchScimUsers
      summary: Search users (POST)
      description: |
        Same as `GET /api/scim/v2/Users` with the query in the body (RFC 7644 section 3.4.3).
      security:
        - scimToken: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMSearchRequest'
      responses:
        '200':
          description: One page of matching users.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
  /api/scim/v2/Users/{id}:
    parameters:
      - $ref: '#/components/parameters/SCIMResourceId'
    get:
      tags: [SCIM]
      operationId: getScimUser
      summary: Get a user
      description: |
        One SCIM-managed account. `groups` lists its SCIM groups (read-only). `meta.version` / `ETag` change with
        every update.
      security:
        - scimToken: []
      parameters:
        - $ref: '#/components/parameters/SCIMAttributes'
        - $ref: '#/components/parameters/SCIMExcludedAttributes'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The user.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '304':
          description: Not modified (`If-None-Match` matched).
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '404':
          $ref: '#/components/responses/SCIMNotFound'
    put:
      tags: [SCIM]
      operationId: replaceScimUser
      summary: Replace a user
      description: |
        Replaces all writable attributes (absent attributes are cleared; absent `active` means active). Changing
        `active` to false disables the account and revokes its sessions at once (`USER_DEPROVISIONED_SCIM`).
        Changing `externalId` (here or with PATCH) removes the single sign-on link and revokes the sessions
        (`USER_UNLINKED_SSO`): only a subject equal to the new `externalId` links the account again.
      security:
        - scimToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMUser'
      responses:
        '200':
          description: Updated user.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '404':
          $ref: '#/components/responses/SCIMNotFound'
        '409':
          $ref: '#/components/responses/SCIMConflict'
        '412':
          $ref: '#/components/responses/SCIMPreconditionFailed'
    patch:
      tags: [SCIM]
      operationId: patchScimUser
      summary: Modify a user (PATCH)
      description: |
        RFC 7644 PATCH with `add`, `replace`, `remove` (`op` is case-insensitive, Entra ID sends `Add`/`Replace`).
        Supported paths include `active`, `displayName`, `name.givenName`, `emails[type eq "work"].value`,
        `urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:department`, and path-less values such as
        `{"op":"replace","value":{"active":false}}` (Okta). Booleans sent as strings (`"False"`) are accepted.
        Attributes AegisProxy does not store are ignored; read-only attributes are ignored in path-less values and
        rejected with `400 mutability` when addressed by `path`. `active: false` disables the account and revokes
        its sessions immediately.
      security:
        - scimToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMPatchOp'
      responses:
        '200':
          description: The modified user.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '404':
          $ref: '#/components/responses/SCIMNotFound'
        '409':
          $ref: '#/components/responses/SCIMConflict'
        '412':
          $ref: '#/components/responses/SCIMPreconditionFailed'
    delete:
      tags: [SCIM]
      operationId: deleteScimUser
      summary: Delete a user
      description: |
        Deprovisions the account: it is disabled, all sessions are revoked, its single sign-on link is removed
        (`USER_UNLINKED_SSO`), it leaves every SCIM group and is no longer a SCIM resource (`404` afterwards). The
        console record stays (disabled) for the audit trail; provisioning a user with the same `externalId`
        revives it. Audited as `USER_DEPROVISIONED_SCIM`.
      security:
        - scimToken: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '404':
          $ref: '#/components/responses/SCIMNotFound'
  /api/scim/v2/Groups:
    get:
      tags: [SCIM]
      operationId: listScimGroups
      summary: List or filter groups
      description: |
        SCIM groups, e.g. `GET /Groups?excludedAttributes=members&filter=displayName eq "AegisProxy Admins"`
        (Entra ID) or `filter=displayName eq "…"&startIndex=1&count=100` (Okta).
      security:
        - scimToken: []
      parameters:
        - $ref: '#/components/parameters/SCIMFilter'
        - $ref: '#/components/parameters/SCIMStartIndex'
        - $ref: '#/components/parameters/SCIMCount'
        - $ref: '#/components/parameters/SCIMAttributes'
        - $ref: '#/components/parameters/SCIMExcludedAttributes'
      responses:
        '200':
          description: One page of matching groups.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
    post:
      tags: [SCIM]
      operationId: createScimGroup
      summary: Create a group
      description: |
        Creates a group. `displayName` is required and unique (case-insensitive). The group's `displayName` and
        `externalId` (Entra ID: the group object ID) are matched against the single sign-on `group_role_map` and
        `group_scope_map`; members get the most privileged mapped role. `members[].value` must reference
        SCIM-managed users; local accounts and nested groups are ignored. Audited as `GROUP_PROVISIONED_SCIM`.
      security:
        - scimToken: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMGroup'
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMGroup'
      responses:
        '201':
          description: Created group.
          headers:
            Location:
              description: URI of the new resource (`meta.location`).
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '409':
          $ref: '#/components/responses/SCIMConflict'
        '413':
          $ref: '#/components/responses/SCIMPayloadTooLarge'
        '415':
          $ref: '#/components/responses/SCIMUnsupportedMediaType'
  /api/scim/v2/Groups/.search:
    post:
      tags: [SCIM]
      operationId: searchScimGroups
      summary: Search groups (POST)
      description: |
        Same as `GET /api/scim/v2/Groups` with the query in the body (RFC 7644 section 3.4.3).
      security:
        - scimToken: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMSearchRequest'
      responses:
        '200':
          description: One page of matching groups.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
  /api/scim/v2/Groups/{id}:
    parameters:
      - $ref: '#/components/parameters/SCIMResourceId'
    get:
      tags: [SCIM]
      operationId: getScimGroup
      summary: Get a group
      description: |
        One group with its members.
      security:
        - scimToken: []
      parameters:
        - $ref: '#/components/parameters/SCIMAttributes'
        - $ref: '#/components/parameters/SCIMExcludedAttributes'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The group.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
        '304':
          description: Not modified (`If-None-Match` matched).
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '404':
          $ref: '#/components/responses/SCIMNotFound'
    put:
      tags: [SCIM]
      operationId: replaceScimGroup
      summary: Replace a group
      description: |
        Replaces name, `externalId` and the member list; affected members' roles are re-evaluated at once.
      security:
        - scimToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMGroup'
      responses:
        '200':
          description: Updated group.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '404':
          $ref: '#/components/responses/SCIMNotFound'
        '409':
          $ref: '#/components/responses/SCIMConflict'
        '412':
          $ref: '#/components/responses/SCIMPreconditionFailed'
    patch:
      tags: [SCIM]
      operationId: patchScimGroup
      summary: Modify a group (PATCH)
      description: |
        PATCH of `displayName`, `externalId` and `members`: `{"op":"add","path":"members","value":[{"value":"usr-…"}]}`,
        `{"op":"remove","path":"members[value eq \"usr-…\"]"}` (Okta), `{"op":"Remove","path":"members","value":[{"value":"usr-…"}]}`
        (Entra ID: removes only the listed members), `{"op":"replace","value":{"id":"…","displayName":"…"}}` (Okta
        rename). Members that lose their only mapped group are disabled and their sessions revoked.
      security:
        - scimToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMPatchOp'
      responses:
        '200':
          description: The modified group.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
        '400':
          $ref: '#/components/responses/SCIMBadRequest'
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '404':
          $ref: '#/components/responses/SCIMNotFound'
        '409':
          $ref: '#/components/responses/SCIMConflict'
        '412':
          $ref: '#/components/responses/SCIMPreconditionFailed'
    delete:
      tags: [SCIM]
      operationId: deleteScimGroup
      summary: Delete a group
      description: |
        Deletes the group; its members' roles are re-evaluated at once. Audited as `GROUP_DELETED_SCIM`.
      security:
        - scimToken: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/SCIMUnauthorized'
        '403':
          $ref: '#/components/responses/SCIMDisabled'
        '404':
          $ref: '#/components/responses/SCIMNotFound'

  # ---------------------------------------------------------------------------
  # Policy sets
  # ---------------------------------------------------------------------------
  /api/rules:
    get:
      tags: [Policy sets]
      operationId: listEffectiveRules
      summary: Effective (compiled) rules
      description: |
        The rule list enforced by the engine and the data-plane, compiled from the published content of all
        enabled policy sets, with set attribution (`policy_set_id`, `policy_set_name`) and hit counters.
        Rules are edited through policy sets.

        **Roles:** any authenticated role; **Team Leads** see only policy objects of their server groups (see `GET /api/state`).
      responses:
        '200':
          description: Effective rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/policy-sets:
    get:
      tags: [Policy sets]
      operationId: listPolicySets
      summary: List policy sets
      description: |
        All policy sets (standard, baseline and approvals sets) with computed `review_due_at` and
        `review_state`.

        **Roles:** any authenticated role; **Team Leads** see only policy objects of their server groups (see `GET /api/state`).
      responses:
        '200':
          description: Policy sets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicySet'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Policy sets]
      operationId: createPolicySet
      summary: Create a policy set
      description: |
        Creates an unpublished set (`version: 0`) whose content lives in its `draft`; publish it or submit it
        for review. `kind` is `standard` (default; assigned to groups and/or servers) or `baseline` (applies
        to every registered server; InfoSec/Super Admin only). Rule bookkeeping fields
        (`source_session_id`, `access_request_id`) are ignored.

        **Roles:** scoped (Team Leads must assign the set to their own server groups and cannot create
        BLOCK rules, catch-all hosts or baseline sets).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicySetRequest'
      responses:
        '201':
          description: Created policy set (content in `draft`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/policy-sets/export:
    get:
      tags: [Policy sets]
      operationId: exportPolicySets
      summary: Export policy sets (policy as code)
      description: |
        Downloads the published content of the selected sets (all sets when no `id` is given) as a bundle
        (`format: aegisproxy.policy-sets/v1`), without hit counters, as attachment
        `aegis-policy-sets-<timestamp>.json`. Approvals sets are included for reference but skipped on import.

        **Roles:** any authenticated role; **Team Leads** see only policy objects of their server groups (see `GET /api/state`).
      parameters:
        - name: id
          in: query
          required: false
          description: Policy set ID to include (repeat the parameter for several sets).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Policy set bundle.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySetBundle'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/policy-sets/import:
    post:
      tags: [Policy sets]
      operationId: importPolicySets
      summary: Import policy sets (plan or apply)
      description: |
        Plans (`dry_run: true`) or applies a bundle. Sets are matched by `id`, then by name; changes always
        land in **drafts** (publish or submit them as usual). Approvals sets are skipped. The import is
        all-or-nothing: when any set fails, nothing is changed and `422` lists the per-set errors.
        Between 1 and 200 sets per bundle.

        **Roles:** scoped per set (Operator/Auditor denied).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySetImportRequest'
      responses:
        '200':
          description: Plan (dry run) or applied result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySetImportResponse'
        '400':
          description: Unsupported bundle format or number of sets out of range, invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: At least one set failed; nothing was changed. `results` holds the per-set errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySetImportResponse'
  /api/policy-sets/{id}:
    parameters:
      - $ref: '#/components/parameters/PolicySetId'
    get:
      tags: [Policy sets]
      operationId: getPolicySet
      summary: Get a policy set
      description: |
        The set with its version summaries, change requests and the diff between published content and draft.

        **Roles:** any authenticated role; **Team Leads** see only policy objects of their server groups (404 otherwise).
      responses:
        '200':
          description: Policy set details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySetDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Policy sets]
      operationId: deletePolicySet
      summary: Delete a policy set
      description: |
        Deletes the set (its versions are kept for restore); open change requests of the set are withdrawn.
        Approvals sets that still contain rules cannot be deleted (revoke the access requests instead).

        **Roles:** InfoSec Approver or Super Admin.
      parameters:
        - name: reason
          in: query
          required: false
          description: Reason recorded in the audit trail.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/policy-sets/{id}/draft:
    parameters:
      - $ref: '#/components/parameters/PolicySetId'
    put:
      tags: [Policy sets]
      operationId: savePolicySetDraft
      summary: Save the draft
      description: |
        Replaces the working copy of the set. Rule IDs are kept across edits (send them back unchanged);
        new rules get an ID. Bookkeeping fields of rules that are not yet part of the set are ignored. The
        group/server assignment of approvals sets cannot be changed. `400` while the draft is in review.

        **Roles:** scoped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySetDraftRequest'
      responses:
        '200':
          description: The set with the saved draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      tags: [Policy sets]
      operationId: discardPolicySetDraft
      summary: Discard the draft
      description: |
        Discards the working copy (no-op when there is no draft). `400` while the draft is in review.

        **Roles:** scoped.
      responses:
        '200':
          description: Discarded (`{"status":"discarded"}`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: discarded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/policy-sets/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/PolicySetId'
    post:
      tags: [Policy sets]
      operationId: publishPolicySetDraft
      summary: Publish the draft
      description: |
        Publishes the draft as a new immutable version (the last 30 versions are kept). When four-eyes
        review is required (`require_policy_review`), direct publishing returns `409`; Super Admins may
        publish an emergency change (`emergency: true`) with a justification of at least 10 characters.

        **Roles:** scoped; emergency changes Super Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishDraftRequest'
      responses:
        '200':
          description: The published set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySet'
        '400':
          description: No draft, draft in review, missing emergency justification or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Four-eyes review is required; submit the draft as a change request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/policy-sets/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/PolicySetId'
    post:
      tags: [Policy sets]
      operationId: submitPolicySetChange
      summary: Submit the draft for review
      description: |
        Freezes the draft and opens a change request (with diff and traffic impact). The draft is locked
        until the request is approved, rejected or withdrawn. Without `title` a title is generated from the
        diff.

        **Roles:** scoped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitChangeRequest'
      responses:
        '201':
          description: The opened change request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The draft is already in review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/policy-sets/{id}/simulate:
    parameters:
      - $ref: '#/components/parameters/PolicySetId'
    post:
      tags: [Policy sets]
      operationId: simulatePolicySet
      summary: Simulate the impact of a policy set
      description: |
        Replays the recorded traffic window against a candidate spec and reports which requests would change
        verdict. Without `spec` (or with an empty body) the draft, else the published content, is simulated.
        With an explicit `spec` the set does not need to exist.

        **Roles:** any authenticated role. **Team Leads** may only simulate sets they could change (their
        server groups for both the stored and the candidate scope, no baseline sets); only their groups'
        servers and traffic are evaluated.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatePolicySetRequest'
      responses:
        '200':
          description: Impact summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/policy-sets/{id}/diff:
    parameters:
      - $ref: '#/components/parameters/PolicySetId'
    get:
      tags: [Policy sets]
      operationId: diffPolicySet
      summary: Diff two states of a policy set
      description: |
        Compares two states of the set. References: a version number, `published`, `draft` or `empty`.

        **Roles:** any authenticated role; **Team Leads** see only policy objects of their server groups (404 otherwise).
      parameters:
        - name: from
          in: query
          required: false
          description: Base state (default `published`).
          schema:
            type: string
            examples: ['published', '3', 'empty']
        - name: to
          in: query
          required: false
          description: Target state (default `draft`).
          schema:
            type: string
            examples: ['draft', '4']
      responses:
        '200':
          description: Diff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDiff'
        '400':
          description: Invalid reference or the set has no draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Policy set or version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/policy-sets/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/PolicySetId'
    get:
      tags: [Policy sets]
      operationId: listPolicySetVersions
      summary: List published versions
      description: |
        Version summaries, newest first. An unknown set returns an empty list.

        **Roles:** any authenticated role; **Team Leads** see only policy objects of their server groups
        (404 for unknown sets and sets outside their groups).
      responses:
        '200':
          description: Version summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicySetVersionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/policy-sets/{id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/PolicySetId'
      - $ref: '#/components/parameters/VersionNumber'
    get:
      tags: [Policy sets]
      operationId: getPolicySetVersion
      summary: Get a published version
      description: |
        Full immutable version including `spec`.

        **Roles:** any authenticated role; **Team Leads** see only policy objects of their server groups (404 otherwise).
      responses:
        '200':
          description: Version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySetVersion'
        '400':
          description: The version is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/policy-sets/{id}/rollback:
    parameters:
      - $ref: '#/components/parameters/PolicySetId'
    post:
      tags: [Policy sets]
      operationId: rollbackPolicySet
      summary: Restore a previous version
      description: |
        Restores a kept version: published directly when review is not required (`published: true`),
        otherwise prepared as a draft for a change request (`published: false`). `400` while a draft is in
        review or when the version no longer validates against the current fleet.

        **Roles:** scoped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: Rollback result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Policy set or version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/policy-sets/{id}/recertify:
    parameters:
      - $ref: '#/components/parameters/PolicySetId'
    post:
      tags: [Policy sets]
      operationId: recertifyPolicySet
      summary: Recertify a policy set
      description: |
        Confirms that the set is still needed (sets `last_reviewed_at` and resets the review due date).
        The body is optional.

        **Roles:** scoped.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: The recertified set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  # ---------------------------------------------------------------------------
  # Change requests
  # ---------------------------------------------------------------------------
  /api/change-requests:
    get:
      tags: [Change requests]
      operationId: listChangeRequests
      summary: List change requests
      description: |
        Change requests, newest first (at most 2000 are kept).

        **Roles:** any authenticated role; **Team Leads** see only policy objects of their server groups (see `GET /api/state`).
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by status (exact match).
          schema:
            $ref: '#/components/schemas/ChangeRequestStatus'
      responses:
        '200':
          description: Change requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangeRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/change-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    get:
      tags: [Change requests]
      operationId: getChangeRequest
      summary: Get a change request
      description: |
        Including `spec`, `diff`, `impact` and `reviews`.

        **Roles:** any authenticated role; **Team Leads** see only policy objects of their server groups (404 otherwise).
      responses:
        '200':
          description: Change request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/change-requests/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    post:
      tags: [Change requests]
      operationId: reviewChangeRequest
      summary: Approve, reject or comment on a change request
      description: |
        `approve` publishes the change; `reject` unlocks the draft; `comment` only records a review entry.
        Four-eyes principle: the author and whoever last edited the draft cannot approve, the author cannot
        reject, and service accounts cannot approve. When the set was published meanwhile, approval marks
        the request `superseded` and returns `409` with the updated `change_request`. Change requests
        carrying an access-request approval (`access_request_id`) are rebased instead and grant the
        request when approved.

        **Roles:** scoped — every decision, `comment` included, needs the rights to manage the set
        (InfoSec and Super Admins always; Auditors are read-only). Change requests outside a Team
        Lead's view answer 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReviewRequest'
      responses:
        '200':
          description: The updated change request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          description: Invalid decision, four-eyes violation or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The change request is already decided (`Error`), or it was superseded by another publication (`ChangeRequestSuperseded`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChangeRequestSuperseded'
                  - $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/change-requests/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ChangeRequestId'
    post:
      tags: [Change requests]
      operationId: withdrawChangeRequest
      summary: Withdraw a change request
      description: |
        Withdraws an open change request and unlocks the draft. No request body.

        **Roles:** the author, InfoSec Approver or Super Admin.
      responses:
        '200':
          description: Withdrawn (`{"status":"withdrawn"}`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: withdrawn
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------------------
  # Settings
  # ---------------------------------------------------------------------------
  /api/settings/governance:
    get:
      tags: [Settings]
      operationId: getGovernanceSettings
      summary: Get governance settings
      description: |
        Change-management and request-handling settings.

        **Roles:** any authenticated role.
      responses:
        '200':
          description: Governance settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Settings]
      operationId: updateGovernanceSettings
      summary: Update governance settings
      description: |
        Replaces the governance settings (send the full object). `last_digest_at`, `updated_at` and
        `updated_by` are maintained by the server.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceSettings'
      responses:
        '200':
          description: Saved settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/settings/notifications:
    post:
      tags: [Settings]
      operationId: updateNotificationSettings
      summary: Update Teams/Slack notification settings
      description: |
        Webhook URLs are secrets: responses contain them masked (`https://host/••••••`); sending a masked
        value back keeps the stored URL. The current configuration is part of `GET /api/state`
        (`notify_config`).

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationConfig'
      responses:
        '200':
          description: Saved configuration (webhook URLs masked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/settings/notifications/test:
    post:
      tags: [Settings]
      operationId: testNotifications
      summary: Send a test notification
      description: |
        Queues a synthetic access-request notification to the configured channels. No request body.

        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          description: Queued, with the recent delivery log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tls-bypass:
    post:
      tags: [Settings]
      operationId: createTLSBypassRule
      summary: Add a TLS no-break exception
      description: |
        Traffic to matching hosts is passed through without TLS interception (certificate pinning, mutual
        TLS). `pattern` is a host name or `*.domain` (catch-all and TLD wildcards are rejected); unscoped
        rules (no `group_ids`/`server_ids`) never apply to strict-isolation groups. `match_type`, `id`,
        `added_by`, `created_at` and `enabled` (always `true` on creation) are set by the server.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TLSBypassRule'
      responses:
