# Signed, attested release images (tags v*): GHCR, SBOM attached as attestation, cosign keyless signing.
# Nothing is published unless the tag matches the product version and every CI gate (ci.yml) passes for the
# tagged commit. The jobs that push, sign and release run in the "release" environment: its required
# reviewers, the tag ruleset on refs/tags/v* and branch protection are the actual controls (a writer can edit
# this file on a branch and push a tag); SECURITY.md, "Repository settings required for release integrity".
name: release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  version:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The Helm chart pulls v<appVersion> and the binaries report the Makefile version: a tag that differs from
      # them would publish images that nothing deploys (or mislabel them).
      - name: tag matches the product version (Makefile, console, Helm appVersion)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make=$(sed -n 's/^VERSION ?= *//p' Makefile)
          console=$(jq -r .version frontend/package.json)
          app=$(sed -n 's/^appVersion: *//p' deploy/helm/aegisproxy/Chart.yaml | tr -d '"')
          echo "tag=$TAG Makefile=$make console=$console appVersion=$app"
          for v in "$make" "$console" "$app"; do
            if [ "$TAG" != "v$v" ]; then
              echo "::error::tag $TAG does not match version $v (Makefile $make, frontend/package.json $console, Chart.yaml appVersion $app)"
              exit 1
            fi
          done

  # The complete CI pipeline (tests, linters, Windows services, Kubernetes, image scan) on the tagged commit.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [version, verify]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless signing (Sigstore / OIDC)
      attestations: write
      artifact-metadata: write   # storage record of the provenance attestation (actions/attest v4)
    strategy:
      matrix:
        include:
          - { name: control-plane, context: ., file: Dockerfile }
          - { name: control-plane-api, context: control-plane, file: control-plane/Dockerfile }
          - { name: data-plane, context: data-plane, file: data-plane/Dockerfile }
          - { name: console, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit pinned by digest (the default image is the mutable tag buildx-stable-1).
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Optional mirror to Docker Hub: set the repo variable PUBLISH_DOCKERHUB=true and DOCKERHUB_NAMESPACE,
      # plus the secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (a Docker Hub access token, not the password).
      # GHCR stays the primary, attested registry; Docker Hub receives the same (identical-digest) images, signed.
      - if: ${{ vars.PUBLISH_DOCKERHUB == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: docker.io, username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      # A published release tag is never moved to another digest (a second run for the same tag, or a re-run after a
      # partial publish: delete the partial package version first). This catches mistakes only: anyone who can push
      # a tag can also edit this check away, so the control is the tag ruleset on refs/tags/v* plus the reviewers
      # of the release environment. 401/403 (token or manifest) mean the package does not exist yet (GHCR answers
      # 403 for a package nobody can read): the same token pushes below, and a token that can push to an existing
      # package can also read it. Anything else that is not a clear answer fails the job.
      - name: image tag not yet published
        env:
          IMAGE: ${{ github.repository_owner }}/aegisproxy-${{ matrix.name }}
          TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          status=$(curl -sS -o "$RUNNER_TEMP/token.json" -w '%{http_code}' -u "$REGISTRY_USER:$REGISTRY_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull")
          case "$status" in
            200) ;;
            401|403) echo "ghcr.io/$repo does not exist yet (token HTTP $status)"; exit 0 ;;
            *) echo "::error::ghcr.io token request failed (HTTP $status)"; exit 1 ;;
          esac
          token=$(jq -er .token "$RUNNER_TEMP/token.json")
          rm -f "$RUNNER_TEMP/token.json"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$repo/manifests/$TAG")
          case "$code" in
            404|401|403) echo "ghcr.io/$repo:$TAG is not published yet (HTTP $code)" ;;
            200) echo "::error::ghcr.io/$repo:$TAG already exists; a release tag is never overwritten"; exit 1 ;;
            *) echo "::error::cannot tell whether ghcr.io/$repo:$TAG exists (HTTP $code)"; exit 1 ;;
          esac
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          # One build, pushed to GHCR always and to Docker Hub when PUBLISH_DOCKERHUB=true (empty line ignored).
          tags: |
            ghcr.io/${{ github.repository_owner }}/aegisproxy-${{ matrix.name }}:${{ github.ref_name }}
            ${{ vars.PUBLISH_DOCKERHUB == 'true' && format('docker.io/{0}/aegisproxy-{1}:{2}', vars.DOCKERHUB_NAMESPACE, matrix.name, github.ref_name) || '' }}
      # The pushed digest itself (not a rebuild) is scanned before it is signed: an image that fails stays unsigned,
      # and deployments that verify the signature (SECURITY.md) refuse it. Same pinned scanner as ci.yml.
      - name: vulnerability scan of the pushed digest (fails on fixable critical/high)
        env:
          TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REF: ghcr.io/${{ github.repository_owner }}/aegisproxy-${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" \
            image --image-src remote --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$REF"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/aegisproxy-${{ matrix.name }}@${{ steps.build.outputs.digest }}
      # The identical-digest image on Docker Hub, signed by the same keyless identity. Provenance/SBOM
      # attestations below are pushed to GHCR only (OCI referrers support on Docker Hub is limited).
      - name: sign (Docker Hub mirror)
        if: ${{ vars.PUBLISH_DOCKERHUB == 'true' }}
        run: cosign sign --yes docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/aegisproxy-${{ matrix.name }}@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/aegisproxy-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Release assets: the digest of every published image, each verified with exactly the commands SECURITY.md
  # documents (signer = this workflow at this tag), and the Helm chart packaged with those digests pinned. Both
  # files are attested by this workflow and attached to the GitHub release.
  assets:
    needs: publish
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    environment: release
    permissions:
      contents: write      # create the GitHub release
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: image digests (each verified against this workflow's signature and provenance)
        id: digests
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="aegisproxy-$TAG-image-digests.txt"
          : > "$out"
          for name in control-plane control-plane-api data-plane console; do
            img="ghcr.io/$OWNER/aegisproxy-$name"
            digest=$(docker buildx imagetools inspect "$img:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::no digest for $img:$TAG"; exit 1; fi
            cosign verify "$img@$digest" \
              --certificate-identity "https://github.com/$REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            gh attestation verify "oci://$img@$digest" --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$TAG" > /dev/null
            echo "$img@$digest" >> "$out"
            echo "${name//-/_}=$digest" >> "$GITHUB_OUTPUT"
          done
          cat "$out"
      - name: Helm chart with the image digests pinned
        env:
          TAG: ${{ github.ref_name }}
          CONTROL_PLANE: ${{ steps.digests.outputs.control_plane }}
          CONSOLE: ${{ steps.digests.outputs.console }}
          DATA_PLANE: ${{ steps.digests.outputs.data_plane }}
        run: |
          set -euo pipefail
          chart="$RUNNER_TEMP/chart/aegisproxy"
          mkdir -p "$RUNNER_TEMP/chart" && cp -r deploy/helm/aegisproxy "$chart"
          # The first 'digest: ""' of each image block (controlPlane.image, console.image, dataPlane.image).
          awk -v cp="$CONTROL_PLANE" -v console="$CONSOLE" -v dp="$DATA_PLANE" '
            /^[A-Za-z]/ { section = $1 }
            /^    digest: ""/ && !(section in done) {
              d = section == "controlPlane:" ? cp : section == "console:" ? console : section == "dataPlane:" ? dp : ""
              if (d != "") { sub(/digest: ""/, "digest: \"" d "\""); done[section] = 1 }
            }
            { print }' deploy/helm/aegisproxy/values.yaml > "$chart/values.yaml"
          helm package "$chart" --version "${TAG#v}" --app-version "${TAG#v}" --destination .
          helm template t "aegisproxy-${TAG#v}.tgz" --set storage.postgres.url=postgres://u:p@db/aegis --set console.enabled=true \
            --set 'networkPolicy.proxyClientCIDRs={10.0.0.0/8}' > rendered.yaml
          for d in "$CONTROL_PLANE" "$CONSOLE" "$DATA_PLANE"; do
            grep -q "aegisproxy-[a-z-]*:$TAG@$d" rendered.yaml || { echo "::error::$d is not pinned in the packaged chart"; exit 1; }
          done
          if grep -E 'image: .*aegisproxy-' rendered.yaml | grep -v '@sha256:'; then echo "::error::unpinned AegisProxy image in the packaged chart"; exit 1; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            aegisproxy-${{ github.ref_name }}-image-digests.txt
            aegisproxy-*.tgz
      - name: GitHub release with the image digests and the pinned chart
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "AegisProxy $TAG" \
            --notes "Image digests and the Helm chart with the digests pinned, both attested by the release workflow. Verify them and the images as described in SECURITY.md (Release integrity)." \
            "aegisproxy-$TAG-image-digests.txt" "aegisproxy-${TAG#v}.tgz"
