                $ref: '#/components/schemas/TLSBypassRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/tls-bypass/{id}:
    parameters:
      - $ref: '#/components/parameters/TLSBypassId'
    delete:
      tags: [Settings]
      operationId: deleteTLSBypassRule
      summary: Delete a TLS no-break exception
