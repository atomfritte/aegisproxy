# AegisProxy — high-availability reference deployment on one Docker host (for evaluation / testing
# the cluster mode). Production HA spreads these components over several hosts or uses Kubernetes
# (deploy/helm) with a replicated PostgreSQL (Patroni, CloudNativePG or a managed service).
#
#   cd deploy/compose/ha && install -m 600 ../../../.env.example .env && ../../../scripts/gen-secrets.sh >> .env
#   docker compose up -d --build
#
#   Console via load balancer:      http://127.0.0.1:8081   (bundled console, 2 control-plane replicas)
#   Standalone console (nginx):     http://127.0.0.1:8082   (separately hosted frontend, proxies /api)
#   Proxy via load balancer:        <host>:8080             (2 data-plane workers, source-IP affinity)
#   HAProxy stats:                  http://127.0.0.1:8404/stats
#
# The AegisProxy images are always built locally from this checkout ("pull_policy: build"); "docker compose
# pull" only fetches the digest-pinned third-party images.
name: aegisproxy-ha

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

x-cp-env: &cp-env
  AEGIS_STORAGE: postgres
  AEGIS_DATABASE_URL: postgres://aegis:${AEGIS_DB_PASSWORD:?run scripts/gen-secrets.sh}@postgres:5432/aegis?sslmode=disable
  AEGIS_PUBLIC_URL: ${AEGIS_PUBLIC_URL:-http://localhost:8081}
  AEGIS_PROXY_ADDRESS: ${AEGIS_PROXY_ADDRESS:-}
  AEGIS_JWT_SECRET: ${AEGIS_JWT_SECRET:?run scripts/gen-secrets.sh}
  AEGIS_ENCRYPTION_KEY: ${AEGIS_ENCRYPTION_KEY:?run scripts/gen-secrets.sh}
  AEGIS_ENCRYPTION_KEY_PREVIOUS: ${AEGIS_ENCRYPTION_KEY_PREVIOUS:-}  # only during a key rotation
  AEGIS_DATAPLANE_KEY: ${AEGIS_DATAPLANE_KEY:?run scripts/gen-secrets.sh}
  AEGIS_BOOTSTRAP_ADMIN_PASSWORD: ${AEGIS_BOOTSTRAP_ADMIN_PASSWORD:-}
  # Only the load balancer and the console container may set X-Forwarded-For (their current addresses
  # are resolved via Docker DNS). Never trust a whole range: any container in it could pick its own IP.
  AEGIS_TRUSTED_PROXIES: ""
  AEGIS_TRUSTED_PROXY_HOSTS: lb,console
  AEGIS_DEMO_MODE: ${AEGIS_DEMO_MODE:-false}

x-dp-env: &dp-env
  CONTROL_PLANE_URL: http://lb:8081
  AEGIS_DATAPLANE_KEY: ${AEGIS_DATAPLANE_KEY:?run scripts/gen-secrets.sh}
  AEGIS_PUBLIC_URL: ${AEGIS_PUBLIC_URL:-http://localhost:8081}
  DASHBOARD_URL: ${AEGIS_PUBLIC_URL:-http://localhost:8081}
  AEGIS_CLAMD_ADDRESS: tcp://clamav:3310

services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb   # pinned by digest
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_DB: aegis
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:?run scripts/gen-secrets.sh}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  # aegis-ca (key + certificate) is mounted into the data-planes only; the control-planes get
  # aegis-ca-public with the certificate alone.
  ca-init:
    <<: *hardening
    image: ghcr.io/atomfritte/aegisproxy-control-plane:v${AEGIS_VERSION:-2.1.0}
    build: { context: ../../.., args: { VERSION: "${AEGIS_VERSION:-2.1.0}" } }
    pull_policy: build
    command: ["gen-ca", "/certs", "/public"]
    volumes: ["aegis-ca:/certs", "aegis-ca-public:/public"]
    restart: "no"

  control-plane-1: &cp
    <<: *hardening
    image: ghcr.io/atomfritte/aegisproxy-control-plane:v${AEGIS_VERSION:-2.1.0}
    pull_policy: never   # built by ca-init
    depends_on:
      ca-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment: *cp-env
    volumes: ["aegis-ca-public:/certs:ro"]
    tmpfs: ["/data:size=64m,uid=65532,gid=65532,mode=0700"]

  control-plane-2:
    <<: *cp

  lb:
    image: haproxy:3.2-alpine@sha256:dfba86f031bd4c9039f10f8cc5de75991d1b6766d5460f0335b980408503baad   # pinned by digest
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [control-plane-1, control-plane-2]
    volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    ports:
      - "127.0.0.1:8081:8081"
      - "${AEGIS_PROXY_BIND:-0.0.0.0:8080}:8080"
      - "127.0.0.1:8404:8404"

  data-plane-1: &dp
    <<: *hardening
    image: ghcr.io/atomfritte/aegisproxy-data-plane:v${AEGIS_VERSION:-2.1.0}
    build: { context: ../../../data-plane }
    pull_policy: build
    depends_on:
      lb: { condition: service_started }
    environment:
      <<: *dp-env
      AEGIS_WORKER_ID: data-plane-1
    volumes: ["aegis-ca:/certs:ro"]
    tmpfs: ["/tmp:size=128m,mode=1777"]

  data-plane-2:
    <<: *dp
    environment:
      <<: *dp-env
      AEGIS_WORKER_ID: data-plane-2

  # Separately hosted console (static nginx image) — same-origin via /api reverse proxy.
  console:
    <<: *hardening
    image: ghcr.io/atomfritte/aegisproxy-console:v${AEGIS_VERSION:-2.1.0}
    build: { context: ../../../frontend }
    pull_policy: build
    environment:
      AEGIS_API_UPSTREAM: http://lb:8081
    tmpfs: ["/tmp:size=16m,uid=101,gid=101"]
    ports: ["127.0.0.1:8082:8080"]

  # Unprivileged start as in the single-host docker-compose.yml and the Helm chart (the image's /init needs root).
  clamav:
    <<: *hardening
    image: clamav/clamav:1.5@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e   # pinned by digest (tag kept for readability)
    user: "100:101"
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /var/lib/clamav/main.cvd ] && [ ! -f /var/lib/clamav/main.cld ]; then
          echo "Updating initial database"
          sed -e 's|^\(TestDatabases \)|#\1|' -e '$$a TestDatabases no' -e 's|^\(NotifyClamd \)|#\1|' \
            /etc/clamav/freshclam.conf > /tmp/freshclam_initial.conf
          freshclam --foreground --stdout --config-file=/tmp/freshclam_initial.conf
          rm -f /tmp/freshclam_initial.conf
        fi
        freshclam --checks="$${FRESHCLAM_CHECKS:-1}" --daemon --foreground --stdout &
        rm -f /tmp/clamd.sock
        exec clamd --foreground
    volumes: ["clamav-db:/var/lib/clamav"]
    tmpfs:
      - /tmp:size=64m,uid=100,gid=101,mode=0700
      - /var/log/clamav:size=128m,uid=100,gid=101,mode=0750

volumes:
  pg-data:
  aegis-ca:
  aegis-ca-public:
  clamav-db:
