# AegisProxy log export -> Splunk HEC (destination type "splunk_hec", format "json").
# Source types: aegisproxy:traffic, aegisproxy:audit, aegisproxy:security.
# The event time is set by HEC from the "time" field AegisProxy sends with every event.

[aegisproxy:traffic]
KV_MODE = json
SHOULD_LINEMERGE = false
# CIM Web data model
FIELDALIAS-aegis_web = data.server_ip AS src data.server_hostname AS src_host data.host AS dest data.full_url AS url data.method AS http_method data.status_code AS status data.user_agent AS http_user_agent data.bytes_sent AS bytes_out data.bytes_received AS bytes_in data.content_type AS http_content_type data.matched_rule_name AS rule data.resolved_ip AS dest_ip data.port AS dest_port data.data_plane_id AS dvc
EVAL-action = if(match('data.verdict', "^(ALLOWED|LEARNING_ALLOWED|REDIRECT_OBJECT_ALLOWED|TLS_BYPASS)$"), "allowed", "blocked")
EVAL-bytes = 'data.bytes_sent' + 'data.bytes_received'
EVAL-duration = 'data.latency_ms' / 1000
EVAL-category = coalesce('data.threat_category', 'data.verdict')
EVAL-vendor_product = "AegisProxy Egress Gateway"
EVAL-url_domain = 'data.host'

[aegisproxy:audit]
KV_MODE = json
SHOULD_LINEMERGE = false
# CIM Change data model
FIELDALIAS-aegis_change = data.actor AS user data.action AS command data.entity_name AS object data.entity_type AS object_category data.entity_id AS object_id data.category AS change_type
EVAL-action = case(match('data.action', "CREATED|PROVISIONED|REGISTERED"), "created", match('data.action', "DELETED|DECOMMISSIONED|REVOKED"), "deleted", match('data.action', "DENIED"), "blocked", true(), "modified")
EVAL-status = if(match('data.action', "DENIED"), "failure", "success")
EVAL-vendor_product = "AegisProxy Egress Gateway"

[aegisproxy:security]
KV_MODE = json
SHOULD_LINEMERGE = false
# CIM Intrusion Detection data model
FIELDALIAS-aegis_ids = data.type AS signature data.server_ip AS src data.server_hostname AS src_host data.host AS dest data.url AS url data.indicator AS threat_indicator data.source AS ids_type_source data.detail AS description
EVAL-severity = 'data.severity'
EVAL-action = if('data.action' == "blocked", "blocked", "allowed")
EVAL-category = 'data.type'
EVAL-ids_type = "network"
EVAL-vendor_product = "AegisProxy Egress Gateway"
