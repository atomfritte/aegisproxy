id: f3a52a71-044f-56f6-8b43-1037ca8d73d9
name: AegisProxy - Server quarantined
description: |
  A server was isolated from the internet by AegisProxy (manually, by a playbook or automatically through Microsoft Defender). Track the incident until the server is released.
severity: Medium
requiredDataConnectors: []
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Impact
relevantTechniques: []
query: |
  AegisProxy_CL
  | where Stream == "audit" and Action == "SERVER_QUARANTINED"
  | project TimeGenerated, Actor, Message, ServerName = tostring(Data.entity_name)
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: ServerName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 1d
    matchingMethod: AnyAlert
version: 1.0.0
kind: Scheduled
