# AegisProxy - TLS-terminating reverse proxy in front of the control-plane.
# Console (served by the control-plane, AEGIS_UI_DIR) and API share one origin: no CORS needed.
#
# Install: /etc/nginx/conf.d/aegis-console.conf (http context). Replace aegis.corp.example and the
# certificate paths. Requires nginx >= 1.18 (tested with nginx -t on 1.29).
#
# Control-plane settings that MUST match this proxy (/etc/aegis/control-plane.env or Windows service env):
#   AEGIS_PUBLIC_URL=https://aegis.corp.example        the https URL below (Secure cookies, HSTS, links)
#   AEGIS_TRUSTED_PROXIES=127.0.0.1/32,::1/128         the address(es) nginx connects FROM, otherwise
#                                                      rate limits and audit entries see nginx, not the client
#   AEGIS_LISTEN_ADDR=127.0.0.1:8081                   when nginx runs on the same host
# SELinux (RHEL/Rocky): semanage port -a -t http_port_t -p tcp 8081  (or setsebool -P httpd_can_network_connect 1)
#
# Data-plane workers can use the same URL (CONTROL_PLANE_URL=https://aegis.corp.example); the
# X-Aegis-DataPlane-Key header is passed through unchanged.

upstream aegis_control_plane {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    # Cluster mode (AEGIS_STORAGE=postgres): list every replica; no stickiness needed (sessions are JWTs).
    # server 10.10.0.21:8081 max_fails=3 fail_timeout=10s;
    # server 10.10.0.22:8081 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Plain HTTP: redirect everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name aegis.corp.example;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    # nginx >= 1.25.1 prefers "listen 443 ssl;" plus "http2 on;" (the http2 listen parameter still works,
    # with a deprecation warning). Kept for compatibility with Ubuntu 24.04 (1.24) and RHEL 9 (1.20/1.22).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aegis.corp.example;
    server_tokens off;

    # --- TLS -----------------------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/tls/aegis.corp.example.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/aegis.corp.example.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Mozilla "intermediate" cipher suites for TLS 1.2 (TLS 1.3 suites are always enabled).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aegis_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling only works with a public CA / reachable OCSP responder:
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/tls/issuing-ca-chain.pem;

    # --- headers -------------------------------------------------------------------------------------
    # The control-plane already sends CSP, X-Frame-Options, nosniff, Referrer-Policy etc. and HSTS when
    # AEGIS_PUBLIC_URL is https. HSTS is set here authoritatively (also on nginx-generated error pages);
    # the upstream copy is hidden to avoid a duplicate header.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16m;

    # --- common proxy settings -----------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Live traffic stream (Server-Sent Events): no buffering, no compression, long-lived.
    location = /api/flows/stream {
        proxy_pass http://aegis_control_plane;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API (incl. /api/public/* for block pages and CA installers, /api/dataplane/* for workers).
    location /api/ {
        proxy_pass http://aegis_control_plane;
    }

    # Prometheus metrics: only from the monitoring network (additionally protect with AEGIS_METRICS_TOKEN).
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        # allow 10.50.0.0/24;   # Prometheus servers
        deny all;
        proxy_pass http://aegis_control_plane;
    }

    # Probes for external load balancers / monitoring.
    location = /healthz { access_log off; proxy_pass http://aegis_control_plane; }
    location = /readyz  { access_log off; proxy_pass http://aegis_control_plane; }

    # Web console (SPA, served by the control-plane with SPA fallback and cache headers).
    location / {
        proxy_pass http://aegis_control_plane;
    }
}
