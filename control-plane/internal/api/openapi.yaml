  # ---------------------------------------------------------------------------
  # Access requests
  # ---------------------------------------------------------------------------
  /api/requests:
    get:
      tags: [Access requests]
      operationId: listAccessRequests
      summary: List access requests
      description: |
        Access requests, newest first, for ITSM/SOAR integrations. `total` is the number of matches before
        `limit` is applied.

        **Roles:** any authenticated role.
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by status (case-insensitive).
          schema:
            $ref: '#/components/schemas/AccessRequestStatus'
        - name: assigned_to
          in: query
          required: false
          description: Filter by assignee username (case-insensitive).
          schema:
            type: string
        - name: server_id
          in: query
          required: false
          schema:
            type: string
        - name: group_id
          in: query
          required: false
          description: Requests whose `target_group_ids` contain this group.
          schema:
            type: string
        - name: overdue
          in: query
          required: false
          description: '`true` returns only pending requests past `due_at`.'
          schema:
            type: string
            enum: ['true']
        - name: limit
          in: query
          required: false
          description: Maximum number of returned requests (default 500, at most 5000).
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
      responses:
        '200':
          description: Access requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/requests/bulk-review:
    post:
      tags: [Access requests]
      operationId: bulkReviewAccessRequests
      summary: Approve or reject many access requests
      description: |
        Applies the same decision with the requested scope and duration to 1-200 requests. Per-request
        failures are reported in `results[].error`; the call itself succeeds.

        **Roles:** scoped (per request).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkReviewRequest'
      responses:
        '200':
          description: Per-request results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkReviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/requests/{id}:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    get:
      tags: [Access requests]
      operationId: getAccessRequest
      summary: Get an access request
      description: |
        One request including comments.

        **Roles:** any authenticated role.
      responses:
        '200':
          description: Access request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/requests/{id}/review:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [Access requests]
      operationId: reviewAccessRequest
      summary: Approve or reject an access request
      description: |
        Approval adds one rule per target group to that group's approvals policy set (published immediately)
        or, for `learning_session_15m`, starts a learning session. Reviewers may adjust host/path pattern,
        methods (default: read-only plus the requested method), redirects, target groups and duration
        (`1h 8h 24h 7d 30d 90d permanent`; empty = as requested). Team Leads are limited to
        `max_temporary_access_days` and cannot grant permanent access.

        With `require_policy_review`, an approval by a reviewer below InfoSec that goes beyond an
        attested request (unverified request, changed host/path pattern, added methods, longer
        duration, redirects enabled, other target groups) creates one change request per target
        group instead of publishing: the request stays `pending` with `change_request_ids` and is
        granted when another reviewer approves the change request. Rejecting the request withdraws
        open change requests.

        **Roles:** scoped (the reviewer must be allowed to act for the request's own groups and for
        every target group). Requests outside a Team Lead's groups answer 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewOptions'
      responses:
        '200':
          description: Reviewed request and created rules (`rule` is the first rule or null; no rules when the approval went to four-eyes review).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestReviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request was already reviewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/requests/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [Access requests]
      operationId: commentAccessRequest
      summary: Comment on an access request
      description: |
        Appends a discussion entry (at most 100 per request, 2000 characters each).

        **Roles:** scoped (Operator/Auditor denied).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCommentInput'
      responses:
        '200':
          description: The updated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/requests/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [Access requests]
      operationId: assignAccessRequest
      summary: Assign an access request
      description: |
        Sets the responsible reviewer (username; `""` unassigns). The assignee must be an enabled user who
        can approve requests for the request's target groups.

        **Roles:** scoped (Operator/Auditor denied).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequestInput'
      responses:
        '200':
          description: The updated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/requests/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [Access requests]
      operationId: revokeAccessRequest
      summary: Revoke granted access
      description: |
        Removes the rules created by an approved request (status `revoked`) and stops its learning session.
        `reason` is required. Requests that are not `approved` return `400`.

        **Roles:** scoped (Operator/Auditor denied).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequestInput'
      responses:
        '200':
          description: The revoked request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/requests/{id}/extend:
    parameters:
      - $ref: '#/components/parameters/AccessRequestId'
    post:
      tags: [Access requests]
      operationId: extendAccessRequest
      summary: Change the expiry of granted access
      description: |
        Sets a new expiry (from now) for the rules of an approved, rule-based request. Team Leads are
        limited to `max_temporary_access_days` and cannot grant permanent access; with
        `require_policy_review` the new expiry must also lie within `max_temporary_access_days` of
        the original approval (longer access needs InfoSec).

        **Roles:** scoped (Operator/Auditor denied).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendRequestInput'
      responses:
        '200':
          description: The updated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  # ---------------------------------------------------------------------------
  # Learning sessions
  # ---------------------------------------------------------------------------
  /api/sessions:
    post:
      tags: [Learning sessions]
      operationId: startLearningSession
      summary: Start a learning session
      description: |
        Records the traffic of one server (`server_id` may also be its IP) for `duration_minutes` (default 15,
        at most 240). `record_and_allow` (default) lets traffic pass while recording and is not permitted for
        strict-isolation groups; `record_only` keeps enforcing the policy.

        **Roles:** scoped (the caller must be allowed to approve for the server's effective groups).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
      responses:
        '201':
          description: Started session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/sessions/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Learning sessions]
      operationId: stopLearningSession
      summary: Stop a learning session
      description: |
        Stops recording (status `completed`). No request body.

        **Roles:** scoped (session groups).
      responses:
        '200':
          description: Stopped session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The session has already ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/sessions/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Learning sessions]
      operationId: publishLearningSession
      summary: Turn session candidates into policy rules
      description: |
        Adds the selected candidates (`selected: true`, at most 200) as ALLOW rules to an existing policy set
        (`policy_set_id`) or to a new set (`new_set_name` with `target_group_ids` / `target_server_ids`).
        With `publish: true` (and no four-eyes review) the set is published (`published: true`); otherwise the
        rules stay in the set's draft. `rule_prefix` defaults to `Session-Policy`.

        **Roles:** scoped (session groups and the target set).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPublish'
      responses:
        '201':
          description: Rules added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPublishResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The session is still recording; stop it first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/sessions/{id}/simulate:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Learning sessions]
      operationId: simulateLearningSessionTraffic
      summary: Inject sample traffic into a learning session (demo mode only)
      description: |
        Records canned sample flows for demonstrations. Only available with `AEGIS_DEMO_MODE=true`
        (`403` otherwise). The body is optional and parse errors are ignored.

        **Roles:** scoped (session groups).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateSessionRequest'
      responses:
        '200':
          description: Number of recorded sample flows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordedCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The learning session is no longer recording.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  # ---------------------------------------------------------------------------
  # Fleet
  # ---------------------------------------------------------------------------
  /api/servers:
    get:
      tags: [Fleet]
      operationId: listServers
      summary: List registered servers
      description: |
        The server inventory with `last_seen_at` refreshed from recorded traffic.

        **Roles:** any authenticated role.
      responses:
        '200':
          description: Servers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Fleet]
      operationId: upsertServer
      summary: Register or update a server
      description: |
        Creates the server (unknown or empty `id`; an ID `srv-…` is generated when empty) or updates it.
        Token digest, quarantine state, timestamps and Defender data are preserved by the server. IPs and
        `proxy_auth_user` must be unique (`409`). Both creation and update return `200`.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerInput'
      responses:
        '200':
          description: Saved server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/servers/discovered:
    get:
      tags: [Fleet]
      operationId: listDiscoveredSources
      summary: Unregistered sources seen in traffic
      description: |
        Clients that sent traffic through the proxy but are not registered, with suggested IDs, groups
        matched by CIDR, top hosts and user-agent hints (newest first).

        **Roles:** any authenticated role.
      responses:
        '200':
          description: Discovered sources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscoveredSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/servers/import:
    post:
      tags: [Fleet]
      operationId: importServers
      summary: Bulk import servers (CSV or JSON)
      description: |
        Plans (`dry_run: true`) or applies a bulk registration from `csv` (export format, header row
        required, at least the `hostname` column; `group_ids` `;`-separated, `labels` `k=v;k=v`) or from
        `servers` (`csv` wins when both are given). At most 2000 rows. All-or-nothing: when any row fails,
        nothing is changed and `422` lists the per-row errors (also returned for an empty or oversized
        import, then with `results: null`).

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerImportRequest'
      responses:
        '200':
          description: Plan or result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerImportResponse'
        '400':
          description: Malformed CSV or invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Import rejected; nothing was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerImportResponse'
  /api/servers/export:
    get:
      tags: [Fleet]
      operationId: exportServers
      summary: Export the server inventory
      description: |
        CSV (default) with columns `id,hostname,ip,subnet_cidr,proxy_auth_user,group_ids,labels,os,department,owner_team,description`
        (`group_ids` `;`-separated, `labels` `k=v;k=v`, free-text columns protected against formula
        injection) or JSON (`format=json`, without token digests), as attachment
        `aegis-servers-<timestamp>.csv|json`.

        **Roles:** any authenticated role.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: csv
      responses:
        '200':
          description: Server inventory.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
          content:
            text/csv:
              schema:
                type: string
              example: |
                id,hostname,ip,subnet_cidr,proxy_auth_user,group_ids,labels,os,department,owner_team,description
                srv-web-17,web-17.corp.example,10.0.4.17,,web-17,grp-web,env=prod;tier=web,Ubuntu 24.04,IT,Platform,
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/servers/quarantine:
    post:
      tags: [Fleet]
      operationId: quarantineServerByIdentity
      summary: Quarantine or release a server by host name or IP (SOAR)
      description: |
        For SOAR/EDR playbooks. The server is found by FQDN, a unique short host name, or IP (`400` for an
        ambiguous short name, `404` when unknown). `quarantined` defaults to `true`; `reason` is required when
        quarantining. Quarantined servers are denied every destination (verdict `QUARANTINED`).

        **Roles:** quarantine: InfoSec Approver, Super Admin, or Team Lead Approver for servers of their
        groups; release: InfoSec Approver or Super Admin; Operator/Auditor denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineByIdentityRequest'
      responses:
        '200':
          description: The server with its quarantine state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/servers/{id}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    delete:
      tags: [Fleet]
      operationId: deleteServer
      summary: Decommission a server
      description: |
        Removes the server from the inventory (and from policy set assignments).

        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/servers/{id}/rotate-token:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      tags: [Fleet]
      operationId: rotateServerProxyToken
      summary: Issue a new proxy token
      description: |
        Issues a new random proxy token (returned once; only its SHA-256 digest is stored), assigns a
        `proxy_auth_user` if missing, and returns copy-paste onboarding snippets. The previous token stops
        working. No request body.

        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          description: New token and onboarding snippets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateTokenResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/servers/{id}/effective-policy:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      tags: [Fleet]
      operationId: getServerEffectivePolicy
      summary: Effective policy of a server
      description: |
        Everything that applies to one server: static and dynamic groups, applied policy sets and rules,
        TLS exceptions, block page template and blocked file types.

        **Roles:** any authenticated role; **Team Leads** only for servers of their groups (404 otherwise).
      responses:
        '200':
          description: Effective policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/servers/{id}/quarantine:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      tags: [Fleet]
      operationId: setServerQuarantine
      summary: Quarantine or release a server
      description: |
        `reason` is required when quarantining. Setting the current state again is a no-op.

        **Roles:** quarantine: InfoSec Approver, Super Admin, or Team Lead Approver for servers of their
        groups; release: InfoSec Approver or Super Admin; Operator/Auditor denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineRequest'
      responses:
        '200':
          description: The server with its quarantine state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  # ---------------------------------------------------------------------------
  # Groups
  # ---------------------------------------------------------------------------
  /api/groups:
    post:
      tags: [Groups]
      operationId: upsertGroup
      summary: Create or update a server group
      description: |
        Creates or replaces the group with the given `id` (required). Membership is static (server
        `group_ids`), by source CIDR (`cidrs`) or dynamic by labels (`match_labels`, value `*` = any value).
        Both creation and update return `200`.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerGroup'
      responses:
        '200':
          description: Saved group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/groups/{id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete a server group
      description: |
        Groups still assigned to servers, policy sets or TLS exceptions cannot be deleted (`400`). The
        group's empty approvals set is removed with it.

        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Block pages
  # ---------------------------------------------------------------------------
  /api/block-pages:
    get:
      tags: [Block pages]
      operationId: listBlockPages
      summary: List block page templates
      description: |
        Templates, the default template, group assignments, supported locales and text variables.

        **Roles:** any authenticated role.
      responses:
        '200':
          description: Block page templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockPageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Block pages]
      operationId: createBlockPage
      summary: Create a block page template
      description: |
        Creates a template (the `id` is generated; at most 50 templates). `is_default: true` makes it the
        default template.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockPageTemplate'
      responses:
        '200':
          description: Saved template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockPageTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/block-pages/preview:
    post:
      tags: [Block pages]
      operationId: previewBlockPage
      summary: Render an unsaved template
      description: |
        Validates and renders a template with sample data (for an `<iframe sandbox srcdoc>`).

        **Roles:** any authenticated role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockPagePreviewRequest'
      responses:
        '200':
          description: Rendered HTML page and CLI text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockPagePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          description: Rendering failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/block-pages/{id}:
    parameters:
      - $ref: '#/components/parameters/BlockPageId'
    put:
      tags: [Block pages]
      operationId: updateBlockPage
      summary: Update a block page template
      description: |
        Replaces the template. The default template cannot be un-defaulted directly (make another template
        the default instead). Note: an unknown `id` creates a new template with a generated ID.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockPageTemplate'
      responses:
        '200':
          description: Saved template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockPageTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      tags: [Block pages]
      operationId: deleteBlockPage
      summary: Delete a block page template
      description: |
        The default template and templates assigned to groups cannot be deleted (`400`).

        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/block-pages/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/BlockPageId'
    get:
      tags: [Block pages]
      operationId: renderBlockPage
      summary: Standalone preview of a saved template
      description: |
        Renders a saved template with sample data as a standalone page (scripts disabled by CSP) or as CLI
        text (`format=cli`).

        **Roles:** any authenticated role.
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
            enum: [en, de]
        - name: variant
          in: query
          required: false
          description: '`request` (policy block, default) or `threat` (threat-protection / quarantine block).'
          schema:
            type: string
            enum: [request, threat]
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [html, cli]
            default: html
      responses:
        '200':
          description: Rendered block page.
          content:
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Rendering failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Threat protection
  # ---------------------------------------------------------------------------
  /api/security/policy:
    post:
      tags: [Threat protection]
      operationId: updateSecurityPolicy
      summary: Update the threat-protection policy
      description: |
        Replaces the global threat-protection policy enforced by every data-plane worker (send the full
        object; the current policy is `GET /api/state` → `security.policy`).

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityPolicy'
      responses:
        '200':
          description: Saved policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/security/feeds:
    post:
      tags: [Threat protection]
      operationId: upsertThreatFeed
      summary: Create or update a threat-intelligence feed
      description: |
        Updates the feed with the given `id`, otherwise creates a custom feed (at most 64 feeds). For
        built-in feeds only `enabled`, `refresh_minutes`, `match_subdomains` and the auth header can be
        changed. `auth_header_value` is write-only: an empty value keeps the stored secret unless
        `auth_header_name` is removed. Enabled feeds are refreshed immediately. Both creation and update
        return `200`.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatFeed'
      responses:
        '200':
          description: Saved feed (secret redacted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatFeed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/security/feeds/refresh:
    post:
      tags: [Threat protection]
      operationId: refreshThreatFeeds
      summary: Refresh feeds now
      description: |
        Schedules an immediate download of one feed (`{"id": "..."}`) or of all enabled feeds (empty body or
        `{}`). The body is optional.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedRefreshRequest'
      responses:
        '202':
          description: Refresh scheduled (`{"status":"refresh_scheduled"}`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: refresh_scheduled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/security/feeds/{id}:
    parameters:
      - $ref: '#/components/parameters/FeedId'
    delete:
      tags: [Threat protection]
      operationId: deleteThreatFeed
      summary: Delete a custom feed
      description: |
        Built-in feeds cannot be deleted (`400`); disable them instead.

        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/security/indicators:
    post:
      tags: [Threat protection]
      operationId: createIndicator
      summary: Add a custom indicator of compromise
      description: |
        Blocks a domain (also `*.domain`), URL, IP, CIDR (prefix ≥ 8) or SHA-256 file hash everywhere. Values
        are normalized. At most 50,000 custom indicators (use a feed for bulk lists). `category` defaults to
        `custom`; `reason` is required. Request bodies up to 16 MiB are accepted.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Indicator'
      responses:
        '201':
          description: Created indicator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indicator'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/security/indicators/{id}:
    parameters:
      - $ref: '#/components/parameters/IndicatorId'
    delete:
      tags: [Threat protection]
      operationId: deleteIndicator
      summary: Delete a custom indicator
      description: |
        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/security/exceptions:
    post:
      tags: [Threat protection]
      operationId: createThreatException
      summary: Add a false-positive exception
      description: |
        Suppresses threat-intelligence matches for a domain, URL, IP or SHA-256 hash (CIDRs are not
        supported). At most 5,000 exceptions.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatException'
      responses:
        '201':
          description: Created exception.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatException'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/security/exceptions/{id}:
    parameters:
      - $ref: '#/components/parameters/ExceptionId'
    delete:
      tags: [Threat protection]
      operationId: deleteThreatException
      summary: Delete a false-positive exception
      description: |
        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/security/events/{id}/ack:
    parameters:
      - $ref: '#/components/parameters/SecurityEventId'
    post:
      tags: [Threat protection]
      operationId: acknowledgeSecurityEvent
      summary: Acknowledge a security event
      description: |
        No request body.

        **Roles:** InfoSec Approver, Super Admin, or Team Lead Approver for events of their groups.
      responses:
        '200':
          description: Acknowledged (`{"status":"acknowledged"}`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                status: acknowledged
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/security/lookup:
    post:
      tags: [Threat protection]
      operationId: lookupThreatIndicator
      summary: Check a URL, domain, IP or hash against threat intelligence
      description: |
        Read-only lookup across all active threat-intelligence sources (feeds, custom indicators,
        Defender indicators).

        **Roles:** any authenticated role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatLookupRequest'
      responses:
        '200':
          description: Lookup result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatLookupResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------------------
  # YARA
  # ---------------------------------------------------------------------------
  /api/security/yara:
    get:
      tags: [YARA]
      operationId: listYaraRuleSets
      summary: List YARA rule sets
      description: |
        Rule sets (including source) and the data-plane workers with their reported YARA status.

        **Roles:** any authenticated role.
      responses:
        '200':
          description: Rule sets and worker status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YaraRuleSetList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [YARA]
      operationId: createYaraRuleSet
      summary: Create a YARA rule set
      description: |
        Rule sets are linted (syntax is checked by the data-plane engine, YARA-X; a set that fails to compile
        keeps the previous rules active and is reported per worker). At most 256 KiB per set, 2 MiB and 100
        sets in total; `include` statements are not supported.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YaraRuleSet'
      responses:
        '200':
          description: Saved rule set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YaraRuleSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/security/yara/{id}:
    parameters:
      - $ref: '#/components/parameters/YaraRuleSetId'
    put:
      tags: [YARA]
      operationId: updateYaraRuleSet
      summary: Update a YARA rule set
      description: |
        Replaces the rule set. Note: an unknown `id` creates a new rule set with a generated ID.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YaraRuleSet'
      responses:
        '200':
          description: Saved rule set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YaraRuleSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      tags: [YARA]
      operationId: deleteYaraRuleSet
      summary: Delete a YARA rule set
      description: |
        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Integrations: log export
  # ---------------------------------------------------------------------------
  /api/integrations/exports:
    get:
      tags: [Integrations]
      operationId: listExportSinks
      summary: List log export destinations
      description: |
        Destinations (secrets redacted; `has_secret` / `has_client_key` flags, header names with empty
        values), the delivery status of this control-plane replica, the type catalog, the export directory
        and whether the caller may edit (`can_edit`, Super Admins).

        **Roles:** InfoSec Approver or Super Admin.
      responses:
        '200':
          description: Log export configuration and status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportSinkList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Integrations]
      operationId: createExportSink
      summary: Create a log export destination
      description: |
        Forwards audit, traffic and/or security records to a SIEM or observability backend (at most 20
        destinations). Secrets (`secret`, `client_key_pem`, header values) are write-only.

        **Roles:** Super Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportSink'
      responses:
        '200':
          description: Saved destination (secrets redacted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportSink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/integrations/exports/test:
    post:
      tags: [Integrations]
      operationId: testExportSink
      summary: Send a test record
      description: |
        Sends one synthetic record with the given (possibly unsaved) configuration. Omitted secrets are taken
        from the stored destination with the same `id`. Delivery failures are reported with `200` and
        `ok: false`.

        **Roles:** InfoSec Approver or Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportSink'
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/integrations/exports/{id}:
    parameters:
      - $ref: '#/components/parameters/ExportSinkId'
    put:
      tags: [Integrations]
      operationId: updateExportSink
      summary: Update a log export destination
      description: |
        Omitted or empty `secret`, `client_key_pem` (when `client_cert_pem` is kept) and header values keep
        the stored values; `clear_secret: true` removes the secret; omitting a header removes it.

        **Roles:** Super Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportSink'
      responses:
        '200':
          description: Saved destination (secrets redacted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportSink'
        '400':
          $ref: '#/components/responses/BadRequest'
