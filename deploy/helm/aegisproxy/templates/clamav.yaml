{{- if .Values.clamav.enabled }}
{{- $cv := .Values.clamav }}
{{- $sel := dict "root" . "component" "clamav" }}
# ClamAV (clamd) — each replica keeps its own signature database (freshclam runs inside the pod).
# The official image's /init needs root (chown, symlinks in /var); the pod instead runs an equivalent
# start script as the image's clamav user with a read-only root filesystem, no capabilities and the
# RuntimeDefault seccomp profile ("restricted" Pod Security Standard).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aegis.fullname" . }}-clamav
  labels: {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  serviceName: {{ include "aegis.fullname" . }}-clamav
  replicas: {{ $cv.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "aegis.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aegis.selector" $sel | nindent 8 }}
    spec:
      {{- include "aegis.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml $cv.podSecurityContext | nindent 8 }}
      containers:
        - name: clamav
          image: {{ include "aegis.image" (dict "root" . "image" $cv.image) }}
          imagePullPolicy: {{ $cv.image.pullPolicy }}
          securityContext: {{- toYaml $cv.containerSecurityContext | nindent 12 }}
          # Same steps as the image's /init without the root-only parts: initial signature download,
          # freshclam daemon (FRESHCLAM_CHECKS per day), clamd in the foreground.
          command: ["/sbin/tini", "--", "/bin/sh", "-ec"]
          args:
            - |
              if [ ! -f /var/lib/clamav/main.cvd ] && [ ! -f /var/lib/clamav/main.cld ]; then
                echo "Updating initial database"
                sed -e 's|^\(TestDatabases \)|#\1|' -e '$a TestDatabases no' -e 's|^\(NotifyClamd \)|#\1|' \
                  /etc/clamav/freshclam.conf > /tmp/freshclam_initial.conf
                freshclam --foreground --stdout --config-file=/tmp/freshclam_initial.conf
                rm -f /tmp/freshclam_initial.conf
              fi
              freshclam --checks="${FRESHCLAM_CHECKS:-1}" --daemon --foreground --stdout &
              rm -f /tmp/clamd.sock
              exec clamd --foreground
          ports:
            - { name: clamd, containerPort: 3310, protocol: TCP }
          startupProbe:
            {{- if eq .Values.probes.mode "exec" }}
            exec: { command: ["clamdcheck.sh"] }
            timeoutSeconds: 20
            {{- else }}
            tcpSocket: { port: clamd }
            {{- end }}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            {{- if eq .Values.probes.mode "exec" }}
            exec: { command: ["clamdcheck.sh"] }
            timeoutSeconds: 20
            {{- else }}
            tcpSocket: { port: clamd }
            {{- end }}
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["clamdcheck.sh"] }
            periodSeconds: 60
            timeoutSeconds: 20
          resources: {{- toYaml $cv.resources | nindent 12 }}
          volumeMounts:
            - { name: signatures, mountPath: /var/lib/clamav }
            - { name: tmp, mountPath: /tmp }
            - { name: logs, mountPath: /var/log/clamav }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: logs
          emptyDir: { sizeLimit: 128Mi }
      {{- if not $cv.persistence.enabled }}
        - name: signatures
          emptyDir: {}
      {{- end }}
  {{- if $cv.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: signatures
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $cv.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $cv.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-clamav
  labels: {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  selector: {{- include "aegis.selector" $sel | nindent 4 }}
  ports:
    - { name: clamd, port: 3310, targetPort: clamd, protocol: TCP }
{{- end }}
