{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aegis.fullname" . }}
  labels: {{- include "aegis.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if or $ing.tlsSecretName $ing.consoleTlsSecretName }}
  tls:
    {{- if $ing.tlsSecretName }}
    - hosts: [{{ $ing.host | quote }}]
      secretName: {{ $ing.tlsSecretName }}
    {{- end }}
    {{- if and .Values.console.enabled $ing.consoleHost $ing.consoleTlsSecretName }}
    - hosts: [{{ $ing.consoleHost | quote }}]
      secretName: {{ $ing.consoleTlsSecretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aegis.cpService" . }}
                port: { name: http }
    {{- if and .Values.console.enabled $ing.consoleHost }}
    - host: {{ $ing.consoleHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aegis.fullname" . }}-console
                port: { name: http }
    {{- end }}
{{- end }}
