# HAProxy for the AegisProxy HA reference deployment.
global
    log stdout format raw local0 info
    maxconn 20000

defaults
    log global
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

# Control-plane API / console: active-active, health-checked via /readyz (includes DB reachability).
frontend fe_api
    bind :8081
    mode http
    option httplog
    option forwardfor
    default_backend be_api

backend be_api
    mode http
    balance roundrobin
    # Retry on another replica only when the request never reached a server (safe for POST, too).
    retries 3
    option redispatch
    retry-on conn-failure empty-response
    option httpchk GET /readyz
    http-check expect status 200
    server cp1 control-plane-1:8081 check inter 3s fall 2 rise 2 resolvers docker init-addr none
    server cp2 control-plane-2:8081 check inter 3s fall 2 rise 2 resolvers docker init-addr none

# Proxy traffic: plain TCP with source-IP affinity so a client's 302 redirect-object grant (kept in the
# worker that saw the redirect) is honoured by the same worker.
frontend fe_proxy
    bind :8080
    mode tcp
    option tcplog
    default_backend be_proxy

backend be_proxy
    mode tcp
    balance source
    hash-type consistent
    option httpchk GET /readyz
    server dp1 data-plane-1:8080 check port 9091 inter 3s fall 2 rise 2 resolvers docker init-addr none
    server dp2 data-plane-2:8080 check port 9091 inter 3s fall 2 rise 2 resolvers docker init-addr none

frontend stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
