{{- $cp := .Values.controlPlane }}
{{- if $cp.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cp.serviceAccount.name | default (printf "%s-control-plane" (include "aegis.fullname" .)) }}
  labels: {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  {{- with $cp.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
