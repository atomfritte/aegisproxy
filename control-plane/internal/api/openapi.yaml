  # ---------------------------------------------------------------------------
  # Audit
  # ---------------------------------------------------------------------------
  /api/audit/verify:
    get:
      tags: [Audit]
      operationId: verifyAuditChain
      summary: Verify the audit hash chain
      description: |
        Verifies every hash and link of the complete audit trail (database in cluster mode; audit.jsonl and
        its rotated generations in file mode), that it starts at its sealed origin (genesis or a retention
        point), that unkeyed pre-2.1 events occur only in the accepted prefix before the keyed cutover, that
        it reaches the newest event known to the control-plane, and that this event is exactly where the
        sealed checkpoint saved with the configuration says (`checkpoint_matches`: no events cut off the
        end). In cluster mode the anchor, the checkpoint and the trail are read from one database snapshot.
        A broken chain is reported with `200` and `valid: false`; so is an integrity violation detected
        earlier (it stays recorded until the data is restored from a backup) and a legacy prefix that
        still awaits acceptance (`legacy_pending: true`, error starting with `legacy_pending:`). A changed,
        inserted or deleted event found here is recorded as an integrity violation (audited, alerted);
        a trail that does not start at its sealed origin is alerted but not recorded (retention in
        progress). The same verification runs in the background (`AEGIS_AUDIT_VERIFY_INTERVAL`). Single
        flight: while a complete verification is in progress (another request's or the background one),
        the request waits for it and returns its outcome instead of starting another pass.

        **Roles:** Super Admin, InfoSec Approver, Auditor (Team Leads: 403).
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/audit/retention:
    post:
      tags: [Audit]
      operationId: applyAuditRetention
      summary: Re-seal the start of the audit trail after old generations were removed
      description: |
        After the operator removed the oldest audit log generations (or `aegis_audit` rows) for retention,
        the verification reports the missing start. This call verifies the remaining trail completely and
        seals its first event as the new origin; the change is recorded as `AUDIT_RETENTION_APPLIED`.
        `400` when the remaining trail does not verify or still starts at its sealed origin.

        **Roles:** Super Admin.
      responses:
        '200':
          description: Verification of the remaining trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/audit/anchor/accept-legacy:
    post:
      tags: [Audit]
      operationId: acceptLegacyAudit
      summary: Accept the unkeyed pre-2.1 prefix of the audit trail
      description: |
        The first start after an upgrade from a release before 2.1 (or after somebody removed the audit
        chain key and anchor) seals the unkeyed prefix as **pending**: verification fails and the posture
        check `audit-chain` reports `fail` until a Super Admin compares the legacy events with an
        independent copy (the trail exported before the upgrade, the SIEM) and accepts them here. The
        request repeats the number of legacy events and the `event_hash` of the last one as reported by
        `GET /api/audit/verify` (`legacy_events`, `legacy_head`); the rest of the trail must verify. The
        acceptance is recorded as `AUDIT_LEGACY_ACCEPTED` and raises a high-severity security event.
        `400` when nothing awaits acceptance, the confirmation does not match or the trail does not verify.

        **Roles:** Super Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legacy_events, legacy_head]
              properties:
                legacy_events:
                  type: integer
                  minimum: 0
                  description: Number of unkeyed events in the prefix.
                legacy_head:
                  type: string
                  description: '`event_hash` of the last unkeyed event (64 zeros when the prefix is empty).'
      responses:
        '200':
          description: Verification of the trail after the acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/audit/export:
    get:
      tags: [Audit]
      operationId: exportAuditTrail
      summary: Export the complete audit trail (JSON Lines)
      description: |
        Streams the **complete** audit trail as JSON Lines (`application/x-ndjson`, one `AuditEvent` per
        line, oldest first) as attachment `aegis-audit-<timestamp>.jsonl`. Source: the database in cluster
        mode, otherwise `audit.jsonl` and its rotated generations (or the in-memory events). The download may
        be long-running.

        **Roles:** Super Admin, InfoSec Approver, Auditor (Team Leads: 403).
      responses:
        '200':
          description: Audit events, one JSON object per line.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON; every line is an `AuditEvent` object.
              example: |
                {"id":"aud-1","revision":1,"timestamp":"2026-10-01T08:00:00Z","actor":"admin","actor_role":"SUPER_ADMIN","action":"USER_CREATED","category":"IDENTITY","entity_type":"user","entity_id":"usr-1","entity_name":"alice","summary":"Created user alice","prev_hash":"…","event_hash":"…"}
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Data-plane
  # ---------------------------------------------------------------------------
  /api/dataplane/bundle:
    get:
      tags: [Data-plane]
      operationId: getDataPlaneBundle
      summary: Policy bundle for data-plane workers
      description: |
        Everything a worker needs to enforce policy: enabled effective rules (without descriptions), servers
        with effective groups, token digests and quarantine state, active learning sessions, TLS
        exceptions, groups, security policy, YARA rule sets and rendered block page shells. Conditional
        (`ETag: "rev-<revision>-<threat intel version>"`, `304` when unchanged). The request headers report
        the worker heartbeat (shown in `data_planes[]`).
      security:
        - dataPlaneKey: []
      parameters:
        - $ref: '#/components/parameters/DataPlaneIdHeader'
        - $ref: '#/components/parameters/DataPlaneVersionHeader'
        - $ref: '#/components/parameters/DataPlaneClamAVHeader'
        - $ref: '#/components/parameters/DataPlaneYARAHeader'
        - $ref: '#/components/parameters/DataPlaneICAPHeader'
        - $ref: '#/components/parameters/DataPlaneThreatVersionHeader'
        - $ref: '#/components/parameters/DataPlanePolicyAgeHeader'
        - $ref: '#/components/parameters/DataPlanePolicyMaxAgeHeader'
        - $ref: '#/components/parameters/DataPlaneFlowsDroppedHeader'
        - $ref: '#/components/parameters/DataPlaneFlowBacklogHeader'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Policy bundle.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPlaneBundle'
        '304':
          description: Not modified.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/DataPlaneUnauthorized'
  /api/dataplane/threatintel:
    get:
      tags: [Data-plane]
      operationId: getDataPlaneThreatIntel
      summary: Compiled threat-intelligence snapshot
      description: |
        The compiled snapshot of all enabled feeds, custom indicators and exceptions. Sent gzip-encoded
        (`Content-Encoding: gzip`) when the client accepts gzip. Conditional (`ETag: "ti-<version>"`).
      security:
        - dataPlaneKey: []
      parameters:
        - $ref: '#/components/parameters/DataPlaneIdHeader'
        - $ref: '#/components/parameters/DataPlaneVersionHeader'
        - $ref: '#/components/parameters/DataPlaneClamAVHeader'
        - $ref: '#/components/parameters/DataPlaneYARAHeader'
        - $ref: '#/components/parameters/DataPlaneICAPHeader'
        - $ref: '#/components/parameters/DataPlaneThreatVersionHeader'
        - $ref: '#/components/parameters/DataPlanePolicyAgeHeader'
        - $ref: '#/components/parameters/DataPlanePolicyMaxAgeHeader'
        - $ref: '#/components/parameters/DataPlaneFlowsDroppedHeader'
        - $ref: '#/components/parameters/DataPlaneFlowBacklogHeader'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: Accept-Encoding
          in: header
          required: false
          schema:
            type: string
            examples: [gzip]
      responses:
        '200':
          description: Threat-intelligence snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatIntelExport'
        '304':
          description: Not modified.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/DataPlaneUnauthorized'
        '500':
          description: Export failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/dataplane/evaluate:
    post:
      tags: [Data-plane]
      operationId: evaluateRequest
      summary: Server-side policy evaluation
      description: Evaluates one request against the policy (fallback for workers and tooling).
      security:
        - dataPlaneKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '200':
          description: Evaluation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DataPlaneUnauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/dataplane/flows:
    post:
      tags: [Data-plane]
      operationId: recordFlow
      summary: Record one traffic flow
      description: |
        Records a flow observed by a worker (feeds learning sessions, statistics, security events and log export).
        Same delivery semantics as `/api/dataplane/flows/batch`; a flow whose ID is stored already is acknowledged
        without being recorded again.
      security:
        - dataPlaneKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrafficFlow'
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordedFlowId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DataPlaneUnauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/TelemetryUnavailable'
  /api/dataplane/flows/batch:
    post:
      tags: [Data-plane]
      operationId: recordFlowBatch
      summary: Record a batch of traffic flows
      description: |
        Records up to 1,000 flows (`413` for larger batches; body limit 16 MiB). `201` is returned only after
        the flows are stored durably: appended and fsync'd to the flow journal (file storage) or committed to
        PostgreSQL (cluster). Otherwise `503` with `Retry-After`: the worker keeps the batch and resends it.
        Delivery is at least once; flows are de-duplicated by `id` (`duplicate_count`), so a worker must send
        a stable, unique `id` (1-64 characters `[A-Za-z0-9_-]`) per flow.
      security:
        - dataPlaneKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowBatch'
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordedFlowCount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DataPlaneUnauthorized'
        '413':
          description: More than 1,000 flows, or the body exceeds 16 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/TelemetryUnavailable'
