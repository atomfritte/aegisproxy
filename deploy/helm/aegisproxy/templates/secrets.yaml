{{- include "aegis.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "aegis.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
{{- $jwt := .Values.secrets.jwtSecret | default (get $data "jwt-secret" | b64dec) | default (randAlphaNum 64) }}
{{- $dpk := .Values.secrets.dataplaneKey | default (get $data "dataplane-key" | b64dec) | default (randAlphaNum 64) }}
{{- $adm := .Values.secrets.bootstrapAdminPassword | default (get $data "bootstrap-admin-password" | b64dec) | default (printf "Ae7-%s" (randAlphaNum 20)) }}
{{- $met := .Values.secrets.metricsToken | default (get $data "metrics-token" | b64dec) | default (randAlphaNum 40) }}
{{- $enc := .Values.secrets.encryptionKey | default (get $data "encryption-key" | b64dec) | default (randAlphaNum 64) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  jwt-secret: {{ $jwt | b64enc }}
  dataplane-key: {{ $dpk | b64enc }}
  bootstrap-admin-password: {{ $adm | b64enc }}
  metrics-token: {{ $met | b64enc }}
  encryption-key: {{ $enc | b64enc }}
  {{- with .Values.secrets.encryptionKeyPrevious }}
  encryption-key-previous: {{ . | b64enc }}
  {{- end }}
  {{- if and (eq .Values.storage.type "postgres") .Values.storage.postgres.url (not .Values.storage.postgres.existingSecret) (not .Values.storage.postgres.cnpg.enabled) }}
  database-url: {{ .Values.storage.postgres.url | b64enc }}
  {{- end }}
{{- end }}
---
{{- if and (not .Values.ca.existingSecret) .Values.ca.generate }}
{{- $caName := include "aegis.caSecretName" . }}
{{- $existingCA := lookup "v1" "Secret" .Release.Namespace $caName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caName }}
  labels: {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if $existingCA }}
  mitmproxy-ca.pem: {{ index $existingCA.data "mitmproxy-ca.pem" }}
  mitmproxy-ca-cert.pem: {{ index $existingCA.data "mitmproxy-ca-cert.pem" }}
{{- else }}
{{- $ca := genCA .Values.ca.commonName (int .Values.ca.validityDays) }}
  mitmproxy-ca.pem: {{ printf "%s%s" $ca.Key $ca.Cert | b64enc }}
  mitmproxy-ca-cert.pem: {{ $ca.Cert | b64enc }}
{{- end }}
{{- end }}
