# Signed, attested release images (tags v*): GHCR, SBOM attached as attestation, cosign keyless signing.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write      # keyless signing (Sigstore / OIDC)
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: control-plane, context: ., file: Dockerfile }
          - { name: control-plane-api, context: control-plane, file: control-plane/Dockerfile }
          - { name: data-plane, context: data-plane, file: data-plane/Dockerfile }
          - { name: console, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/aegisproxy-${{ matrix.name }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: sign
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/aegisproxy-${{ matrix.name }}@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/aegisproxy-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
