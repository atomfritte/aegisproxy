{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "aegis.fullname" . }}
  labels: {{- include "aegis.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  groups:
    - name: aegisproxy.rules
      rules:
        - alert: AegisDataPlaneFailedClosed
          expr: increase(aegis_dp_hook_errors_total[10m]) > 0
          labels: { severity: critical }
          annotations:
            summary: "AegisProxy worker {{`{{ $labels.pod }}`}} blocked traffic after an internal error"
            description: "A data-plane hook raised an exception and the request was blocked (fail-closed). Check the worker log; repeated errors can indicate an attack on the parser."
        - alert: AegisDataPlanePolicyStale
          expr: aegis_dp_policy_sync_age_seconds > {{ .Values.metrics.prometheusRule.policyStaleSeconds }}
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "AegisProxy worker {{`{{ $labels.pod }}`}} cannot sync policy from the control-plane"
        - alert: AegisDataPlanePolicyExpired
          expr: aegis_dp_policy_stale == 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "AegisProxy worker {{`{{ $labels.pod }}`}} fails closed: its policy is older than AEGIS_POLICY_MAX_AGE"
            description: "The worker answers 503 policy_stale and is not ready until it syncs with the control-plane again."
        - alert: AegisDataPlaneTelemetryLoss
          expr: increase(aegis_dp_flows_dropped_total[30m]) > 0
          labels: { severity: warning }
          annotations:
            summary: "AegisProxy worker {{`{{ $labels.pod }}`}} lost traffic records ({{`{{ $labels.reason }}`}})"
            description: "Traffic records were discarded before the control-plane acknowledged them (memory queue or spool full, rejected batches). See docs/operations.md, Traffic telemetry delivery."
        - alert: AegisControlPlaneTelemetryLoss
          expr: increase(aegis_flows_dropped_total[30m]) > 0
          labels: { severity: warning }
          annotations:
            summary: "The AegisProxy control-plane lost traffic records ({{`{{ $labels.reason }}`}})"
        - alert: AegisAuditLogUnwritable
          expr: aegis_audit_log_writable == 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "The AegisProxy audit log cannot be written: configuration changes are refused"
        - alert: AegisAuditIntegrityViolation
          expr: aegis_audit_trail_intact == 0
          labels: { severity: critical }
          annotations:
            summary: "AegisProxy audit trail integrity violation (missing or invalid anchor or checkpoint, diverged trail)"
            description: "Compare the trail with the SIEM copy and investigate before accepting or restoring anything; see docs/operations.md."
        - alert: AegisAuditLegacyPending
          expr: aegis_audit_legacy_pending == 1
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "Unkeyed pre-2.1 audit events await review and acceptance by a Super Admin"
        - alert: AegisAuditVerificationFailed
          expr: aegis_audit_full_verify_ok == 0
          for: 20m
          labels: { severity: critical }
          annotations:
            summary: "The complete verification of the AegisProxy audit trail fails on {{`{{ $labels.instance }}`}}"
            description: "See the audit-chain item of the posture report and docs/operations.md (audit trail)."
        - alert: AegisAuditVerificationOverdue
          expr: time() - aegis_audit_full_verify_timestamp_seconds > {{ .Values.metrics.prometheusRule.auditVerifyOverdueSeconds }}
          labels: { severity: warning }
          annotations:
            summary: "The complete verification of the AegisProxy audit trail has not finished for too long on {{`{{ $labels.instance }}`}}"
        - alert: AegisClamdUnavailable
          expr: aegis_dp_clamd_available == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "ClamAV is unreachable from worker {{`{{ $labels.pod }}`}} (downloads are handled per av_fail_mode)"
        - alert: AegisICAPErrors
          expr: increase(aegis_dp_icap_scans_total{result="error"}[15m]) > 0
          labels: { severity: warning }
          annotations:
            summary: "ICAP scans fail on worker {{`{{ $labels.pod }}`}} (downloads are handled per icap_fail_mode)"
        - alert: AegisNoHealthyDataPlanes
          expr: max(aegis_dataplanes_healthy) < {{ .Values.metrics.prometheusRule.minHealthyDataPlanes }}
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Fewer healthy AegisProxy workers report to the control-plane than expected"
        - alert: AegisExportFailing
          expr: min by (sink) (aegis_export_sink_healthy) == 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Log export destination {{`{{ $labels.sink }}`}} is failing (records are spooled)"
        - alert: AegisExportDropping
          expr: increase(aegis_export_records_dropped_total[15m]) > 0
          labels: { severity: critical }
          annotations:
            summary: "Log export dropped records (spool full) for {{`{{ $labels.sink }}`}}: SIEM coverage gap"
        - alert: AegisLoginFailures
          expr: sum(increase(aegis_login_total{result="failure"}[10m])) > {{ .Values.metrics.prometheusRule.loginFailures }}
          labels: { severity: warning }
          annotations:
            summary: "Many failed console sign-ins (possible password guessing)"
        - alert: AegisThreatIntelStale
          expr: max by (feed) (aegis_threatintel_feed_age_seconds) > {{ .Values.metrics.prometheusRule.feedStaleSeconds }}
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Threat-intelligence feed {{`{{ $labels.feed }}`}} has not been updated"
{{- end }}
